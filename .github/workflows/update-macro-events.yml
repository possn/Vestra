name: Update macro events

on:
  schedule:
    - cron: "20 5 * * *"
    - cron: "40 7-21 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/update_macro_events.py'
      - 'scripts/macro_calendar_transport.py'
      - 'scripts/enrich_macro_results.py'
      - 'scripts/enrich_macro_results_api.py'
      - 'scripts/enrich_policy_decisions.py'
      - 'scripts/requirements-macro.txt'
      - 'tests/test_update_macro_events.py'
      - 'tests/test_enrich_macro_results.py'
      - 'tests/test_enrich_macro_results_api.py'
      - 'tests/test_enrich_policy_decisions.py'
      - '.github/workflows/update-macro-events.yml'
  pull_request:
    paths:
      - 'scripts/update_macro_events.py'
      - 'scripts/macro_calendar_transport.py'
      - 'scripts/enrich_macro_results.py'
      - 'scripts/enrich_macro_results_api.py'
      - 'scripts/enrich_policy_decisions.py'
      - 'scripts/requirements-macro.txt'
      - 'tests/test_update_macro_events.py'
      - 'tests/test_enrich_macro_results.py'
      - 'tests/test_enrich_macro_results_api.py'
      - 'tests/test_enrich_policy_decisions.py'
      - '.github/workflows/update-macro-events.yml'

permissions:
  contents: write

concurrency:
  group: update-macro-events-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-macro.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-macro.txt

      - name: Validate refresher
        run: |
          python -m py_compile scripts/update_macro_events.py scripts/macro_calendar_transport.py scripts/enrich_macro_results.py scripts/enrich_macro_results_api.py scripts/enrich_policy_decisions.py
          python tests/test_update_macro_events.py
          python tests/test_enrich_macro_results.py
          python tests/test_enrich_macro_results_api.py
          python tests/test_enrich_policy_decisions.py

      - name: Preserve previous verified results
        if: github.event_name != 'pull_request'
        run: cp data/macro-events.json /tmp/vestra-macro-events-previous.json

      - name: Refresh official macro calendar
        if: github.event_name != 'pull_request'
        run: PYTHONPATH=scripts python scripts/macro_calendar_transport.py

      - name: Refresh official BLS result summaries
        if: github.event_name != 'pull_request'
        env:
          VESTRA_MACRO_PREVIOUS: /tmp/vestra-macro-events-previous.json
        run: python scripts/enrich_macro_results.py

      - name: Fill missing CPI/PPI metrics from official BLS API
        if: github.event_name != 'pull_request'
        run: python scripts/enrich_macro_results_api.py

      - name: Normalize policy decision days and refresh ECB results
        if: github.event_name != 'pull_request'
        env:
          VESTRA_MACRO_PREVIOUS: /tmp/vestra-macro-events-previous.json
        run: python scripts/enrich_policy_decisions.py

      - name: Validate published contract
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          p = json.loads(Path('data/macro-events.json').read_text())
          assert p.get('schema_version') == 2
          events = p.get('events') or []
          assert events, 'macro calendar is empty'
          assert {'fed','bls','bea','ecb','census'} <= set((p.get('source_status') or {}).keys())
          future = [e for e in events if e.get('date','') >= date.today().isoformat()]
          assert future, 'macro calendar has no future events'
          allowed_metric_keys = {
              'headline_mom_pct','headline_yoy_pct','core_mom_pct','core_yoy_pct',
              'deposit_facility_pct','main_refinancing_pct','marginal_lending_pct',
          }
          allowed_metric_schemas = {'bls_cpi_v1','bls_ppi_v1','ecb_rates_v1'}
          for e in events:
              assert e.get('date') and e.get('short_title') and e.get('source')
              if e.get('source') in {'ecb','fed'} and e.get('meeting_start'):
                  assert e.get('date') >= e.get('meeting_start')
                  assert 'date_end' not in e
              if e.get('result_status') == 'official_release_summary':
                  assert e.get('source') in {'bls','ecb'}
                  assert e.get('result_summary')
                  metrics = e.get('result_metrics') or {}
                  if e.get('source') == 'bls':
                      assert e.get('short_title') in {'CPI EUA','PPI EUA'}
                      assert str(e.get('source_url','')).startswith('https://www.bls.gov/news.release/')
                      assert 'actual' not in e or e.get('actual') is None
                      if e.get('result_transport') == 'bls_public_api':
                          assert set(metrics) == {'headline_mom_pct','headline_yoy_pct','core_mom_pct','core_yoy_pct'}
                  else:
                      assert e.get('short_title') == 'BCE'
                      assert str(e.get('source_url','')).startswith('https://www.ecb.europa.eu/')
                      assert e.get('result_metric_schema') == 'ecb_rates_v1'
                      assert set(metrics) == {'deposit_facility_pct','main_refinancing_pct','marginal_lending_pct'}
                  if metrics:
                      assert e.get('result_metric_schema') in allowed_metric_schemas
                      assert set(metrics) <= allowed_metric_keys
                      assert all(isinstance(value, (int, float)) and not isinstance(value, bool) for value in metrics.values())
          print(f"Validated {len(events)} events; {len(future)} future")
          PY

      - name: Publish refreshed calendar
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/macro-events.json
          if git diff --cached --quiet; then
            echo "Macro calendar unchanged."
          else
            git commit -m "Actualização automática do calendário macro ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            PUBLISH_SUPERSEDE_COMMIT_PREFIX="Actualização automática do calendário macro (" \
              bash scripts/publish_with_retry.sh origin main
          fi
