name: Patch Worker production verifier

on:
  push:
    branches:
      - infra/worker-production-contract-20260830
    paths:
      - '.github/workflows/patch-worker-production-verifier.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/worker-production-contract-20260830
      - name: Apply guarded patch
        run: python scripts/patch_worker_production_verifier.py
      - name: Validate verifier
        run: |
          python -m py_compile scripts/verify_worker_deployment.py
          python -m pip install --disable-pip-version-check requests
          python scripts/verify_worker_deployment.py --url "https://delicate-bar-cc80.pedrossnunes.workers.dev" --ticker MSFT --ticker AAPL
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify_worker_deployment.py .github/workflows/verify-cloudflare-worker.yml
          git diff --cached --quiet && exit 0
          git commit -m "ci: verify deployed Worker freshness contract"
          git push origin HEAD:infra/worker-production-contract-20260830
