name: Validate Worker production verifier

on:
  push:
    branches:
      - infra/worker-production-contract-20260830
    paths:
      - '.github/workflows/patch-worker-production-verifier.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/worker-production-contract-20260830
      - name: Validate verifier syntax
        run: python -m py_compile scripts/verify_worker_deployment.py
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Verify production contract
        run: python scripts/verify_worker_deployment.py --url "https://delicate-bar-cc80.pedrossnunes.workers.dev" --ticker MSFT --ticker AAPL
