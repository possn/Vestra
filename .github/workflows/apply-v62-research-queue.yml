name: Apply Vestra v6.2 research queue
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'chatgpt/v6.2-research-queue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6.2-research-queue
          fetch-depth: 0
      - name: Apply and validate v6.2
        run: |
          set -e
          python scripts/apply_v62_research_queue.py
          rm -f scripts/apply_v62_research_queue.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add market.js market.css README.md sw.js
          git add -u scripts/apply_v62_research_queue.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: Vestra v6.2 research queue"
            git push origin HEAD:chatgpt/v6.2-research-queue
          fi
