name: Refactor app financial engine
on:
  push:
    paths:
      - app-financial-engine.js
      - scripts/refactor_app_financial_engine.py
      - .github/workflows/refactor-app-financial-engine.yml
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract compound engine
        run: python scripts/refactor_app_financial_engine.py
      - name: Validate JavaScript syntax
        run: |
          node --check app-financial-engine.js
          node --check app.js
      - name: Run architecture invariants
        run: python -m unittest discover -v -s tests -p 'test_*.py'
      - name: Validate diff
        run: git diff --check
      - name: Commit extraction
        run: |
          git config user.name vestra-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html sw.js tests app-financial-engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: move compound projection out of app monolith"
          git push
