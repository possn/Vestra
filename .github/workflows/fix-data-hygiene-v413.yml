name: Vestra v4.13 data hygiene and coverage audit

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/data-hygiene-v413.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Apply semantic missing-data repair
        shell: python
        run: |
          from pathlib import Path
          import re

          hygiene=Path('scripts/data_hygiene.py')
          hygiene.write_text(r'''"""Semantic missing-data hygiene for Vestra fundamentals.

Some providers occasionally return literal zero placeholders for unavailable
fundamentals. Zero is a valid observation for some accounting fields, so this
module only converts zeros to missing when the *pattern* is inconsistent with a
real company statement (a cluster of zero placeholders across unrelated fields).
"""
from __future__ import annotations


def sanitize(raw):
    cleaned=0
    for m in raw:
        if getattr(m,'quote_type',None) in ('ETF','CRYPTO'):
            continue
        # Valuation ratios at exactly zero are not economically interpretable as
        # quoted multiples. Treat provider placeholders as missing.
        for k in ('trailing_pe','forward_pe','enterprise_to_ebitda','peg_ratio'):
            if getattr(m,k,None) == 0:
                setattr(m,k,None); cleaned+=1

        cluster_keys=(
            'roe','roa','profit_margin','operating_margin','gross_margin',
            'current_ratio','quick_ratio','debt_to_equity',
            'operating_cash_flow','free_cash_flow'
        )
        vals=[getattr(m,k,None) for k in cluster_keys]
        zeros=sum(v == 0 for v in vals)
        nonmissing=sum(v is not None for v in vals)
        # A simultaneous all-zero profitability/liquidity/cash-flow profile is a
        # classic placeholder signature. Genuine zeros remain untouched unless
        # they occur as a broad impossible cluster.
        if zeros >= 5 and zeros >= max(5, nonmissing-1):
            for k in cluster_keys:
                if getattr(m,k,None) == 0:
                    setattr(m,k,None); cleaned+=1
    return raw, cleaned
''',encoding='utf-8')

          gate=Path('scripts/reliability_gate.py')
          gate.write_text(r'''"""Strict evidence gate for public Vestra scores."""
from __future__ import annotations


def _f(v):
    try:
        x=float(v); return x if x==x and abs(x)!=float('inf') else None
    except (TypeError,ValueError): return None


def _present(row,k):
    v=row.get(k)
    if v is None: return False
    # Zero multiples are provider placeholders / non-meaningful, not evidence.
    if k in ('trailing_pe','forward_pe','enterprise_to_ebitda','peg_ratio') and v == 0:
        return False
    return True


def apply(row:dict)->dict:
    if row.get('quote_type') in ('ETF','CRYPTO'): return {}
    raw=_f(row.get('score'))
    coverage=_f(row.get('data_coverage_pct')) or 0.0
    conf=_f(row.get('confidence_score'))
    critical=(
        'roe','roa','profit_margin','operating_margin','gross_margin',
        'revenue_growth','earnings_growth','free_cash_flow','operating_cash_flow',
        'current_ratio','debt_to_equity','trailing_pe','forward_pe',
        'enterprise_to_ebitda','price_to_book','roce_proxy'
    )
    critical_pct=sum(_present(row,k) for k in critical)/len(critical)*100.0
    public=raw; status='robust'; reason=None
    if coverage < 50 or critical_pct < 35:
        public=None; status='insufficient_data'; reason='Cobertura fundamental insuficiente para calcular um score robusto.'
    elif coverage < 65 or critical_pct < 50 or (conf is not None and conf < 55):
        public=min(public,59.0) if public is not None else None
        status='limited_evidence'; reason='Score limitado pela cobertura/confiança dos dados.'
    elif conf is not None and conf < 65:
        public=min(public,69.0) if public is not None else None
        status='moderate_evidence'; reason='Score moderado pela confiança da evidência.'
    return {'score_raw':raw,'score':round(public,1) if public is not None else None,
            'score_reliability':status,'score_reliability_reason':reason,
            'critical_metric_coverage_pct':round(critical_pct,1)}
''',encoding='utf-8')

          run=Path('scripts/run.py'); s=run.read_text(encoding='utf-8')
          if 'from data_hygiene import sanitize as sanitize_raw' not in s:
              s=s.replace('from fundamentals import fetch_many\n','from fundamentals import fetch_many\nfrom data_hygiene import sanitize as sanitize_raw\n',1)
          if 'from reliability_gate import apply as apply_reliability_gate' not in s:
              s=s.replace('from confidence import assess as assess_confidence\n','from confidence import assess as assess_confidence\nfrom reliability_gate import apply as apply_reliability_gate\n',1)
          marker='    raw = enrich_capital_risk(raw, priority=portfolio_set)\n'
          if marker in s and 'raw, hygiene_cleaned = sanitize_raw(raw)' not in s:
              s=s.replace(marker,marker+'    raw, hygiene_cleaned = sanitize_raw(raw)\n    log.info("Data hygiene converted %d placeholder zeros to missing", hygiene_cleaned)\n',1)
          target='        row.update(assess_confidence(row))\n'
          if target in s and 'row.update(apply_reliability_gate(row))' not in s:
              s=s.replace(target,target+'        row.update(apply_reliability_gate(row))\n',1)
          run.write_text(s,encoding='utf-8')

          # Coverage must count semantically usable observations, not placeholder
          # zeros in valuation ratios.
          score=Path('scripts/score.py'); q=score.read_text(encoding='utf-8')
          old='        metric_coverage = sum(v is not None for v in metric_values) / len(metric_values) * 100\n'
          if old in q:
              new='''        # Semantic coverage: zero valuation multiples are not usable evidence.\n        _zero_invalid={15,16,18,19}  # positions: trailing PE, forward PE, EV/EBITDA, PEG\n        metric_coverage = sum((v is not None) and not (i in _zero_invalid and v == 0) for i,v in enumerate(metric_values)) / len(metric_values) * 100\n'''
              q=q.replace(old,new,1)
          score.write_text(q,encoding='utf-8')

          market=Path('market.js'); m=market.read_text(encoding='utf-8')
          if 'function positiveMultiple(v)' not in m:
              anchor="  const compact = v => n(v) == null ? '—' : new Intl.NumberFormat('pt-PT',{notation:'compact',maximumFractionDigits:1}).format(n(v));\n"
              helper="  const positiveMultiple = v => { const x=n(v); return x!=null&&x>0?num(x):'—'; };\n"
              if anchor in m: m=m.replace(anchor,anchor+helper,1)
          # Prevent impossible zero valuation multiples from being presented as data.
          m=m.replace('${num(s.trailing_pe)}','${positiveMultiple(s.trailing_pe)}')
          m=m.replace('${num(s.forward_pe)}','${positiveMultiple(s.forward_pe)}')
          m=m.replace('${num(s.enterprise_to_ebitda)}','${positiveMultiple(s.enterprise_to_ebitda)}')
          m=m.replace('${num(s.peg_ratio)}','${positiveMultiple(s.peg_ratio)}')
          # Data-quality card exposes critical coverage, which is what gates the score.
          needle='<div class="market-metric"><small>Cobertura</small><strong>${n(s.data_coverage_pct)==null?\'—\':Math.round(n(s.data_coverage_pct))+\'%\'}</strong></div>'
          if needle in m and 'Cobertura crítica' not in m:
              m=m.replace(needle,needle+'<div class="market-metric"><small>Cobertura crítica</small><strong>${n(s.critical_metric_coverage_pct)==null?\'—\':Math.round(n(s.critical_metric_coverage_pct))+\'%\'}</strong></div>',1)
          # Update explanatory copy: missing is not zero and sparse scores are gated.
          m=m.replace('O score só usa métricas disponíveis; valores ausentes não são tratados como zero. A confiança mede cobertura, não certeza do investimento.', 'Valores ausentes aparecem como —, nunca como 0. O Score Vestra é suprimido ou limitado quando a cobertura fundamental/critica é insuficiente.')
          market.write_text(m,encoding='utf-8')

          idx=Path('index.html'); h=idx.read_text(encoding='utf-8')
          h=re.sub(r'market\.js\?v=[^\"\']+','market.js?v=20260823v13',h,count=1)
          idx.write_text(h,encoding='utf-8')
          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8')
          w=re.sub(r'vestra-cache-v\d+','vestra-cache-v87',w,count=1)
          sw.write_text(w,encoding='utf-8')

      - name: Validate
        run: |
          python -m py_compile scripts/data_hygiene.py scripts/reliability_gate.py scripts/score.py scripts/run.py
          node --check market.js
          grep -q 'sanitize_raw' scripts/run.py
          grep -q 'apply_reliability_gate' scripts/run.py
          grep -q 'Cobertura crítica' market.js

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Rebuild market dataset
        working-directory: scripts
        run: python run.py

      - name: Commit repaired source and data
        run: |
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add scripts/data_hygiene.py scripts/reliability_gate.py scripts/run.py scripts/score.py market.js index.html sw.js data/
          if ! git diff --cached --quiet; then
            git commit -m "fix: distinguish missing fundamentals from real zero values"
            git push
          fi
