name: Feature v4.33 Opportunity Evidence Panel
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/triggers/opportunity-evidence-panel-v433.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch dossier
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('market.js'); s=p.read_text(encoding='utf-8')
          anchor='  function detailBase(s){\n'
          helper=r'''  function opportunityEvidencePanel(s){
    if(isFund(s)) return '';
    const opp=n(s.opportunity_score), raw=n(s.opportunity_score_raw);
    const gates=Array.isArray(s.opportunity_gates)?s.opportunity_gates:[];
    const caps=Array.isArray(s.opportunity_caps)?s.opportunity_caps:[];
    const reasons=Array.isArray(s.opportunity_reasons)?s.opportunity_reasons:[];
    const cautions=Array.isArray(s.opportunity_cautions)?s.opportunity_cautions:[];
    const suppressed=s.opportunity_eligible===true?'':txt(s.opportunity_suppressed_reason);
    const gatesHtml=gates.length?`<div class="market-watchpoints">${gates.map(g=>`<span class="market-signal ${g.passed?'':'market-signal--warn'}">${g.passed?'✓':'!'} ${esc(g.name)}${n(g.value)!=null?' · '+num(g.value):''}</span>`).join('')}</div>`:'';
    return `<div class="market-detail-card"><div class="market-perspective-head"><div><small>BEST OPPORTUNITIES · EVIDÊNCIA</small><h4>${esc(txt(s.opportunity_label)||'Dados insuficientes')}</h4></div><span class="market-consensus">${opp==null?'Sem ranking':Math.round(opp)+'/100'}</span></div><div class="market-metrics"><div class="market-metric"><small>Opportunity</small><strong>${opp==null?'—':Math.round(opp)+'/100'}</strong></div><div class="market-metric"><small>Score bruto</small><strong>${raw==null?'—':Math.round(raw)+'/100'}</strong></div><div class="market-metric"><small>Sinais</small><strong>${n(s.opportunity_signal_count)==null?'—':Math.round(n(s.opportunity_signal_count))}</strong></div><div class="market-metric"><small>Estruturais</small><strong>${n(s.opportunity_structural_signal_count)==null?'—':Math.round(n(s.opportunity_structural_signal_count))}</strong></div><div class="market-metric"><small>Cobertura crítica</small><strong>${n(s.critical_metric_coverage_pct)==null?'—':Math.round(n(s.critical_metric_coverage_pct))+'%'}</strong></div><div class="market-metric"><small>Fiabilidade</small><strong>${esc(txt(s.score_reliability)||'—')}</strong></div></div>${suppressed?`<p class="market-case-note"><strong>Excluída:</strong> ${esc(suppressed)}</p>`:''}${gatesHtml}${reasons.length?`<p class="market-case-note"><strong>A favor:</strong> ${reasons.map(esc).join(' · ')}</p>`:''}${cautions.length?`<p class="market-case-note"><strong>Atenção:</strong> ${cautions.map(esc).join(' · ')}</p>`:''}${caps.length?`<p class="market-case-note"><strong>Caps:</strong> ${caps.map(x=>`${esc(x.reason||'limite')} → ${Math.round(n(x.cap)||0)}`).join(' · ')}</p>`:''}</div>`;
  }

'''
          if 'function opportunityEvidencePanel(s)' not in s:
              if anchor not in s: raise SystemExit('detailBase anchor not found')
              s=s.replace(anchor,helper+anchor,1)
          old="if(tab==='overview') body.innerHTML=`${changePanel(s)}${recoveryPanel(s)}"
          new="if(tab==='overview') body.innerHTML=`${changePanel(s)}${opportunityEvidencePanel(s)}${recoveryPanel(s)}"
          if old in s: s=s.replace(old,new,1)
          elif '${opportunityEvidencePanel(s)}' not in s: raise SystemExit('overview anchor not found')
          s=s.replace('O score só usa métricas disponíveis; valores ausentes não são tratados como zero. A confiança mede cobertura, não certeza do investimento.','Valores ausentes aparecem como — e nunca como zero. O Evidence Gate pode suprimir ou limitar o Score Vestra quando a cobertura, as métricas críticas ou a confiança são insuficientes.',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check market.js
      - name: Commit
        run: |
          git config user.name vestra-ui-bot
          git config user.email actions@users.noreply.github.com
          git add market.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: explain opportunity evidence in dossiers'
          git pull --rebase origin main
          git push
