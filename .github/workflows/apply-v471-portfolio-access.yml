name: Apply Vestra v4.7.1 portfolio access

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v4.7.1-portfolio-access'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v4.7.1-portfolio-access
          fetch-depth: 0
      - name: Apply and validate v4.7.1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v471_portfolio_access.py
          rm -f scripts/apply_v471_portfolio_access.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- index.html market.css README.md sw.js
          git add -u scripts/apply_v471_portfolio_access.py
          if git diff --cached --quiet; then
            echo "v4.7.1 already applied"
          else
            git commit -m "fix: expose Portfolio Intelligence in Market"
            git push origin HEAD:chatgpt/v4.7.1-portfolio-access
          fi
