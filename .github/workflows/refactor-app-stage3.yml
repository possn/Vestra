name: Refactor app stage 3

on:
  push:
    paths:
      - 'scripts/refactor_app_stage3.py'
      - '.github/workflows/refactor-app-stage3.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded persistence extraction
        run: python scripts/refactor_app_stage3.py
      - name: Validate JavaScript syntax
        run: |
          node --check app-utils.js
          node --check app-feedback.js
          node --check app-storage.js
          node --check app.js
      - name: Validate script ordering and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          assert h.index('app-utils.js') < h.index('app-feedback.js') < h.index('app-storage.js') < h.index('app.js')
          a=Path('app.js').read_text()
          assert 'VestraStorage não foi carregado antes de app.js' in a
          assert 'function idbOpen()' not in a
          assert 'async function storageSet(raw)' not in a
          PY
          git diff --check
      - name: Commit migrated persistence domain
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'refactor: move persistence out of app monolith'
          git push
