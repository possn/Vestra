name: Apply Vestra v4.4 valuation engine

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v4.4-valuation-sector-models'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v4.4-valuation-sector-models
          fetch-depth: 0
      - name: Apply and validate v4.4
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/apply_v44_valuation.py ]; then
            python scripts/apply_v44_valuation.py
            rm -f scripts/apply_v44_valuation.py
          fi
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- scripts/valuation.py scripts/score.py scripts/run.py market.js README.md sw.js
          git add -u scripts/apply_v44_valuation.py
          if git diff --cached --quiet; then
            echo "v4.4 already applied"
          else
            git commit -m "feat: Vestra v4.4 valuation engine and sector models"
            git push origin HEAD:chatgpt/v4.4-valuation-sector-models
          fi
