name: Patch portfolio hydration concurrency

on:
  push:
    branches:
      - fix/portfolio-hydration-concurrency-20260830
    paths:
      - '.github/workflows/patch-portfolio-hydration-concurrency.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-hydration-concurrency-20260830
      - name: Apply guarded patch
        run: python scripts/patch_portfolio_hydration_concurrency.py
      - name: Validate focused contract
        run: |
          node --check market-data-loader.js
          python -m unittest -v tests.test_market_loader_invariants tests.test_native_market_loading
          grep -F 'market-data-loader.js?v=2.4' index.html
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market-data-loader.js index.html tests/test_market_loader_invariants.py tests/test_native_market_loading.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: bound portfolio background hydration"
          git push origin HEAD:fix/portfolio-hydration-concurrency-20260830
