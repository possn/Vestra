name: Update market data

# Canonical market-data build. The heavy full-universe pipeline is intentionally
# decoupled from ordinary source-code commits: architecture CI validates code
# changes quickly, while a full rebuild runs daily, on manual dispatch, or when
# the explicit rebuild marker is bumped after a coherent batch of pipeline work.

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market-data.yml'
      - '.github/triggers/market-data-rebuild.txt'

permissions:
  contents: write

# A canonical build must be allowed to finish. Because automatic push triggers
# are now deliberate and rare, queuing a later rebuild is safer than cancelling
# a 60–100 minute run that may already be close to publication.
concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    # The complete universe plus SEC/ESEF/Yahoo fallbacks can legitimately
    # exceed the old 55-minute budget. A job timeout kills the runner before
    # diagnostics can be persisted, so allow a complete evidence-gated rebuild.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate enrichment modules
        run: |
          python -m py_compile scripts/universe.py scripts/fundamentals.py scripts/sec_enrich.py scripts/esef_enrich.py scripts/esef_enrich_v416.py scripts/lse_identity.py scripts/gap_retrieval.py scripts/quarterly_gap_retrieval.py scripts/score.py scripts/score_audit.py scripts/score_forward_validation.py scripts/peer_benchmark.py scripts/score_peer_shadow.py scripts/score_benchmark_audit.py scripts/confidence.py scripts/low52_intelligence.py scripts/scanner.py scripts/congress.py scripts/run.py scripts/postprocess_market.py scripts/normalize_market_provenance.py scripts/build_market_shards.py scripts/coverage_audit.py scripts/provenance_audit.py scripts/coverage_guard.py scripts/sync_learned_universe.py
          if [ -f scripts/reliability_gate.py ]; then python -m py_compile scripts/reliability_gate.py; fi
          if [ -f scripts/opportunity_rank.py ]; then python -m py_compile scripts/opportunity_rank.py; fi
          if [ -f scripts/sector_native.py ]; then python -m py_compile scripts/sector_native.py; fi
          if [ -f scripts/moat.py ]; then python -m py_compile scripts/moat.py; fi
          if [ -f scripts/value_trap.py ]; then python -m py_compile scripts/value_trap.py; fi
          if [ -f scripts/capital_allocation_intelligence.py ]; then python -m py_compile scripts/capital_allocation_intelligence.py; fi

      - name: Sync learned search universe
        working-directory: scripts
        env:
          VESTRA_WORKER_URL: https://delicate-bar-cc80.pedrossnunes.workers.dev
        run: python sync_learned_universe.py

      - name: Run pipeline
        working-directory: scripts
        run: python run.py

      - name: Normalize canonical source provenance
        working-directory: scripts
        run: python normalize_market_provenance.py

      - name: Refresh late-stage opportunity ranking and stale-row hygiene
        working-directory: scripts
        run: python postprocess_market.py

      - name: Build lightweight market index and dossier shards
        working-directory: scripts
        run: python build_market_shards.py

      - name: Build coverage audit
        working-directory: scripts
        run: python coverage_audit.py

      - name: Build provenance audit
        working-directory: scripts
        run: python provenance_audit.py

      - name: Enforce coverage and opportunity guardrails
        id: coverage_guard
        continue-on-error: true
        working-directory: scripts
        run: python coverage_guard.py

      - name: Build score diagnostics and prospective validation
        if: steps.coverage_guard.outcome == 'success'
        working-directory: scripts
        run: |
          python score_audit.py
          python score_benchmark_audit.py
          python score_peer_shadow.py
          python score_forward_validation.py

      - name: Publish validated market data
        if: steps.coverage_guard.outcome == 'success'
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados — nada para gravar."
          else
            git commit -m "Actualização automática de dados de mercado ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash scripts/publish_with_retry.sh origin main
          fi

      - name: Persist blocked-build diagnostics
        if: steps.coverage_guard.outcome != 'success'
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # Never publish the rejected stocks.json or derived market shards. Persist
          # only diagnostics so rejected data cannot leak into the live frontend.
          git checkout -- data/stocks.json data/stocks-index.json data/dossiers-manifest.json data/dossiers 2>/dev/null || true
          git clean -fd data/dossiers data/stocks-index.json data/dossiers-manifest.json 2>/dev/null || true
          git add data/coverage_audit.json data/provenance_audit.json data/coverage_guard.json data/pipeline_log.txt data/last_error.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Guard bloqueou publicação e não há novos diagnósticos para gravar."
          else
            git commit -m "diagnostics: market build blocked by coverage guard ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash scripts/publish_with_retry.sh origin main
          fi

      - name: Fail build after diagnostics are persisted
        if: steps.coverage_guard.outcome != 'success'
        run: |
          echo "Coverage guard bloqueou a publicação de stocks.json. Ver data/coverage_guard.json."
          exit 1

      - name: Upload pipeline diagnostics (mesmo em caso de falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics
          path: |
            data/pipeline_log.txt
            data/last_error.log
            data/coverage_audit.json
            data/provenance_audit.json
            data/coverage_guard.json
            data/score_audit.json
            data/score_benchmark_audit.json
            data/score_peer_shadow.json
            data/score_validation_report.json
            data/score_validation_history.json
            data/learned_tickers.json
          if-no-files-found: ignore
          retention-days: 14
