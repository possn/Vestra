name: Update market data

# O run.py (scripts/run.py) já dizia no seu próprio docstring "Executed daily
# by GitHub Actions" — mas este ficheiro nunca existiu no repositório. Sem
# ele, os dados em data/*.json nunca se actualizam sozinhos; alguém tem de
# correr o pipeline à mão e enviar os ficheiros manualmente, sempre.

on:
  schedule:
    # 06:15 UTC todos os dias — antes da abertura dos mercados europeus,
    # depois do fecho dos mercados asiáticos.
    - cron: "15 6 * * *"
  workflow_dispatch: {}   # permite correr manualmente a partir do separador "Actions" no GitHub

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run pipeline
        working-directory: scripts
        run: python run.py

      - name: Commit updated data
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados — nada para gravar."
          else
            git commit -m "Actualização automática de dados de mercado ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Upload pipeline log (mesmo em caso de falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: |
            data/pipeline_log.txt
            data/last_error.log
          if-no-files-found: ignore
          retention-days: 14
