name: Update market data

# Daily market-data build plus explicit rebuilds when the enrichment/scoring
# pipeline changes. This keeps data/stocks.json aligned with the code instead of
# waiting until the next scheduled run after a source repair.

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/fundamentals.py'
      - 'scripts/sec_enrich.py'
      - 'scripts/esef_enrich.py'
      - 'scripts/esef_enrich_v416.py'
      - 'scripts/gap_retrieval.py'
      - 'scripts/quarterly_gap_retrieval.py'
      - 'scripts/coverage_audit.py'
      - 'scripts/score.py'
      - 'scripts/confidence.py'
      - 'scripts/reliability_gate.py'
      - 'scripts/opportunity_rank.py'
      - 'scripts/sector_native.py'
      - 'scripts/moat.py'
      - 'scripts/value_trap.py'
      - 'scripts/capital_allocation_intelligence.py'
      - 'scripts/run.py'
      - '.github/triggers/market-data-rebuild.txt'

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate enrichment modules
        run: |
          python -m py_compile scripts/fundamentals.py scripts/sec_enrich.py scripts/esef_enrich.py scripts/esef_enrich_v416.py scripts/gap_retrieval.py scripts/quarterly_gap_retrieval.py scripts/score.py scripts/confidence.py scripts/run.py scripts/coverage_audit.py
          if [ -f scripts/reliability_gate.py ]; then python -m py_compile scripts/reliability_gate.py; fi
          if [ -f scripts/opportunity_rank.py ]; then python -m py_compile scripts/opportunity_rank.py; fi
          if [ -f scripts/sector_native.py ]; then python -m py_compile scripts/sector_native.py; fi
          if [ -f scripts/moat.py ]; then python -m py_compile scripts/moat.py; fi
          if [ -f scripts/value_trap.py ]; then python -m py_compile scripts/value_trap.py; fi
          if [ -f scripts/capital_allocation_intelligence.py ]; then python -m py_compile scripts/capital_allocation_intelligence.py; fi

      - name: Run pipeline
        working-directory: scripts
        run: python run.py

      - name: Build coverage audit
        working-directory: scripts
        run: python coverage_audit.py

      - name: Commit updated data
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados — nada para gravar."
          else
            git commit -m "Actualização automática de dados de mercado ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Upload pipeline diagnostics (mesmo em caso de falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics
          path: |
            data/pipeline_log.txt
            data/last_error.log
            data/coverage_audit.json
          if-no-files-found: ignore
          retention-days: 14
