name: Vestra v6.6.6 hotfix runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market-data.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Vestra
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          t = app.read_text(encoding='utf-8')
          old = '''  const assetCcy = String(asset.priceCurrency || asset.currency || "").trim().toUpperCase();
  const quoteCcy = String(q.currency || "").trim().toUpperCase();
  const explicit = hasStrongQuoteIdentitySafe(asset);
  // Currency mismatch is a strong collision signal for explicit broker instruments.
  if (assetCcy && quoteCcy && assetCcy !== quoteCcy && !(assetCcy === "GBX" && quoteCcy === "GBP")) {
    if (!String(rawTicker || "").includes("=") && !String(rawTicker || "").endsWith("-USD")) {
      return { ok:false, reason:`Cotação suspeita: moeda ${quoteCcy} não coincide com ${assetCcy}` };
    }
  }
'''
          new = '''  const quoteCcy = String(q.currency || "").trim().toUpperCase();
  const explicit = hasStrongQuoteIdentitySafe(asset);
  // v6.6.6: trading currency may legitimately differ from broker portfolio/settlement
  // currency. Identity is validated structurally; FX conversion is applied below.
'''
          if old not in t:
              raise SystemExit('currency block not found')
          t = t.replace(old, new, 1)
          old = '''  if (ref > 0) {
    const ratio = priceEur / ref;
    if (ratio > 5 || ratio < 0.2) {
      return { ok:false, reason:`Cotação suspeita rejeitada (${ratio.toFixed(1)}× face ao último preço fiável)` };
    }
  }
'''
          new = '''  if (ref > 0) {
    const ratio = priceEur / ref;
    if (ratio > 5 || ratio < 0.2) {
      // Strong ticker/ISIN identity may repair a stale/corrupted local baseline.
      if (!explicit) {
        return { ok:false, reason:`Cotação suspeita rejeitada (${ratio.toFixed(1)}× face ao último preço fiável)` };
      }
      console.warn('[Quote recovery] replacing stale baseline for', asset.name || rawTicker, 'ratio=', ratio);
    }
  }
'''
          if old not in t:
              raise SystemExit('ratio block not found')
          app.write_text(t.replace(old, new, 1), encoding='utf-8')

          css = Path('styles.css')
          s = css.read_text(encoding='utf-8')
          old = '''.main {
  padding: 14px 12px calc(var(--bottomnav-h) + var(--passivebar-h) + env(safe-area-inset-bottom, 0px) + 40px);
  max-width: 680px;
  margin: 0 auto;
  contain: layout style;
}'''
          new = '''.main {
  padding: 14px 12px calc(var(--bottomnav-h) + var(--passivebar-h) + env(safe-area-inset-bottom, 0px) + 40px);
  max-width: 680px;
  margin: 0 auto;
  /* v6.6.6: layout containment breaks long fixed modals on iOS Safari. */
  contain: none;
}'''
          if old not in s:
              raise SystemExit('main containment not found')
          s = s.replace(old, new, 1)
          marker = '''.modal__box, .modal__panel {
  position: fixed; left: 50%; transform: translateX(-50%);'''
          repl = '''.modal__box, .modal__panel {
  position: fixed; left: 50%; transform: translateX(-50%);
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-y;'''
          if marker not in s:
              raise SystemExit('modal marker not found')
          css.write_text(s.replace(marker, repl, 1), encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          h = h.replace('styles.css?v=20260821v7', 'styles.css?v=20260823v8')
          h = h.replace('app.js?v=20260821v8', 'app.js?v=20260823v9')
          idx.write_text(h, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          if 'vestra-cache-v68' not in w:
              raise SystemExit('cache v68 not found')
          sw.write_text(w.replace('vestra-cache-v68','vestra-cache-v69',1), encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          note = '''## Vestra v6.6.6 — Quote Recovery & iOS Error Modal\n\n- Corrigidos falsos erros de moeda em cotações legítimas noutra divisa.\n- Identidades fortes podem recuperar de um último preço local corrompido.\n- Corrigido o modal de erros de cotação bloqueado/sem scroll no iPhone.\n- Cache PWA atualizado para v69.\n\n'''
          if not r.startswith('## Vestra v6.6.6'):
              readme.write_text(note+r,encoding='utf-8')

          original = '''name: Update market data

# O run.py (scripts/run.py) já dizia no seu próprio docstring "Executed daily
# by GitHub Actions" — mas este ficheiro nunca existiu no repositório. Sem
# ele, os dados em data/*.json nunca se actualizam sozinhos; alguém tem de
# correr o pipeline à mão e enviar os ficheiros manualmente, sempre.

on:
  schedule:
    # 06:15 UTC todos os dias — antes da abertura dos mercados europeus,
    # depois do fecho dos mercados asiáticos.
    - cron: "15 6 * * *"
  workflow_dispatch: {}   # permite correr manualmente a partir do separador "Actions" no GitHub

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run pipeline
        working-directory: scripts
        run: python run.py

      - name: Commit updated data
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados — nada para gravar."
          else
            git commit -m "Actualização automática de dados de mercado ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Upload pipeline log (mesmo em caso de falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: |
            data/pipeline_log.txt
            data/last_error.log
          if-no-files-found: ignore
          retention-days: 14
'''
          Path('.github/workflows/update-market-data.yml').write_text(original, encoding='utf-8')
          Path('.github/workflows/hotfix-quote-refresh-v666.yml').unlink(missing_ok=True)

      - name: Validate and commit
        shell: bash
        run: |
          node --check app.js
          grep -q "trading currency may legitimately differ" app.js
          grep -q "Quote recovery" app.js
          grep -q "contain: none" styles.css
          grep -q -- "-webkit-overflow-scrolling: touch" styles.css
          grep -q "vestra-cache-v69" sw.js
          grep -q "app.js?v=20260823v9" index.html
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix: Vestra v6.6.6 quote recovery and iOS error modal"
          git push origin main
