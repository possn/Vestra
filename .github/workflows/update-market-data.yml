name: Update market data

# Daily market-data build plus explicit rebuilds when the enrichment/scoring
# pipeline changes. This keeps data/stocks.json aligned with the code instead of
# waiting until the next scheduled run after a source repair.

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/universe.py'
      - 'scripts/fundamentals.py'
      - 'scripts/sec_enrich.py'
      - 'scripts/esef_enrich.py'
      - 'scripts/esef_enrich_v416.py'
      - 'scripts/gap_retrieval.py'
      - 'scripts/quarterly_gap_retrieval.py'
      - 'scripts/coverage_audit.py'
      - 'scripts/coverage_guard.py'
      - 'scripts/score.py'
      - 'scripts/confidence.py'
      - 'scripts/reliability_gate.py'
      - 'scripts/opportunity_rank.py'
      - 'scripts/sector_native.py'
      - 'scripts/moat.py'
      - 'scripts/value_trap.py'
      - 'scripts/capital_allocation_intelligence.py'
      - 'scripts/low52_intelligence.py'
      - 'scripts/scanner.py'
      - 'scripts/run.py'
      - '.github/triggers/market-data-rebuild.txt'

permissions:
  contents: write

# A full market rebuild can take tens of minutes. During development several
# source commits may land in quick succession; queued runs for older commits are
# stale by definition and can also fail to push because main has moved on.
# Keep only the newest requested build so published data always corresponds to
# the latest pipeline source state.
concurrency:
  group: update-market-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate enrichment modules
        run: |
          python -m py_compile scripts/universe.py scripts/fundamentals.py scripts/sec_enrich.py scripts/esef_enrich.py scripts/esef_enrich_v416.py scripts/gap_retrieval.py scripts/quarterly_gap_retrieval.py scripts/score.py scripts/confidence.py scripts/low52_intelligence.py scripts/scanner.py scripts/run.py scripts/coverage_audit.py scripts/coverage_guard.py
          if [ -f scripts/reliability_gate.py ]; then python -m py_compile scripts/reliability_gate.py; fi
          if [ -f scripts/opportunity_rank.py ]; then python -m py_compile scripts/opportunity_rank.py; fi
          if [ -f scripts/sector_native.py ]; then python -m py_compile scripts/sector_native.py; fi
          if [ -f scripts/moat.py ]; then python -m py_compile scripts/moat.py; fi
          if [ -f scripts/value_trap.py ]; then python -m py_compile scripts/value_trap.py; fi
          if [ -f scripts/capital_allocation_intelligence.py ]; then python -m py_compile scripts/capital_allocation_intelligence.py; fi

      - name: Run pipeline
        working-directory: scripts
        run: python run.py

      - name: Build coverage audit
        working-directory: scripts
        run: python coverage_audit.py

      - name: Enforce coverage and opportunity guardrails
        id: coverage_guard
        continue-on-error: true
        working-directory: scripts
        run: python coverage_guard.py

      - name: Publish validated market data
        if: steps.coverage_guard.outcome == 'success'
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados — nada para gravar."
          else
            git commit -m "Actualização automática de dados de mercado ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Persist blocked-build diagnostics
        if: steps.coverage_guard.outcome != 'success'
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # Never publish the rejected stocks.json. Persist only diagnostics so the
          # exact failing tickers/rules can be repaired on the next iteration.
          git checkout -- data/stocks.json 2>/dev/null || true
          git add data/coverage_audit.json data/coverage_guard.json data/pipeline_log.txt data/last_error.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Guard bloqueou publicação e não há novos diagnósticos para gravar."
          else
            git commit -m "diagnostics: market build blocked by coverage guard ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Fail build after diagnostics are persisted
        if: steps.coverage_guard.outcome != 'success'
        run: |
          echo "Coverage guard bloqueou a publicação de stocks.json. Ver data/coverage_guard.json."
          exit 1

      - name: Upload pipeline diagnostics (mesmo em caso de falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics
          path: |
            data/pipeline_log.txt
            data/last_error.log
            data/coverage_audit.json
            data/coverage_guard.json
          if-no-files-found: ignore
          retention-days: 14
