name: Vestra v6.6.8 broker scale repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-broker-scale-v668.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair legacy x1000 broker quantities
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()

          old = '''    // Sanity check: if new price implies value > 50× cost basis, Yahoo has stale pre-split price
    // e.g. NGAS.UK after 5000:3 reverse split has 48k shares but Yahoo returns pre-split price
    let safeNewValue = newValue;
    const _assetCostBasis = parseNum(asset.costBasis || 0);
    if (_assetCostBasis > 100 && safeNewValue > _assetCostBasis * 50) {
      safeNewValue = _assetCostBasis; // reject stale Yahoo price, keep cost basis
      console.warn("[Quote sanity]", asset.name || asset.ticker, "rejected:", newValue.toFixed(0), "→ costBasis:", _assetCostBasis.toFixed(0));
    }
    asset.value = safeNewValue;'''

          new = '''    // Repair legacy broker imports where a decimal quantity such as 5.038 was
    // previously parsed as 5038. The original snapshot value remains embedded in
    // notes ("Valor snapshot=...") and is therefore a reliable on-device anchor.
    let effectiveQty = qty;
    let safeNewValue = newValue;
    const _assetCostBasis = parseNum(asset.costBasis || 0);
    const _snapMatch = String(asset.notes || "").match(/Valor snapshot=([^·@]+)/i);
    const _snapshotAnchor = _snapMatch ? parseNum(_snapMatch[1]) : 0;
    if (asset.generatedFromBroker && effectiveQty > 0 && _snapshotAnchor > 0 && safeNewValue > 0) {
      const _scale = safeNewValue / _snapshotAnchor;
      // The known parser defect is exactly x1000. Keep a tolerance for FX/price drift.
      if (_scale > 700 && _scale < 1300) {
        effectiveQty = effectiveQty / 1000;
        safeNewValue = effectiveQty * priceEur;
        asset.qty = effectiveQty;
        console.warn("[Broker qty repair x1000]", asset.name || asset.ticker, qty, "→", effectiveQty);
      }
    }
    // Independent stale-price safeguard.
    if (_assetCostBasis > 100 && safeNewValue > _assetCostBasis * 50) {
      safeNewValue = _assetCostBasis;
      console.warn("[Quote sanity]", asset.name || asset.ticker, "rejected:", newValue.toFixed(0), "→ costBasis:", _assetCostBasis.toFixed(0));
    }
    asset.value = safeNewValue;'''

          if old not in s:
              raise SystemExit('safeNewValue block not found')
          s = s.replace(old, new, 1)

          old2 = '''    if (ccy !== "EUR") {
      asset.currency   = ccy;
      asset.valueLocal = qty ? +(qty * q.price).toFixed(6) : +q.price.toFixed(6);
    } else {'''
          new2 = '''    if (ccy !== "EUR") {
      asset.currency   = ccy;
      asset.valueLocal = effectiveQty ? +(effectiveQty * q.price).toFixed(6) : +q.price.toFixed(6);
    } else {'''
          if old2 not in s:
              raise SystemExit('valueLocal block not found')
          s = s.replace(old2, new2, 1)

          old3 = '''    if (qty) asset.qty = qty;
    const pmFromNotes = (asset.notes||"").match(/PM=([\\d.,]+)/);'''
          new3 = '''    if (effectiveQty) {
      asset.qty = effectiveQty;
      if (/Qty=[\\d.,]+/.test(asset.notes || "")) asset.notes = asset.notes.replace(/Qty=[\\d.,]+/, "Qty=" + fmt(effectiveQty, 6));
    }
    const pmFromNotes = (asset.notes||"").match(/PM=([\\d.,]+)/);'''
          if old3 not in s:
              raise SystemExit('asset qty assignment block not found')
          s = s.replace(old3, new3, 1)

          p.write_text(s)

          idx = Path('index.html')
          h = idx.read_text().replace('app.js?v=20260823v9', 'app.js?v=20260823v10')
          idx.write_text(h)

          sw = Path('sw.js')
          w = sw.read_text().replace('vestra-cache-v70', 'vestra-cache-v71')
          sw.write_text(w)

      - name: Validate syntax
        run: node --check app.js

      - name: Commit hotfix
        run: |
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add app.js index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: v6.6.8 repair legacy x1000 broker quantities from snapshot anchor"
            git push
          fi
