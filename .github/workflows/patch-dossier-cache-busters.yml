name: Patch dossier cache busters

on:
  push:
    branches:
      - fix/instant-dossier-open-20260830
    paths:
      - '.github/workflows/patch-dossier-cache-busters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instant-dossier-open-20260830
      - name: Patch exact module versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pairs = [
              ('market-data-loader.js?v=2.0', 'market-data-loader.js?v=2.2'),
              ('portfolio-sheet-navigation.js?v=1.0', 'portfolio-sheet-navigation.js?v=1.3'),
          ]
          for old, new in pairs:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one {old!r}, got {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate expected references
        run: |
          grep -F 'market-data-loader.js?v=2.2' index.html
          grep -F 'portfolio-sheet-navigation.js?v=1.3' index.html
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: bust dossier navigation module caches"
          git push origin HEAD:fix/instant-dossier-open-20260830
