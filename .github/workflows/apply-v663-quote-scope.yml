name: Apply Vestra v6.6.3 quote scope repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'chatgpt/v6.6.3-quote-refresh-scope-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6.6.3-quote-refresh-scope-repair
          fetch-depth: 0
      - name: Apply and validate v6.6.3
        run: |
          set -euo pipefail
          python scripts/apply_v663_quote_scope_repair.py
          rm -f scripts/apply_v663_quote_scope_repair.py
          python -m py_compile scripts/*.py
          node --check app.js
          node --check market.js
          node --check sw.js
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('app.js','utf8');
          const a=src.indexOf('function hasStrongQuoteIdentitySafe(asset) {');
          const b=src.indexOf('function quoteSanityCheck(asset, q, priceEur, rawTicker) {',a);
          if(a<0||b<=a) throw new Error('quote helper not found');
          const code=src.slice(a,b)+'\n;globalThis.__qid=hasStrongQuoteIdentitySafe;';
          eval(code);
          const q=globalThis.__qid;
          const tests=[
            [q({class:'Ações/ETFs',isin:'US5949181045'}),true,'ISIN'],
            [q({class:'Ações/ETFs',yahooTicker:'MSFT'}),true,'Yahoo ticker'],
            [q({class:'Ações/ETFs',ticker:'O'}),true,'single-letter ticker'],
            [q({class:'Ações/ETFs',notes:'Ticker=ASML.AS'}),true,'explicit note'],
            [q({class:'Ações/ETFs',ticker:'LifeStrategy 60% Equity'}),false,'descriptive name'],
            [q({class:'Cripto',ticker:'BTC-EUR'}),true,'crypto']
          ];
          for(const [got,want,name] of tests){ if(got!==want) throw new Error(`${name}: got ${got}, want ${want}`); }
          console.log('quote identity smoke: ok');
          NODE
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add README.md app.js sw.js
          git add -u scripts/apply_v663_quote_scope_repair.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: Vestra v6.6.3 quote refresh scope repair"
            git push origin HEAD:chatgpt/v6.6.3-quote-refresh-scope-repair
          fi
