name: Integrate quote error classifier
on:
  push:
    paths:
      - app-quote-errors.js
      - scripts/integrate_quote_error_classifier.py
      - .github/workflows/integrate-quote-error-classifier.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate diagnostics
        run: python scripts/integrate_quote_error_classifier.py
      - name: Validate JavaScript syntax
        run: |
          node --check app-quote-errors.js
          node --check app.js
      - name: Run architecture invariants
        run: python -m unittest discover -v -s tests -p 'test_*.py'
      - name: Validate diff
        run: git diff --check
      - name: Commit integration
        run: |
          git config user.name vestra-bot
          git config user.email actions@users.noreply.github.com
          git add app.js index.html sw.js tests app-quote-errors.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: classify quote refresh failures"
          git push
