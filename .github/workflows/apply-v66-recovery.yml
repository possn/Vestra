name: Apply Vestra v6.6 recovery confirmation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'chatgpt/v6.6-recovery-confirmation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6.6-recovery-confirmation
          fetch-depth: 0
      - name: Apply and validate v6.6
        run: |
          set -euo pipefail
          python scripts/apply_v66_recovery_confirmation.py
          rm -f scripts/apply_v66_recovery_confirmation.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add scripts/run.py scripts/recovery_confirmation.py market.js README.md sw.js
          git add -u scripts/apply_v66_recovery_confirmation.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: Vestra v6.6 recovery confirmation"
            git push origin HEAD:chatgpt/v6.6-recovery-confirmation
          fi
