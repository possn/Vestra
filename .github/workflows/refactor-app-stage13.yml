name: Refactor app stage 13

on:
  push:
    paths:
      - scripts/refactor_app_stage13.py
      - .github/workflows/refactor-app-stage13.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded broker workbook extraction
        run: python scripts/refactor_app_stage13.py
      - name: Validate JavaScript syntax
        run: |
          node --check app-broker-workbook.js
          node --check app-broker-parsers.js
          node --check app.js
      - name: Validate workbook migration and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          a=Path('app.js').read_text()
          p=Path('app-broker-parsers.js').read_text()
          m=Path('app-broker-workbook.js').read_text()
          assert h.index('app-file-parsing.js') < h.index('app-broker-workbook.js') < h.index('app-broker-parsers.js') < h.index('app.js')
          for fn in ['fileToText','fileToObjectRows','xtbWorkbookSheetToRows','xtbExtractSheetMeta','workbookToBrokerBlocks']:
              assert f'function {fn}(' not in a and f'async function {fn}(' not in a
              assert fn in m
          assert 'fileToObjectRows, workbookToBrokerBlocks' in p
          assert 'XLSX.read' in m and 'sheet_to_json' in m
          assert 'function rebuildBrokerGeneratedData(' in a
          assert 'VestraBrokerWorkbook não foi carregado antes de app.js' in a
          PY
          git diff --check
      - name: Commit extracted broker workbook readers
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html app-broker-parsers.js app-broker-workbook.js
          git commit -m 'refactor: move broker workbook readers out of app monolith'
          git pull --rebase origin main
          git push