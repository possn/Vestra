name: Patch market search suggestions

on:
  push:
    branches:
      - refactor/market-search-suggestions-20260901

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/market-search-suggestions-20260901
          fetch-depth: 0
      - name: Apply guarded extraction
        run: |
          python scripts/_patch_market_search_suggestions.py
          node --check market-search-suggestions.js
          node --check market.js
          node tests/runtime_market_search_suggestions_contract.js
          python scripts/runtime_js_audit.py
      - name: Commit extraction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market.js index.html sw.js
          git commit -m "refactor: extract market search suggestions"
          git push origin HEAD:refactor/market-search-suggestions-20260901
