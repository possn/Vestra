name: Apply missing numeric policy verifier patch

on:
  push:
    branches:
      - ci/verify-missing-numeric-policy-20260830
    paths:
      - '.github/workflows/apply-verify-missing-numeric-policy.yml'
      - 'scripts/patch_verify_missing_numeric_policy.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/verify-missing-numeric-policy-20260830
      - name: Apply patch
        run: python scripts/patch_verify_missing_numeric_policy.py
      - name: Validate verifier
        run: |
          python -m py_compile scripts/verify_worker_deployment.py
          python -m pip install --disable-pip-version-check requests
          python scripts/verify_worker_deployment.py --url "https://delicate-bar-cc80.pedrossnunes.workers.dev" --ticker MSFT --ticker AAPL
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify_worker_deployment.py
          git diff --cached --quiet && exit 0
          git commit -m "ci: verify missing numeric policy in production"
          git push origin HEAD:ci/verify-missing-numeric-policy-20260830
