name: Harden politicians UI freshness

on:
  push:
    paths:
      - scripts/harden_politicians_snapshot_ui.py
      - .github/workflows/harden-politicians-ui.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded UI patch
        run: python scripts/harden_politicians_snapshot_ui.py
      - name: Validate UI
        run: |
          node --check politicians.js
          grep -q "ageDays>60" politicians.js
          grep -q "coverage_chambers" politicians.js
          ! grep -q "House + Senate.</p>" politicians.js
          git diff --check
      - name: Commit UI guard
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add politicians.js
          git commit -m 'fix: reject stale politicians snapshots in UI'
          git pull --rebase origin main
          git push