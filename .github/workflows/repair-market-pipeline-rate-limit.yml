name: Repair market pipeline rate limits

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_fundamentals_rate_limit.py'
      - '.github/workflows/repair-market-pipeline-rate-limit.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/patch_fundamentals_rate_limit.py
      - name: Validate syntax and policy
        run: |
          python -m py_compile scripts/fundamentals.py
          grep -q 'backoff = min(60' scripts/fundamentals.py
          grep -q 'failure_ratio >= 0.25' scripts/fundamentals.py
          grep -q 'Skipping bulk retry pass' scripts/fundamentals.py
          git diff --check
      - name: Commit repair
        run: |
          git config user.name "vestra-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/fundamentals.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: bound Yahoo rate-limit retries in market pipeline"
          git pull --rebase origin main
          git push
