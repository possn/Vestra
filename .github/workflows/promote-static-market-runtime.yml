name: Promote static market runtime

on:
  push:
    branches: [main]
    paths:
      - 'scripts/promote_static_market_runtime.py'
      - '.github/workflows/promote-static-market-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote static market runtime
        run: python scripts/promote_static_market_runtime.py
      - name: Validate JavaScript syntax
        run: |
          node --check market.js
          node --check market-data-loader.js
          node --check market-opportunities.js
          node --check portfolio-collapsibles.js
          node --check portfolio-card-classifier.js
          node --check vestra-portfolio-hierarchy.js
          node --check vestra-swap-lab.js
          node --check vestra-ai-brief.js
          node --check vestra-portfolio-ui.js
          node --check portfolio-diagnostics.js
          node --check portfolio-sheet-navigation.js
          node --check portfolio-dossier-routing.js
          node --check politicians.js
      - name: Run architecture invariants
        run: python -m unittest discover -v -s tests -p 'test_*.py'
      - name: Validate diff
        run: git diff --check
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'vestra-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js tests scripts/promote_static_market_runtime.py \
            portfolio-collapsibles.js portfolio-card-classifier.js vestra-portfolio-hierarchy.js \
            vestra-swap-lab.js vestra-portfolio-ui.js portfolio-diagnostics.js \
            portfolio-sheet-navigation.js portfolio-dossier-routing.js
          git commit -m 'refactor: consolidate canonical portfolio runtime'
          git push
