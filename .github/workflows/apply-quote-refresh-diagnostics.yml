name: Apply quote refresh diagnostics

on:
  push:
    branches: [quote-refresh-diagnostics-20260830]
    paths:
      - 'scripts/patch_quote_refresh_diagnostics.py'
      - '.github/workflows/apply-quote-refresh-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quote-refresh-diagnostics-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/patch_quote_refresh_diagnostics.py
      - name: Validate focused contract
        run: |
          node --check app.js
          python -m unittest tests.test_quote_refresh_diagnostics -v
      - name: Commit patch
        run: |
          git config user.name "vestra-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js tests/test_quote_refresh_diagnostics.py
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "perf: measure quote fallback latency"
            git push
          fi
