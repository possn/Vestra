name: Architecture invariants

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'index.html'
      - 'sw.js'
      - 'app*.js'
      - 'market*.js'
      - 'politicians.js'
      - 'worker.js'
      - 'data/stocks-index.json'
      - 'data/dossiers-manifest.json'
      - 'data/dossiers/**'
      - 'data/politicians.json'
      - 'scripts/run.py'
      - 'scripts/congress.py'
      - 'scripts/normalize_market_provenance.py'
      - 'scripts/build_market_shards.py'
      - 'scripts/build_politicians_feed.py'
      - 'scripts/score.py'
      - 'scripts/score_audit.py'
      - 'scripts/score_forward_validation.py'
      - 'scripts/peer_benchmark.py'
      - 'scripts/score_peer_shadow.py'
      - 'scripts/score_benchmark_audit.py'
      - '.github/workflows/update-market-data.yml'
      - '.github/workflows/architecture-invariants.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'index.html'
      - 'sw.js'
      - 'app*.js'
      - 'market*.js'
      - 'politicians.js'
      - 'worker.js'
      - 'data/stocks-index.json'
      - 'data/dossiers-manifest.json'
      - 'data/dossiers/**'
      - 'data/politicians.json'
      - 'scripts/run.py'
      - 'scripts/congress.py'
      - 'scripts/normalize_market_provenance.py'
      - 'scripts/build_market_shards.py'
      - 'scripts/build_politicians_feed.py'
      - 'scripts/score.py'
      - 'scripts/score_audit.py'
      - 'scripts/score_forward_validation.py'
      - 'scripts/peer_benchmark.py'
      - 'scripts/score_peer_shadow.py'
      - 'scripts/score_benchmark_audit.py'
      - '.github/workflows/update-market-data.yml'
      - '.github/workflows/architecture-invariants.yml'

permissions:
  contents: read

concurrency:
  group: architecture-invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript syntax
        run: |
          node --check app-utils.js
          node --check app-feedback.js
          node --check app-storage.js
          node --check app-asset-identity.js
          node --check app-ui-core.js
          node --check app-broker-normalization.js
          node --check app-xtb-normalization.js
          node --check app-broker-identity-data.js
          node --check app-broker-parsing-core.js
          node --check app-file-parsing.js
          node --check app-broker-workbook.js
          node --check app-broker-parsers.js
          node --check app-market-client.js
          node --check app-quote-errors.js
          node --check app-return-assumptions.js
          node --check app-financial-engine.js
          node --check app.js
          node --check market.js
          node --check market-data-loader.js
          node --check politicians.js
          node --check worker.js
      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/run.py scripts/congress.py scripts/normalize_market_provenance.py scripts/build_market_shards.py scripts/build_politicians_feed.py scripts/score.py scripts/score_audit.py scripts/score_forward_validation.py scripts/peer_benchmark.py scripts/score_peer_shadow.py scripts/score_benchmark_audit.py
      - name: Runtime · module load order
        run: python -m unittest -v tests.test_runtime_regressions.RuntimeRegressionTests.test_app_module_load_order
      - name: Runtime · CI syntax coverage
        run: python -m unittest -v tests.test_runtime_regressions.RuntimeRegressionTests.test_all_app_modules_are_syntax_checked_by_ci
      - name: Runtime · quote errors stay inline
        run: python -m unittest -v tests.test_runtime_regressions.RuntimeRegressionTests.test_quote_errors_are_inline_not_modal_locked
      - name: Runtime · broker schema and dividend repair
        run: python -m unittest -v tests.test_runtime_regressions.RuntimeRegressionTests.test_broker_rebuild_schema_contains_latest_dividend_repair
      - name: Runtime · dividend gross tax net
        run: python -m unittest -v tests.test_runtime_regressions.RuntimeRegressionTests.test_dividend_normalization_remains_gross_minus_tax
      - name: Runtime · broker quote identities
        run: python -m unittest -v tests.test_runtime_regressions.RuntimeRegressionTests.test_canonical_broker_quote_repairs_remain_present
      - name: Runtime · Worker market-only Congress contract
        run: python -m unittest -v tests.test_runtime_regressions.RuntimeRegressionTests.test_worker_is_live_market_only_for_congress
      - name: Runtime · live dossier overlay
        run: python -m unittest -v tests.test_runtime_regressions.RuntimeRegressionTests.test_market_live_overlay_does_not_rerender_open_dossier
      - name: Runtime · storage contract
        run: python -m unittest -v tests.test_runtime_regressions.RuntimeRegressionTests.test_storage_contract_is_stable
      - name: Historical regression suite
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            [ "$test_file" = "tests/test_runtime_regressions.py" ] && continue
            echo "::group::$test_file"
            python "$test_file"
            echo "::endgroup::"
          done
