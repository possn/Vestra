name: Refactor app stage 1

on:
  push:
    paths:
      - 'scripts/refactor_app_stage1.py'
      - '.github/workflows/refactor-app-stage1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refactor-app-stage1
  cancel-in-progress: true

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded refactor
        run: python scripts/refactor_app_stage1.py

      - name: Validate JavaScript syntax
        run: |
          node --check app-utils.js
          node --check app.js

      - name: Validate script ordering and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          u = 'src="app-utils.js?v=1.0"'
          a = 'src="app.js?v=20260824v11"'
          assert u in s and a in s and s.index(u) < s.index(a), 'app-utils.js must load before app.js'
          print('script ordering: ok')
          PY
          git diff --check

      - name: Commit migrated frontend
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'vestra-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'refactor: move pure app helpers out of monolith'
          git push
