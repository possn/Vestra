name: Apply model validation maturity

on:
  push:
    branches: [model-validation-maturity-20260830]
    paths:
      - 'scripts/patch_model_validation_maturity.py'
      - '.github/workflows/apply-model-validation-maturity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-validation-maturity-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/patch_model_validation_maturity.py
      - name: Validate focused contracts
        run: |
          node --check market-model-validation.js
          python -m unittest tests.test_market_model_validation tests.test_score_forward_validation_persistence -v
      - name: Commit patch
        run: |
          git config user.name "vestra-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/score_forward_validation.py market-model-validation.js tests/test_score_forward_validation_persistence.py tests/test_market_model_validation.py
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "validation: expose maturity checkpoints"
            git push
          fi
