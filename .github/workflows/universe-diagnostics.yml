name: European universe diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/universe-diagnostics.txt'
      - 'scripts/universe.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests yfinance lxml html5lib beautifulsoup4
      - name: Build European universe diagnostic
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import universe
          rows = universe.europe_constituents()
          rx = re.compile(r'-(DE|PA|AS|MC|MI|SW)\.\1$', re.I)
          malformed = [x for x in rows if rx.search(str(x))]
          cross = [x for x in rows if re.search(r'-(DE|PA|AS|MC|MI|SW)\.(DE|PA|AS|MC|MI|SW)$', str(x), re.I)]
          report = {
            'count': len(rows),
            'malformed_duplicate_count': len(malformed),
            'malformed_duplicate_examples': malformed[:50],
            'exchange_token_before_suffix_count': len(cross),
            'exchange_token_before_suffix_examples': cross[:50],
            'sample': rows[:80],
          }
          Path('data').mkdir(exist_ok=True)
          Path('data/universe_diagnostics.json').write_text(json.dumps(report, indent=2, ensure_ascii=False)+'\n')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'vestra-diagnostics-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/universe_diagnostics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diagnostics: inspect European ticker universe'
          git push
