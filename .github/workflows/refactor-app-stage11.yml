name: Refactor app stage 11

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refactor_app_stage11.py'
      - '.github/workflows/refactor-app-stage11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded generic file parsing extraction
        run: python scripts/refactor_app_stage11.py
      - name: Validate JavaScript syntax
        run: |
          node --check app-file-parsing.js
          node --check app.js
      - name: Validate generic parsing migration and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          a=Path('app.js').read_text()
          m=Path('app-file-parsing.js').read_text()
          assert h.index('app-file-parsing.js') < h.index('app.js')
          for p in ['function splitCSVLine(','function csvToObjects(','function normKey(','function normalizeRow(','function parseNumberSmart(','function classifyRow(']:
              assert p not in a
              assert p in m
          assert 'function importRows(rows) {' in a
          assert 'VestraFileParsing não foi carregado antes de app.js' in a
          PY
          git diff --check
      - name: Commit extracted generic file parsing
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html app-file-parsing.js
          git commit -m 'refactor: move generic file parsing out of app monolith'
          git pull --rebase origin main
          git push
