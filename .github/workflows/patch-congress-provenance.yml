name: Patch Congress provenance

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/patch_congress_provenance.py'
      - '.github/workflows/patch-congress-provenance.yml'

permissions:
  contents: write

concurrency:
  group: patch-congress-provenance
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded provenance patch
        run: python scripts/patch_congress_provenance.py
      - name: Validate Python and provenance
        run: |
          python -m py_compile scripts/run.py scripts/congress.py
          grep -q 'U.S. House Clerk / STOCK Act' scripts/run.py
          ! grep -q 'STOCK Act / Bargo' scripts/run.py
          git diff --check
      - name: Commit provenance correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run.py
          git commit -m 'fix: name official House Clerk Congress source'
          git pull --rebase origin main
          git push
