name: Vestra v4.11 strict evidence gate

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/evidence-gate-v411.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Apply strict reliability gate
        shell: python
        run: |
          from pathlib import Path
          import re

          gate = Path('scripts/reliability_gate.py')
          gate.write_text(r'''"""Evidence gate for Vestra scores.

A high score built from sparse data is not a valid investment signal. This gate
keeps the raw factor score for diagnostics, but suppresses/caps the public score
when fundamental coverage and evidence confidence are insufficient.
"""
from __future__ import annotations


def _f(v):
    try:
        x=float(v)
        return x if x==x and abs(x)!=float('inf') else None
    except (TypeError, ValueError):
        return None


def apply(row: dict) -> dict:
    if row.get('quote_type') in ('ETF','CRYPTO'):
        return {}
    score=_f(row.get('score'))
    coverage=_f(row.get('data_coverage_pct')) or 0.0
    confidence=_f(row.get('confidence_score'))

    critical=(
        'roe','roa','profit_margin','operating_margin','gross_margin',
        'revenue_growth','earnings_growth','free_cash_flow','operating_cash_flow',
        'current_ratio','debt_to_equity','trailing_pe','forward_pe',
        'enterprise_to_ebitda','price_to_book','roce_proxy'
    )
    present=sum(row.get(k) is not None for k in critical)
    critical_pct=present/len(critical)*100.0

    status='robust'
    reason=None
    public=score
    raw=score

    # Hard stop: too little evidence to emit an attractiveness score at all.
    if coverage < 50 or critical_pct < 35:
        public=None
        status='insufficient_data'
        reason='Cobertura fundamental insuficiente para calcular um score robusto.'
    # Limited evidence: allow screening, but never present as a strong score.
    elif coverage < 65 or critical_pct < 50 or (confidence is not None and confidence < 55):
        if public is not None:
            public=min(public, 59.0)
        status='limited_evidence'
        reason='Score limitado pela cobertura/confiança dos dados.'
    elif confidence is not None and confidence < 65:
        if public is not None:
            public=min(public, 69.0)
        status='moderate_evidence'
        reason='Score moderado pela confiança da evidência.'

    return {
        'score_raw': raw,
        'score': round(public,1) if public is not None else None,
        'score_reliability': status,
        'score_reliability_reason': reason,
        'critical_metric_coverage_pct': round(critical_pct,1),
    }
''', encoding='utf-8')

          run=Path('scripts/run.py')
          s=run.read_text(encoding='utf-8')
          if 'from reliability_gate import apply as apply_reliability_gate' not in s:
              anchor='from confidence import assess as assess_confidence\n'
              if anchor not in s: raise SystemExit('confidence import anchor missing')
              s=s.replace(anchor,anchor+'from reliability_gate import apply as apply_reliability_gate\n',1)
          target='        row.update(assess_confidence(row))\n'
          if target not in s: raise SystemExit('confidence call anchor missing')
          if 'row.update(apply_reliability_gate(row))' not in s:
              s=s.replace(target,target+'        row.update(apply_reliability_gate(row))\n',1)
          run.write_text(s, encoding='utf-8')

          # Harden opportunity ranking as well. Missing signals must not be
          # reweighted into a high score when the dossier itself is sparse.
          opp=Path('scripts/opportunity_rank.py')
          if opp.exists():
              o=opp.read_text(encoding='utf-8')
              needle="    valuation=_f(row.get('valuation_score'))\n"
              if needle in o and 'coverage=_f(row.get(\'data_coverage_pct\'))' not in o:
                  o=o.replace(needle, needle+"    coverage=_f(row.get('data_coverage_pct')) or 0.0\n    reliability=str(row.get('score_reliability') or '').lower()\n",1)
              old="    trap_inverse=(100.0-trap) if trap is not None else None\n    opp=_weighted([\n"
              if old in o and 'insufficient_evidence = ' not in o:
                  new="    trap_inverse=(100.0-trap) if trap is not None else None\n    insufficient_evidence = (score is None or coverage < 55 or reliability == 'insufficient_data' or (conf is not None and conf < 50))\n    opp=None if insufficient_evidence else _weighted([\n"
                  o=o.replace(old,new,1)
              # Strong labels need genuinely strong evidence.
              oldlbl="    elif opp>=78: label='Prioridade alta'\n    elif opp>=66: label='Oportunidade forte'\n"
              if oldlbl in o:
                  newlbl="    elif opp>=78 and coverage>=70 and (conf is None or conf>=65): label='Prioridade alta'\n    elif opp>=66 and coverage>=65 and (conf is None or conf>=60): label='Oportunidade forte'\n    elif opp>=66: label='Interessante · evidência limitada'\n"
                  o=o.replace(oldlbl,newlbl,1)
              opp.write_text(o, encoding='utf-8')

          # UI must never call a sparse 77/100 a quantitative opportunity while
          # waiting for the refreshed data file.
          market=Path('market.js')
          m=market.read_text(encoding='utf-8')
          if 'function effectiveVestraScore(s)' not in m:
              anchor='  function vestraRead(s){\n'
              if anchor not in m: raise SystemExit('vestraRead anchor missing')
              helper="""  function effectiveVestraScore(s){\n    const cov=n(s.data_coverage_pct), conf=n(s.confidence_score), rel=txt(s.score_reliability);\n    if(rel==='insufficient_data' || cov==null || cov<50 || (conf!=null&&conf<50)) return null;\n    const raw=n(s.score);\n    if(raw==null) return null;\n    if(rel==='limited_evidence' || (cov!=null&&cov<65) || (conf!=null&&conf<55)) return Math.min(raw,59);\n    return raw;\n  }\n\n"""
              m=m.replace(anchor,helper+anchor,1)
              m=m.replace('    const score=n(s.score);\n    const dims=scoreDims(s);', '    const rawScore=n(s.score); const score=effectiveVestraScore(s);\n    const dims=scoreDims(s);',1)
              # Insert explicit sparse-evidence verdict before normal score logic.
              marker="    let label='Acompanhar', cls='is-watch', copy='Perfil intermédio: vale a pena abrir os pilares antes de tirar conclusões.';\n"
              if marker in m:
                  repl=marker+"    const cov=n(s.data_coverage_pct), rel=txt(s.score_reliability);\n    if(score==null && rawScore!=null){ label='Dados insuficientes'; cls='is-risk'; copy=`O score bruto (${Math.round(rawScore)}) não é apresentado como sinal porque a cobertura fundamental é ${cov==null?'insuficiente':Math.round(cov)+'%'}.`; }\n"
                  m=m.replace(marker,repl,1)
          market.write_text(m, encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=re.sub(r'market\.js\?v=[^\"\']+', 'market.js?v=20260823v12', h, count=1)
          idx.write_text(h, encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w=re.sub(r'vestra-cache-v\d+', 'vestra-cache-v86', w, count=1)
          sw.write_text(w, encoding='utf-8')

      - name: Validate source
        run: |
          python -m py_compile scripts/reliability_gate.py scripts/run.py scripts/opportunity_rank.py
          node --check market.js
          grep -q 'apply_reliability_gate' scripts/run.py
          grep -q 'effectiveVestraScore' market.js

      - name: Install pipeline dependencies
        run: pip install -r scripts/requirements.txt

      - name: Rebuild market data now
        working-directory: scripts
        run: python run.py

      - name: Commit fix and refreshed data
        run: |
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add scripts/reliability_gate.py scripts/run.py scripts/opportunity_rank.py market.js index.html sw.js data/
          if ! git diff --cached --quiet; then
            git commit -m "fix: suppress strong scores when evidence is sparse"
            git push
          fi
