name: Bootstrap lightweight market shards

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_market_shards.py'
      - '.github/workflows/bootstrap-market-shards.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build shards from current validated stocks.json
        working-directory: scripts
        run: python build_market_shards.py
      - name: Validate generated artefacts
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('data')
          src=json.loads((root/'stocks.json').read_text())
          idx=json.loads((root/'stocks-index.json').read_text())
          man=json.loads((root/'dossiers-manifest.json').read_text())
          source_rows=src.get('stocks',[])
          unique_tickers={str(r.get('ticker') or '').strip().upper() for r in source_rows if r.get('ticker')}
          index_rows=idx.get('stocks',[])
          manifest=man.get('tickers',{})
          assert len(index_rows) == len(unique_tickers)
          assert len(manifest) == len(unique_tickers)
          assert man.get('ticker_count') == len(unique_tickers)
          shards=list((root/'dossiers').glob('*.json'))
          assert shards
          assert all(row.get('dossier_shard') for row in index_rows if row.get('ticker'))
          assert len({row.get('ticker') for row in index_rows if row.get('ticker')}) == len(index_rows)
          print('validated', len(index_rows), 'unique rows;', len(shards), 'shards;', man.get('duplicate_rows_dropped',0), 'duplicates dropped')
          PY
      - name: Publish shards only
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stocks-index.json data/dossiers-manifest.json data/dossiers/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publish lightweight market index and dossier shards"
          git pull --rebase origin main
          git push
