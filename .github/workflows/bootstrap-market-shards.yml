name: Bootstrap lightweight market shards

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_market_shards.py'
      - '.github/workflows/bootstrap-market-shards.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build shards from current validated stocks.json
        working-directory: scripts
        run: python build_market_shards.py
      - name: Validate generated artefacts
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('data')
          src=json.loads((root/'stocks.json').read_text())
          idx=json.loads((root/'stocks-index.json').read_text())
          man=json.loads((root/'dossiers-manifest.json').read_text())
          source_rows=src.get('stocks',[])
          unique_tickers={str(r.get('ticker') or '').strip().upper() for r in source_rows if r.get('ticker')}
          index_rows=idx.get('stocks',[])
          manifest=man.get('tickers',{})
          assert len(index_rows) == len(unique_tickers)
          assert len(manifest) == len(unique_tickers)
          assert man.get('ticker_count') == len(unique_tickers)
          shards=list((root/'dossiers').glob('*.json'))
          assert shards
          assert all(row.get('dossier_shard') for row in index_rows if row.get('ticker'))
          assert len({row.get('ticker') for row in index_rows if row.get('ticker')}) == len(index_rows)

          # End-to-end lazy dossier contract: lightweight row in index, canonical
          # manifest routing, full evidence/history only in the referenced shard.
          probe='AAPL' if 'AAPL' in manifest else next(iter(manifest))
          idx_by={str(r.get('ticker') or '').upper():r for r in index_rows}
          light=idx_by[probe]
          shard_key=manifest[probe]
          assert light.get('dossier_shard') == shard_key
          assert 'price_history_1y' not in light
          shard=json.loads((root/'dossiers'/f'{shard_key}.json').read_text())
          full=(shard.get('stocks') or {}).get(probe)
          assert isinstance(full,dict) and full.get('ticker')
          if any(str(r.get('ticker') or '').upper()==probe and r.get('price_history_1y') for r in source_rows):
              assert isinstance(full.get('price_history_1y'),list) and full.get('price_history_1y')
          assert (root/'stocks-index.json').stat().st_size < (root/'stocks.json').stat().st_size * .25
          print('validated', len(index_rows), 'unique rows;', len(shards), 'shards;', man.get('duplicate_rows_dropped',0), 'duplicates dropped; lazy probe', probe, '->', shard_key)
          PY
      - name: Publish shards only
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stocks-index.json data/dossiers-manifest.json data/dossiers/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publish lightweight market index and dossier shards"
          git pull --rebase origin main
          git push
