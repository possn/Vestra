name: Fix opportunity list compatibility v4.40

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/triggers/v440-opportunity-compatible.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make opportunities work with old and new datasets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('market.js')
          s=p.read_text(encoding='utf-8')

          anchor='''  function renderDiscover(){'''
          helper='''  function effectiveOpportunityTiming(s){
    const backend=n(s?.opportunity_timing_score);
    if(backend!=null) return backend;
    const hist=Array.isArray(s?.price_history_1y)?s.price_history_1y:[];
    const closes=hist.map(x=>n(x?.close)).filter(x=>x!=null&&x>0);
    if(closes.length<22) return null;
    const ret=d=>closes.length>d&&closes[closes.length-d-1]>0?(closes[closes.length-1]/closes[closes.length-d-1]-1)*100:null;
    const r20=ret(20),r60=ret(60),hi=Math.max(...closes),cur=closes[closes.length-1],room=hi>0?(1-cur/hi)*100:null;
    const band=(v,b)=>{if(v==null)return null;for(const [u,x] of b)if(v<=u)return x;return b[b.length-1][1]};
    const a=band(r20,[[-12,20],[-5,38],[0,58],[4,86],[10,92],[16,72],[24,48],[1e9,28]]);
    const b=band(r60,[[-25,18],[-10,35],[0,55],[8,82],[20,90],[30,75],[45,50],[1e9,30]]);
    const c=room==null?null:room<2?48:room<5?62:room<=20?88:room<=35?72:room<=50?48:28;
    const parts=[[a,.42],[b,.36],[c,.22]].filter(([v])=>v!=null); if(!parts.length)return null;
    let t=parts.reduce((z,[v,w])=>z+v*w,0)/parts.reduce((z,[,w])=>z+w,0);
    const est=txt(s?.estimate_signal).toLowerCase(),rec=txt(s?.recovery_status).toLowerCase(),th=txt(s?.thesis_direction).toLowerCase();
    if(est==='improving')t+=7;else if(est==='deteriorating')t-=9;
    if(rec==='confirmed')t+=8;else if(rec==='recovering')t+=5;else if(rec==='failed'||rec==='bounce_only')t-=9;
    if(th==='up')t+=3;else if(th==='down')t-=4;
    const over=(r20!=null&&r20>18)||(r60!=null&&r60>35)||(room!=null&&room<2&&r60!=null&&r60>20);
    if((r20!=null&&r20>28)||(r60!=null&&r60>50))t-=18;else if(over)t-=10;
    return Math.max(0,Math.min(100,t));
  }

  function effectiveOpportunityOverextended(s){
    if(typeof s?.opportunity_overextended==='boolean') return s.opportunity_overextended;
    const hist=Array.isArray(s?.price_history_1y)?s.price_history_1y:[];
    const closes=hist.map(x=>n(x?.close)).filter(x=>x!=null&&x>0); if(closes.length<22)return false;
    const ret=d=>closes.length>d?(closes[closes.length-1]/closes[closes.length-d-1]-1)*100:null;
    const r20=ret(20),r60=ret(60),hi=Math.max(...closes),cur=closes[closes.length-1],room=hi>0?(1-cur/hi)*100:null;
    return (r20!=null&&r20>18)||(r60!=null&&r60>35)||(room!=null&&room<2&&r60!=null&&r60>20);
  }

  function effectiveOpportunityEligible(s){
    if(s?.opportunity_eligible===true) return true;
    if(n(s?.opportunity_timing_score)!=null) return false;
    const critical=n(s?.critical_metric_coverage_pct);
    return n(s?.opportunity_score)!=null && n(s?.score)!=null && n(s?.data_coverage_pct)>=55 && n(s?.confidence_score)>=50 && (critical==null||critical>=45) && txt(s?.zombie)!=='yes';
  }

  function opportunityBrief(s){
    const reason=Array.isArray(s?.opportunity_reasons)?txt(s.opportunity_reasons[0]):'';
    const industry=txt(s?.industry), thesis=txt(s?.thesis_type), timing=effectiveOpportunityTiming(s);
    const bits=[];
    if(industry) bits.push(industry);
    else if(thesis) bits.push(thesis);
    if(reason) bits.push(reason);
    else if(timing!=null) bits.push(timing>=70?'momentum emergente':timing>=55?'momento favorável':'timing em observação');
    return bits.slice(0,2).join(' · ');
  }

'''
          if 'function effectiveOpportunityEligible(s)' not in s:
              if anchor not in s: raise SystemExit('renderDiscover anchor missing')
              # Remove older partial fallback helper if it exists to avoid duplicate names.
              start=s.find('  function effectiveOpportunityTiming(s){')
              if start!=-1:
                  end=s.find(anchor,start)
                  if end!=-1: s=s[:start]+s[end:]
              s=s.replace(anchor,helper+anchor,1)

          import re
          s=re.sub(r"    else rows=rows\.filter\(s=>[^\n]+\);",
                   "    else rows=rows.filter(s=>effectiveOpportunityEligible(s) && effectiveOpportunityTiming(s)!=null && effectiveOpportunityTiming(s)>=45 && !effectiveOpportunityOverextended(s) && n(s.data_coverage_pct)>=55 && n(s.confidence_score)>=50 && txt(s.zombie)!=='yes');",
                   s,count=1)
          s=s.replace("return (n(b.opportunity_timing_score)||0)-(n(a.opportunity_timing_score)||0);","return (effectiveOpportunityTiming(b)||0)-(effectiveOpportunityTiming(a)||0);",1)
          s=s.replace("return (effectiveOpportunityTiming(b)||0)-(effectiveOpportunityTiming(a)||0);","return (effectiveOpportunityTiming(b)||0)-(effectiveOpportunityTiming(a)||0);",1)

          old="""rows.map(s=>renderRow(s,qs?'':[`Opportunity ${Math.round(n(s.opportunity_score))}/100`,txt(s.opportunity_label),txt(s.opportunity_timing_label),n(s.opportunity_timing_score)!=null?`Momento ${Math.round(n(s.opportunity_timing_score))}/100`:'',n(s.opportunity_return_20d_pct)!=null?`20d ${n(s.opportunity_return_20d_pct)>=0?'+':''}${num(s.opportunity_return_20d_pct)}%`:''].filter(Boolean).join(' · '),qs?null:s.opportunity_score))"""
          new="""rows.map(s=>renderRow(s,qs?'':[`Opportunity ${Math.round(n(s.opportunity_score))}/100`,`Momento ${Math.round(effectiveOpportunityTiming(s))}/100`,opportunityBrief(s)].filter(Boolean).join(' · '),qs?null:s.opportunity_score))"""
          if old in s: s=s.replace(old,new,1)
          else:
              s=re.sub(r"rows\.map\(s=>renderRow\(s,qs\?'':\[[^\n]+?qs\?null:s\.opportunity_score\)\)",new,s,count=1)

          s=s.replace('<strong>Sem resultados neste filtro.</strong><span>Experimenta outro setor ou remove a pesquisa.</span>','<strong>Sem oportunidades neste filtro.</strong><span>O Vestra não encontrou agora empresas com evidência suficiente e timing aceitável.</span>',1)
          s=s.replace('<strong>Sem oportunidades emergentes neste filtro.</strong><span>Nenhuma empresa passou agora os critérios de evidência, momentum e preço não esticado.</span>','<strong>Sem oportunidades neste filtro.</strong><span>O Vestra não encontrou agora empresas com evidência suficiente e timing aceitável.</span>',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check market.js
      - name: Commit and push
        run: |
          git config user.name "vestra-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market.js
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "fix: restore opportunity results and concise company context"
            git pull --rebase origin main
            git push
          fi
