name: Refactor app stage 4

on:
  push:
    paths:
      - 'scripts/refactor_app_stage4.py'
      - '.github/workflows/refactor-app-stage4.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded asset identity extraction
        run: python scripts/refactor_app_stage4.py
      - name: Validate JavaScript syntax
        run: |
          node --check app-asset-identity.js
          node --check app.js
      - name: Validate extracted maps and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          assert h.index('app-storage.js') < h.index('app-asset-identity.js') < h.index('app.js')
          a=Path('app.js').read_text()
          m=Path('app-asset-identity.js').read_text()
          assert 'const ISIN_YAHOO_MAP = {' not in a
          assert 'const CRYPTO_YAHOO_MAP = {' not in a
          assert 'function cryptoToYahoo(raw)' not in a
          assert '"PTCOR0AE0006":"COR.LS"' in m
          assert '"BTC":"BTC-USD"' in m
          assert '"ETH":"ETH-USD"' in m
          PY
          git diff --check
      - name: Commit extracted asset identity domain
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html app-asset-identity.js
          git commit -m 'refactor: move asset identity maps out of app monolith'
          git push
