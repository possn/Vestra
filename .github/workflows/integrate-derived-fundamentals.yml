name: Integrate derived fundamentals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-derived-fundamentals.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded integration
        run: python scripts/integrate_derived_fundamentals.py
      - name: Validate integration
        run: |
          python -m py_compile scripts/run.py scripts/derived_fundamentals.py
          grep -q 'raw = enrich_derived_fundamentals(raw)' scripts/run.py
          grep -q 'row\["derived_metrics"\]' scripts/run.py
          test ! -f scripts/integrate_derived_fundamentals.py
          test ! -f .github/workflows/integrate-derived-fundamentals.yml
      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name 'vestra-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A scripts .github/workflows
          git diff --cached --check
          git commit -m 'feat: integrate conservative derived fundamentals'
          git push
