name: Refactor app stage 5

on:
  push:
    paths:
      - 'scripts/refactor_app_stage5.py'
      - '.github/workflows/refactor-app-stage5.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded UI core extraction
        run: python scripts/refactor_app_stage5.py
      - name: Validate JavaScript syntax
        run: |
          node --check app-ui-core.js
          node --check app.js
      - name: Validate extracted UI core and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          assert h.index('app-asset-identity.js') < h.index('app-ui-core.js') < h.index('app.js')
          a=Path('app.js').read_text()
          m=Path('app-ui-core.js').read_text()
          for token in ['const NOOP_EL = {','function resolveChartHeight(','function prepareChartCanvas(','function ensureChartCtx(','function clearChartUnavailable(']:
              assert token not in a
              assert token in m
          assert 'window.VestraUiCore = Object.freeze' in m
          assert 'VestraUiCore não foi carregado antes de app.js' in a
          PY
          git diff --check
      - name: Commit extracted UI core domain
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html app-ui-core.js
          git commit -m 'refactor: move DOM and chart helpers out of app monolith'
          git pull --rebase origin main
          git push
