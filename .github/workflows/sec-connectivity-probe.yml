name: SEC endpoint probe

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/sec-connectivity-probe.yml'
      - 'scripts/sec_endpoint_probe.py'

permissions:
  contents: read

env:
  # SEC asks automated clients to identify themselves with a name and contact.
  # Use a GitHub noreply contact for the diagnostic so no personal email is exposed.
  SEC_USER_AGENT: 'Vestra/4.0 possn@users.noreply.github.com'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependency
        run: pip install requests

      - name: Validate probe modules
        run: python -m py_compile scripts/asset_types.py scripts/sec_enrich.py scripts/sec_endpoint_probe.py

      - name: Probe SEC APIs and official bulk archives
        working-directory: scripts
        run: python sec_endpoint_probe.py
