name: Apply Vestra v4.2 capital risk

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v42_capital_risk.py'
      - '.github/workflows/apply-v42-capital-risk.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate v4.2
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v42_capital_risk.py
          rm -f scripts/apply_v42_capital_risk.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- scripts/run.py scripts/score.py scripts/thesis.py scripts/capital_risk.py README.md sw.js
          git add -u scripts/apply_v42_capital_risk.py
          git commit -m "feat: Vestra v4.2 capital structure risk"
          git push origin HEAD:main
