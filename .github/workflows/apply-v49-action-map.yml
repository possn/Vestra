name: Apply Vestra v4.9 portfolio action map

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v4.9-portfolio-action-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v4.9-portfolio-action-map
          fetch-depth: 0
      - name: Apply and validate v4.9
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v49_action_map.py
          rm -f scripts/apply_v49_action_map.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- market.js market.css README.md sw.js
          git add -u scripts/apply_v49_action_map.py
          if git diff --cached --quiet; then
            echo "v4.9 already applied"
          else
            git commit -m "feat: Vestra v4.9 portfolio action map"
            git push origin HEAD:chatgpt/v4.9-portfolio-action-map
          fi
