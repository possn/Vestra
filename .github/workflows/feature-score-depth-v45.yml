name: Vestra v4.5 score depth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/feature-score-depth-v45.yml'

permissions:
  contents: write

jobs:
  feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch scoring depth
        shell: python
        run: |
          from pathlib import Path
          import re

          # ---- fundamentals: SBC metrics ----
          p=Path('scripts/fundamentals.py'); s=p.read_text()
          if 'sbc_to_revenue: float | None = None' not in s:
              s=s.replace('    dividend_fcf_coverage: float | None = None\n    annual_quality_history:', '    dividend_fcf_coverage: float | None = None\n    stock_based_compensation: float | None = None\n    sbc_to_revenue: float | None = None\n    annual_quality_history:',1)
          marker='            # Interest coverage is derived from the latest income statement.\n'
          if 'stock-based compensation intensity' not in s:
              block='''            # Stock-based compensation intensity. Missing stays missing; never infer zero.\n            try:\n                cf = t.cashflow\n                fin = t.financials\n                if cf is not None and not cf.empty:\n                    for label in ("Stock Based Compensation", "Stock Based Compensation Expense"):\n                        if label in cf.index:\n                            v = _as_float(cf.loc[label].iloc[0])\n                            if v is not None:\n                                m.stock_based_compensation = abs(v)\n                            break\n                if m.stock_based_compensation is not None and fin is not None and not fin.empty:\n                    rev = _row_value(fin, ("Total Revenue", "Operating Revenue"))\n                    if rev not in (None, 0):\n                        m.sbc_to_revenue = m.stock_based_compensation / abs(rev)\n            except Exception as e:\n                log.debug("%s: stock-based compensation intensity unavailable (%s)", ticker, e)\n\n'''
              s=s.replace(marker,block+marker,1)
          p.write_text(s)

          # ---- score: multi-year consistency + SBC discipline ----
          p=Path('scripts/score.py'); s=p.read_text()
          if 'consistency_pct: float | None = None' not in s:
              s=s.replace('    capital_allocation_pct: float | None = None\n', '    capital_allocation_pct: float | None = None\n    consistency_pct: float | None = None\n    sbc_to_revenue: float | None = None\n',1)
          if 'def _history_consistency(' not in s:
              anchor='def _score_model_for(r: RawMetrics) -> str:\n'
              helper='''def _history_consistency(history):\n    """0..100 score for 3-4y operating consistency; None when history is sparse."""\n    if not isinstance(history, list) or len(history) < 3:\n        return None\n    metric_scores=[]\n    for key in ("roe","operating_margin","net_margin","roce_proxy"):\n        vals=[]\n        for row in history[:4]:\n            try:\n                v=row.get(key) if isinstance(row,dict) else None\n                if v is not None:\n                    vals.append(float(v))\n            except Exception:\n                pass\n        if len(vals)<3:\n            continue\n        mean=sum(vals)/len(vals)\n        variance=sum((x-mean)**2 for x in vals)/len(vals)\n        sd=variance**0.5\n        scale=max(abs(mean),0.03)\n        stability=max(0.0,100.0-(sd/scale)*55.0)\n        positive=sum(1 for x in vals if x>0)/len(vals)*100.0\n        metric_scores.append(stability*0.7+positive*0.3)\n    return sum(metric_scores)/len(metric_scores) if metric_scores else None\n\n\n'''
              s=s.replace(anchor,helper+anchor,1)
          if 'consistency_raw = [_history_consistency' not in s:
              anchor='    out: list[ScoredTicker] = []\n'
              block='''    consistency_raw = [_history_consistency(r.annual_quality_history) for r in equities]\n    consistency_pct_all = [_percentile_rank(v, consistency_raw) if v is not None else None for v in consistency_raw]\n    sbc_ratios = [r.sbc_to_revenue for r in equities]\n\n'''
              s=s.replace(anchor,block+anchor,1)
          # Growth-tech: include consistency in quality and SBC in capital allocation.
          old='''            capital_allocation = _avg([\n                _percentile_rank(r.diluted_shares_yoy,[x.diluted_shares_yoy for x in peers],invert=True),\n                _percentile_rank(r.roce_proxy,[x.roce_proxy for x in peers]),\n            ])'''
          new='''            consistency = consistency_pct_all[idx]\n            quality = _avg([quality, consistency])\n            capital_allocation = _avg([\n                _percentile_rank(r.diluted_shares_yoy,[x.diluted_shares_yoy for x in peers],invert=True),\n                _percentile_rank(r.sbc_to_revenue,[x.sbc_to_revenue for x in peers],invert=True),\n                _percentile_rank(r.roce_proxy,[x.roce_proxy for x in peers]),\n            ])'''
          s=s.replace(old,new,1)
          # General: consistency and SBC discipline.
          old='''            capital_allocation = _avg([\n                _percentile_rank(r.diluted_shares_yoy, [x.diluted_shares_yoy for x in equities], invert=True),\n                buyback_signal,\n                _percentile_rank(r.roce_proxy, [x.roce_proxy for x in equities]),\n                dividend_cover_rank,\n            ])'''
          new='''            consistency = consistency_pct_all[idx]\n            quality = _avg([quality, consistency])\n            capital_allocation = _avg([\n                _percentile_rank(r.diluted_shares_yoy, [x.diluted_shares_yoy for x in equities], invert=True),\n                _percentile_rank(r.sbc_to_revenue, sbc_ratios, invert=True),\n                buyback_signal,\n                _percentile_rank(r.roce_proxy, [x.roce_proxy for x in equities]),\n                dividend_cover_rank,\n            ])'''
          s=s.replace(old,new,1)
          # Add explicit SBC risk only when economically material and accompanied by dilution.
          risk_anchor='''        if r.diluted_shares_yoy is not None and r.diluted_shares_yoy > 0.50:\n            risk_flags.append("severe_dilution")\n'''
          if 'sbc_dilution_pressure' not in s:
              s=s.replace(risk_anchor,risk_anchor+'        if r.sbc_to_revenue is not None and r.sbc_to_revenue > 0.15 and r.diluted_shares_yoy is not None and r.diluted_shares_yoy > 0.08:\n            risk_flags.append("sbc_dilution_pressure")\n',1)
          # Coverage/output fields.
          s=s.replace('            r.dividend_fcf_coverage,\n        ]','            r.dividend_fcf_coverage, r.sbc_to_revenue, consistency_raw[idx],\n        ]',1)
          s=s.replace('            capital_allocation_pct=round(capital_allocation, 1) if capital_allocation is not None else None,\n', '            capital_allocation_pct=round(capital_allocation, 1) if capital_allocation is not None else None,\n            consistency_pct=round(consistency_pct_all[idx],1) if consistency_pct_all[idx] is not None else None,\n            sbc_to_revenue=r.sbc_to_revenue,\n',1)
          p.write_text(s)

          # ---- dossier UI: expose new dimension; robust evidence tab if v4.4 did not land ----
          p=Path('market.js'); s=p.read_text()
          s=s.replace("['Alocação de capital',s.capital_allocation_pct],['Estabilidade',s.stability_pct]", "['Alocação de capital',s.capital_allocation_pct],['Consistência 3Y',s.consistency_pct],['Estabilidade',s.stability_pct]",1)
          if 'data-detail-tab="evidence"' not in s:
              s=s.replace('<button class="market-tab" data-detail-tab="financials">Financeiro</button>', '<button class="market-tab" data-detail-tab="financials">Financeiro</button><button class="market-tab" data-detail-tab="evidence">Evidência</button>',1)
          if 'function evidencePanel(s)' not in s:
              marker='  function detailBase(s){\n'
              helper='''  function evidencePanel(s){\n    const score=n(s.confidence_score), coverage=n(s.data_coverage_pct), age=n(s.fundamental_age_days);\n    const sources=Array.isArray(s.data_sources)?s.data_sources.filter(Boolean):[];\n    const reasons=Array.isArray(s.confidence_reasons)?s.confidence_reasons.filter(Boolean):[];\n    return `<div class="market-detail-card"><div class="market-perspective-head"><div><small>EVIDÊNCIA</small><h4>Robustez da análise</h4></div><span class="market-consensus ${score!=null&&score>=80?'is-positive':score!=null&&score<60?'is-negative':''}">${score==null?'—':Math.round(score)+'/100'}</span></div><div class="market-metrics"><div class="market-metric"><small>Cobertura</small><strong>${coverage==null?'—':Math.round(coverage)+'%'}</strong></div><div class="market-metric"><small>Idade fundamental</small><strong>${age==null?'—':Math.round(age)+' dias'}</strong></div><div class="market-metric"><small>Consistência 3Y</small><strong>${n(s.consistency_pct)==null?'—':Math.round(n(s.consistency_pct))+'/100'}</strong></div><div class="market-metric"><small>SBC / Receita</small><strong>${n(s.sbc_to_revenue)==null?'—':pct(s.sbc_to_revenue)}</strong></div><div class="market-metric"><small>ISIN</small><strong>${esc(txt(s.isin)||'—')}</strong></div><div class="market-metric"><small>LEI</small><strong>${esc(txt(s.lei)||'—')}</strong></div></div>${sources.length?`<div class="market-signal-row" style="margin-top:14px">${sources.map(x=>`<span class="market-signal">${esc(x)}</span>`).join('')}</div>`:''}${reasons.length?`<ul class="market-case-list">${reasons.slice(0,5).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`;\n  }\n\n'''
              s=s.replace(marker,helper+marker,1)
          if "if(tab==='evidence')" not in s:
              s=s.replace("    if(tab==='growth') body.innerHTML=", "    if(tab==='evidence') body.innerHTML=evidencePanel(s);\n    if(tab==='growth') body.innerHTML=",1)
          p.write_text(s)

          # Cache bust only market/data UI; do not touch portfolio logic.
          p=Path('index.html'); s=p.read_text(); s=re.sub(r'market\\.js\\?v=[^\"\\']+', 'market.js?v=20260823v7', s, count=1); p.write_text(s)
          p=Path('sw.js'); s=p.read_text(); s=re.sub(r'vestra-cache-v\\d+', 'vestra-cache-v81', s, count=1); p.write_text(s)

      - name: Validate
        run: |
          python -m py_compile scripts/fundamentals.py scripts/score.py
          node --check market.js
          grep -q 'sbc_to_revenue' scripts/fundamentals.py
          grep -q 'consistency_pct' scripts/score.py
          grep -q 'data-detail-tab="evidence"' market.js

      - name: Commit
        run: |
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add scripts/fundamentals.py scripts/score.py market.js index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: v4.5 add multi-year consistency and SBC-aware scoring"
            git push
          fi
