name: Apply Vestra v6.6.1 queue and low52 rank
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'chatgpt/v6.6.1-queue-navigation-low52-rank'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6.6.1-queue-navigation-low52-rank
          fetch-depth: 0
      - name: Apply and validate v6.6.1
        run: |
          set -euo pipefail
          python scripts/apply_v661_queue_navigation_low52_rank.py
          rm -f scripts/apply_v661_queue_navigation_low52_rank.py
          python -m py_compile scripts/*.py
          node --check app.js
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add README.md app.js market.js sw.js
          git add -u scripts/apply_v661_queue_navigation_low52_rank.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: Vestra v6.6.1 queue navigation and low52 rank"
            git push origin HEAD:chatgpt/v6.6.1-queue-navigation-low52-rank
          fi
