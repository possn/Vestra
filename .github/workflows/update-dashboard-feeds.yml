name: Update dashboard news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/refresh_dashboard_news.py'
      - '.github/workflows/update-dashboard-feeds.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: update-dashboard-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install news dependency
        run: pip install requests
      - name: Refresh compact Dashboard news
        run: PYTHONPATH=scripts python scripts/refresh_dashboard_news.py
      - name: Validate news payload
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=json.loads(Path('data/dashboard-news.json').read_text())
          assert p.get('generated_at')
          assert len(p.get('items') or []) >= 5
          ts=datetime.fromisoformat(p['generated_at'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-ts).total_seconds()
          assert 0 <= age < 900, f'stale dashboard news payload: {age}s'
          print(f"Validated {len(p['items'])} dashboard headlines")
          PY
      - name: Check automated main publish window
        id: publish_window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/defer_main_publish_if_code_pr.py

      - name: Check news freshness emergency publish
        id: news_freshness
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          try:
              raw = subprocess.check_output(['git', 'show', 'HEAD:data/dashboard-news.json'], text=True)
              ts = json.loads(raw).get('generated_at', '')
              stamp = datetime.fromisoformat(ts.replace('Z', '+00:00'))
              age = (datetime.now(timezone.utc) - stamp).total_seconds()
          except Exception:
              age = float('inf')
          overdue = age >= 90 * 60
          print(f"Published dashboard news age: {age / 60:.1f} min; emergency publish: {overdue}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"overdue={'true' if overdue else 'false'}\n")
          PY

      # Avoid indefinite freeze when design PRs keep the regular data publish window closed.
      # Normal 30-minute runs still defer while a mergeable code PR is open.
      - name: Publish dashboard news
        if: steps.publish_window.outputs.defer != 'true' || steps.news_freshness.outputs.overdue == 'true'
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard-news.json
          if git diff --cached --quiet; then
            echo "Dashboard news unchanged."
          else
            git commit -m "Actualização notícias Dashboard ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            PUBLISH_SUPERSEDE_COMMIT_PREFIX="Actualização notícias Dashboard (" \
              bash scripts/publish_with_retry.sh origin main
          fi
