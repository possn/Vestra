name: Vestra v4.28 Enrichment provenance

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/v428-provenance.txt'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist annual and quarterly gap-retrieval provenance
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/fundamentals.py')
          s=p.read_text()
          anchor='''    fund_sector_weightings: dict = field(default_factory=dict)\n\n    error: str | None = None\n'''
          repl='''    fund_sector_weightings: dict = field(default_factory=dict)\n\n    # Targeted retrieval provenance. These fields live on the dataclass so they\n    # survive dataclasses.asdict() and can be audited in the published dossier.\n    gap_statement_enriched: bool = False\n    gap_coverage_before: float | None = None\n    gap_coverage_after: float | None = None\n    quarterly_gap_enriched: bool = False\n    quarterly_gap_coverage_before: float | None = None\n    quarterly_gap_coverage_after: float | None = None\n\n    error: str | None = None\n'''
          if anchor not in s:
              raise SystemExit('RawMetrics provenance anchor missing')
          p.write_text(s.replace(anchor,repl,1))

          p=Path('scripts/run.py')
          s=p.read_text()
          anchor='''        if rm is not None and getattr(rm, "esef_enriched", False):\n            row["data_sources"].append("ESEF / filings.xbrl.org")\n            row["identity_source"] = "GLEIF/ANNA ISIN→LEI"\n            row["isin"] = getattr(rm, "isin", None)\n            row["lei"] = getattr(rm, "lei", None)\n            row["esef_period_end"] = getattr(rm, "esef_period_end", None)\n'''
          repl=anchor+'''        if rm is not None and getattr(rm, "gap_statement_enriched", False):\n            row["data_sources"].append("Yahoo Statements (targeted)")\n            row["gap_statement_enriched"] = True\n            row["gap_coverage_before"] = getattr(rm, "gap_coverage_before", None)\n            row["gap_coverage_after"] = getattr(rm, "gap_coverage_after", None)\n        if rm is not None and getattr(rm, "quarterly_gap_enriched", False):\n            row["data_sources"].append("Yahoo Quarterly Statements (TTM)")\n            row["quarterly_gap_enriched"] = True\n            row["quarterly_gap_coverage_before"] = getattr(rm, "quarterly_gap_coverage_before", None)\n            row["quarterly_gap_coverage_after"] = getattr(rm, "quarterly_gap_coverage_after", None)\n'''
          if anchor not in s:
              raise SystemExit('run.py source provenance anchor missing')
          p.write_text(s.replace(anchor,repl,1))
          PY
          python -m py_compile scripts/fundamentals.py scripts/run.py
      - name: Commit
        run: |
          git config user.name 'vestra-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/fundamentals.py scripts/run.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: persist targeted retrieval provenance in dossiers'
          git push
