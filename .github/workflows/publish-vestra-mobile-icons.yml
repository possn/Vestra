name: Publish Vestra 2.0 mobile icons
on:
  push:
    branches: [main]
    paths:
      - vestra-icon-2026.svg
      - scripts/render_vestra_mobile_icons.py
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: publish-vestra-mobile-icons
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install 'cairosvg>=2.7,<3'
      - run: python scripts/render_vestra_mobile_icons.py
      - name: Check protected publish window
        id: publish_window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/defer_main_publish_if_code_pr.py
      - name: Publish updated icons
        if: steps.publish_window.outputs.defer != 'true'
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apple-touch-icon*.png icon192.png icon512.png icon192-maskable.png icon512-maskable.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Vestra 2.0 iOS and PWA icons"
            bash scripts/publish_with_retry.sh origin main
          fi
