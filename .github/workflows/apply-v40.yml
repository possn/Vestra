name: Apply Vestra v4.0 release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v4.0-european-source-fusion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v4.0-european-source-fusion
          fetch-depth: 0
      - name: Apply and validate v4.0
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/apply_v40_release2.py ]; then
            echo "Release transform already applied."
            exit 0
          fi
          python scripts/apply_v40_release2.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          rm -f v40.patch.gz.b64 scripts/apply_v40_release.py scripts/apply_v40_release2.py .github/workflows/apply-v40.yml
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- README.md DATA_SOURCES.md index.html market.js sw.js scripts/run.py scripts/esef_enrich.py .github/workflows/update-market-data.yml
          git add -u
          git commit -m "feat: Vestra v4.0 European source fusion"
          git push origin HEAD:chatgpt/v4.0-european-source-fusion
