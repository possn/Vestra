name: Apply market ETF theme UI patch

on:
  push:
    branches:
      - fix/market-etf-themes-dossier-actions-20260907
    paths:
      - .github/workflows/apply-market-etf-theme-ui.yml
      - tools/apply_market_etf_theme_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/market-etf-themes-dossier-actions-20260907
      - name: Apply isolated Market UI patch
        run: python3 tools/apply_market_etf_theme_patch.py
      - name: Commit clean patch
        run: |
          rm .github/workflows/apply-market-etf-theme-ui.yml tools/apply_market_etf_theme_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add thematic ETF discovery and align dossier actions"
          git push origin HEAD:fix/market-etf-themes-dossier-actions-20260907
