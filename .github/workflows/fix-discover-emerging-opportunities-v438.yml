name: Fix Discover emerging opportunities v4.38

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/v438-discover-opportunities.txt'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Discover with strict opportunity timing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('market.js')
          s = p.read_text(encoding='utf-8')

          old_filter = "    else rows=rows.filter(s=>n(s.score)!=null && n(s.data_coverage_pct)>=65 && txt(s.zombie)!=='yes');"
          new_filter = "    else rows=rows.filter(s=>n(s.opportunity_score)!=null && s.opportunity_eligible===true && n(s.opportunity_timing_score)>=55 && s.opportunity_overextended!==true && n(s.data_coverage_pct)>=55 && n(s.confidence_score)>=50 && txt(s.zombie)!=='yes');"
          if old_filter not in s:
              raise SystemExit('v4.38 filter anchor missing')
          s = s.replace(old_filter, new_filter, 1)

          old_rank = "      const dir=x=>txt(x.thesis_direction)==='up'?5:txt(x.thesis_direction)==='down'?-5:0;\n      const rank=x=>n(x.opportunity_score)??((n(x.score)||0)+dir(x)); rows.sort((a,b)=>rank(b)-rank(a));"
          new_rank = "      rows.sort((a,b)=>{\n        const ob=n(b.opportunity_score)||0, oa=n(a.opportunity_score)||0;\n        if(ob!==oa) return ob-oa;\n        return (n(b.opportunity_timing_score)||0)-(n(a.opportunity_timing_score)||0);\n      });"
          if old_rank not in s:
              raise SystemExit('v4.38 ranking anchor missing')
          s = s.replace(old_rank, new_rank, 1)

          s = s.replace(
              "Oportunidade agora · qualidade estrutural + valuation + momentum emergente + confirmação de recuperação",
              "Oportunidades emergentes · empresas robustas com momentum a começar, sem preço excessivamente esticado",
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY
          node --check market.js
          grep -F "opportunity_timing_score)>=55" market.js
          grep -F "opportunity_overextended!==true" market.js
      - name: Commit and push
        run: |
          git config user.name "vestra-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market.js
          git diff --cached --quiet && { echo 'No patch produced'; exit 1; }
          git commit -m "fix: show only emerging, non-extended opportunities"
          git pull --rebase origin main
          git push
