name: Harden Worker CORS

on:
  push:
    paths:
      - 'scripts/harden_worker_cors.py'
      - '.github/workflows/harden-worker-cors.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harden-worker-cors
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded CORS patch
        run: python scripts/harden_worker_cors.py

      - name: Validate Worker syntax and diff
        run: |
          node --check worker.js
          git diff --check
          grep -q 'host.endsWith(".github.io")' worker.js
          grep -q 'host.endsWith(".pages.dev")' worker.js
          grep -q '"Vary": "Origin"' worker.js

      - name: Commit hardened Worker
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'vestra-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add worker.js
          git commit -m 'security: validate Worker CORS origins by hostname'
          git push
