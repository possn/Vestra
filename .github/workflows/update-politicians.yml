name: Update politicians feed

on:
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/build_politicians_feed.py'
      - 'scripts/enrich_politicians_senate.py'
      - 'scripts/build_executive_feed.py'
      - 'scripts/normalize_executive_amounts.py'
      - 'scripts/congress.py'
      - '.github/workflows/update-politicians.yml'

permissions:
  contents: write

concurrency:
  group: update-politicians-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install requests pdfplumber beautifulsoup4
      - name: Validate builders, dossier mapper and UI
        run: |
          python -m py_compile scripts/build_politicians_feed.py scripts/enrich_politicians_senate.py scripts/build_executive_feed.py scripts/normalize_executive_amounts.py scripts/congress.py
          node --check politicians.js
      - name: Build House politicians snapshot
        run: python scripts/build_politicians_feed.py
      - name: Merge official Senate eFD PTRs
        run: python scripts/enrich_politicians_senate.py
      - name: Refresh official Executive OGE PTRs
        run: python scripts/build_executive_feed.py
      - name: Normalize Executive OCR ranges
        run: python scripts/normalize_executive_amounts.py
      - name: Validate snapshots and dossier mapping
        run: |
          python - <<'PY'
          import datetime as dt, json, re
          from pathlib import Path
          from scripts.congress import fetch_congress_for_universe

          p=Path('data/politicians.json')
          assert p.exists(), 'politicians snapshot missing'
          d=json.loads(p.read_text())
          assert d.get('schema_version') == 2
          assert len(d.get('trades') or []) >= 10
          assert len(d.get('members') or []) >= 2
          assert all(x.get('ticker') and x.get('member') and x.get('transaction_date') for x in d['trades'][:50])
          newest=d.get('newest_disclosure')
          assert newest, 'newest disclosure missing'
          age=(dt.date.today()-dt.date.fromisoformat(newest)).days
          assert age <= 60, f'politicians feed stale by {age} days'
          assert d.get('source') in {'U.S. House Clerk','U.S. House Clerk + Senate eFD'}
          coverage=set(d.get('coverage_chambers') or [])
          assert coverage and coverage <= {'House','Senate'}, coverage
          assert 'House' in coverage
          if d.get('source') == 'U.S. House Clerk':
              assert coverage == {'House'}
          if d.get('source') == 'U.S. House Clerk + Senate eFD':
              assert coverage == {'House','Senate'}
              assert any(x.get('chamber') == 'Senate' for x in d['trades'])
          tickers=sorted({x['ticker'] for x in d['trades'] if x.get('ticker')})[:100]
          mapped=fetch_congress_for_universe(tickers)
          assert mapped, 'dossier Congress mapper returned no matching tickers'
          sample=next(iter(mapped.values()))[0]
          assert sample.get('member') and sample.get('transaction_date') and sample.get('amount_range')

          e=Path('data/executives.json')
          assert e.exists(), 'executive snapshot missing'
          ex=json.loads(e.read_text())
          trades=ex.get('trades') or []
          people=ex.get('people') or []
          assert any(x.get('key') == 'executive:donald-trump' for x in people), 'Donald Trump missing from executive feed'
          assert sum(1 for x in trades if x.get('type') == 'buy') >= 10, 'executive top-10 buys unavailable'
          assert sum(1 for x in trades if x.get('type') == 'sell') >= 10, 'executive top-10 sells unavailable'
          assert all(x.get('ticker') and x.get('filing_url') for x in trades[:20])
          for x in trades:
              nums=[int(v.replace(',','')) for v in re.findall(r'\$([0-9,]+)', x.get('amount') or '')]
              if len(nums)>=2:
                  assert nums[1] >= nums[0], f'bad executive amount range: {x}'
          PY
      - name: Publish snapshots
        run: |
          git config user.name 'vestra-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/politicians.json data/executives.json
          if git diff --cached --quiet; then
            echo 'Sem alterações nos feeds políticos.'
          else
            git commit -m "Actualização feeds políticos ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push
          fi
