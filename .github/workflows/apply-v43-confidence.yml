name: Apply Vestra v4.3 confidence engine

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v4.3-confidence-finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v4.3-confidence-finalize
          fetch-depth: 0
      - name: Apply and validate v4.3
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/apply_v43_confidence.py ]; then
            echo "Confidence release already applied."
            exit 0
          fi
          python scripts/apply_v43_confidence.py
          rm -f scripts/apply_v43_confidence.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- scripts/confidence.py scripts/sec_enrich.py scripts/run.py scripts/thesis.py README.md sw.js
          git add -u scripts/apply_v43_confidence.py
          git commit -m "feat: Vestra v4.3 confidence engine"
          git push origin HEAD:chatgpt/v4.3-confidence-finalize
