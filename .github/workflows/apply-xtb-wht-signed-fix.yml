name: Apply signed XTB WHT correction patch

on:
  push:
    branches:
      - fix/xtb-wht-signed-corrections-20260907
    paths:
      - .github/workflows/apply-xtb-wht-signed-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/xtb-wht-signed-corrections-20260907
      - name: Apply minimal signed-tax patch and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)} for {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app-broker-parsers.js',
              '      evt.taxEUR = Math.abs(amount);\n      evt.resultEUR = -Math.abs(amount);',
              '      // Preserve sign: a negative WHT row is tax withheld; a positive row is a tax reversal/correction.\n      evt.taxEUR = -amount;\n      evt.resultEUR = amount;'
          )

          replace_once(
              'app-broker-normalization.js',
              'function divFloor(d, v) {\n  return (d && d.isAdjustment) ? v : Math.max(0, v);\n}\n',
              'function divFloor(d, v) {\n  return (d && d.isAdjustment) ? v : Math.max(0, v);\n}\n\nfunction divTax(d, v) {\n  const tax = parseNum(v);\n  return (d && d.isAdjustment) ? tax : Math.max(0, tax);\n}\n'
          )
          replace_once('app-broker-normalization.js', '  const tax = Math.max(0, parseNum(d && d.taxWithheld || 0));\n  if (!d) return 0;', '  const tax = divTax(d, d && d.taxWithheld || 0);\n  if (!d) return 0;')
          replace_once('app-broker-normalization.js', '  const tax = Math.max(0, parseNum(d && d.taxWithheld || 0));\n  if (!d) return 0;', '  const tax = divTax(d, d && d.taxWithheld || 0);\n  if (!d) return 0;')
          replace_once('app-broker-normalization.js', '  const tax = Math.max(0, parseNum(d.taxWithheld || 0));', '  const tax = divTax(d, d.taxWithheld || 0);')
          replace_once('app-broker-normalization.js', '    const tax = Math.max(0, parseNum(e.taxEUR));', '    const tax = e.type === "DIVIDEND_ADJ" ? parseNum(e.taxEUR) : Math.max(0, parseNum(e.taxEUR));')
          replace_once('app-broker-normalization.js', '    r.storedTax += Math.max(0, parseNum(d.taxWithheld));', '    r.storedTax += divTax(d, d.taxWithheld);')
          replace_once('app-broker-normalization.js', '    divFloor, getDividendGross, getDividendNet, normalizeDividendRecord, reconcileBrokerDividends', '    divFloor, divTax, getDividendGross, getDividendNet, normalizeDividendRecord, reconcileBrokerDividends')

          replace_once(
              'app.js',
              '      if (!(parseNum(a.taxEUR) > 0 && parseNum(a.totalEUR) === 0)) continue;',
              '      if (!(parseNum(a.taxEUR) !== 0 && parseNum(a.totalEUR) === 0)) continue;'
          )
          replace_once(
              'app.js',
              '      if (!e || e.type !== "DIVIDEND" || !(parseNum(e.totalEUR) > 0)) continue;',
              '      const pairableDividend = e && ((e.type === "DIVIDEND" && parseNum(e.totalEUR) > 0) || (e.type === "DIVIDEND_ADJ" && parseNum(e.totalEUR) < 0));\n      if (!pairableDividend) continue;'
          )
          replace_once(
              'app.js',
              '      if (e.broker === "XTB" && parseNum(e.totalEUR) === 0 && parseNum(e.taxEUR) > 0) {',
              '      if (e.broker === "XTB" && parseNum(e.totalEUR) === 0 && parseNum(e.taxEUR) !== 0) {'
          )
          replace_once(
              'app.js',
              '      const tax = Math.max(0, parseNum(e.taxEUR));',
              '      const tax = e.type === "DIVIDEND_ADJ" ? parseNum(e.taxEUR) : Math.max(0, parseNum(e.taxEUR));'
          )
          replace_once(
              'app.js',
              '      if (!(whtTotal > 0)) continue;',
              '      if (!Number.isFinite(whtTotal) || Math.abs(whtTotal) < 1e-9) continue;'
          )
          replace_once(
              'app.js',
              '        const cappedTax = Math.min(parseNum(d.grossAmount), parseNum(d.taxWithheld) + share);\n        d.taxWithheld = cappedTax;',
              '        const adjustedTax = parseNum(d.taxWithheld) + share;\n        const cappedTax = Math.max(0, Math.min(parseNum(d.grossAmount), adjustedTax));\n        d.taxWithheld = cappedTax;'
          )

          Path('tests/test_xtb_wht_signed_corrections.py').write_text('''from pathlib import Path\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\nPARSER = (ROOT / "app-broker-parsers.js").read_text(encoding="utf-8")\nNORM = (ROOT / "app-broker-normalization.js").read_text(encoding="utf-8")\nAPP = (ROOT / "app.js").read_text(encoding="utf-8")\n\n\nclass XtbWithholdingSignedCorrectionTests(unittest.TestCase):\n    def test_xtb_parser_preserves_wht_reversal_sign(self):\n        self.assertIn("evt.taxEUR = -amount;", PARSER)\n        self.assertIn("evt.resultEUR = amount;", PARSER)\n        self.assertNotIn("evt.taxEUR = Math.abs(amount);", PARSER)\n\n    def test_negative_dividend_correction_can_pair_with_positive_wht_reversal(self):\n        self.assertIn('e.type === "DIVIDEND_ADJ" && parseNum(e.totalEUR) < 0', APP)\n        self.assertIn('parseNum(a.taxEUR) !== 0 && parseNum(a.totalEUR) === 0', APP)\n\n    def test_dividend_adjustment_tax_is_signed_end_to_end(self):\n        self.assertIn("function divTax(d, v)", NORM)\n        self.assertIn('(d && d.isAdjustment) ? tax : Math.max(0, tax)', NORM)\n        self.assertIn('e.type === "DIVIDEND_ADJ" ? parseNum(e.taxEUR)', NORM)\n        self.assertIn('r.storedTax += divTax(d, d.taxWithheld);', NORM)\n        self.assertIn('e.type === "DIVIDEND_ADJ" ? parseNum(e.taxEUR)', APP)\n\n    def test_orphan_wht_can_reduce_existing_tax_without_going_negative(self):\n        self.assertIn('Math.abs(whtTotal) < 1e-9', APP)\n        self.assertIn('const adjustedTax = parseNum(d.taxWithheld) + share;', APP)\n        self.assertIn('Math.max(0, Math.min(parseNum(d.grossAmount), adjustedTax))', APP)\n\n    def test_previous_idempotence_fix_remains(self):\n        self.assertIn('let events = (bd.events || []).map(e => (e && typeof e === "object" ? { ...e } : e)).sort(', APP)\n        self.assertIn('e.taxEUR = wht;', APP)\n\n\nif __name__ == "__main__":\n    unittest.main(verbosity=2)\n''', encoding='utf-8')
          PY
          rm .github/workflows/apply-xtb-wht-signed-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-broker-parsers.js app-broker-normalization.js app.js tests/test_xtb_wht_signed_corrections.py .github/workflows/apply-xtb-wht-signed-fix.yml
          git commit -m "Preserve signed XTB withholding corrections"
          git push origin HEAD:fix/xtb-wht-signed-corrections-20260907
