name: Rebuild market startup payloads

# Fast path for presentation/startup data changes that do not require a full
# Yahoo/SEC/ESEF enrichment pass. Uses the already validated data/stocks.json
# as source, rebuilds compact startup payloads + dossier shards, validates
# payload budgets/contracts, then publishes only generated artifacts.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-market-startup.yml'
      - '.github/triggers/market-startup-rebuild.txt'
      - 'scripts/build_market_shards.py'
      - 'tests/test_market_index_budget.py'
      - 'tests/test_weekly_rotation_relative_destinations.py'
      - 'scripts/rotation_coverage_audit.py'
      - 'tests/test_rotation_coverage_audit.py'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: market-data-publish
  cancel-in-progress: false

jobs:
  rebuild-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Validate startup builder
        run: |
          python -m py_compile scripts/build_market_shards.py scripts/rotation_coverage_audit.py
          python -m pytest -q tests/test_market_index_budget.py tests/test_weekly_rotation_relative_destinations.py tests/test_rotation_coverage_audit.py

      - name: Build lightweight market index and dossier shards
        working-directory: scripts
        run: python build_market_shards.py

      - name: Audit weekly rotation coverage
        working-directory: scripts
        run: python rotation_coverage_audit.py

      - name: Validate generated payload budgets and rotation contracts
        run: |
          python -m pytest -q tests/test_market_index_budget.py tests/test_weekly_rotation_relative_destinations.py tests/test_rotation_coverage_audit.py

      - name: Check automated main publish window
        id: publish_window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/defer_main_publish_if_code_pr.py

      - name: Publish startup payloads
        if: steps.publish_window.outputs.defer != 'true'
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/stocks-index.json \
            data/stocks-startup.json \
            data/stocks-scanner.json \
            data/portfolio-sectors.json \
            data/dossiers-manifest.json \
            data/dossiers/ \
            data/fund-aum-history.json \
            data/rotation_coverage_audit.json
          if git diff --cached --quiet; then
            echo "Sem alterações nos payloads de startup."
          else
            git commit -m "Actualização rápida dos payloads de mercado ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash scripts/publish_with_retry.sh origin main
          fi
