name: Fix European ticker normalization v4.19

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/triggers/fix-europe-tickers-v419.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch universe ticker normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/universe.py')
          s=p.read_text()
          old='''    out=[]\n    for url, cols, suffix in specs:\n        raw=_wikipedia_table(url, match="Ticker", symbol_col_candidates=cols)\n        out.extend(f"{x.split()[0].replace('.', '-').strip()}{suffix}" for x in raw if x)\n        time.sleep(0.4)\n    return sorted(set(out))\n'''
          new='''    out=[]\n    exchange_tokens={\n        ".DE": {"DE"}, ".PA": {"PA"}, ".AS": {"AS"},\n        ".MC": {"MC"}, ".MI": {"MI"}, ".SW": {"SW"},\n    }\n    for url, cols, suffix in specs:\n        raw=_wikipedia_table(url, match="Ticker", symbol_col_candidates=cols)\n        for x in raw:\n            if not x:\n                continue\n            symbol=str(x).split()[0].strip().upper()\n            # Wikipedia index tables increasingly expose market-qualified forms\n            # such as ADS-DE, ACA-PA or A2A-MI. Yahoo expects ADS.DE, ACA.PA,\n            # A2A.MI. Strip only a trailing exchange token that matches the\n            # national table, preserving legitimate hyphens inside tickers.\n            for token in exchange_tokens.get(suffix, set()):\n                if symbol.endswith('-'+token):\n                    symbol=symbol[:-(len(token)+1)]\n                    break\n                if symbol.endswith('.'+token):\n                    symbol=symbol[:-(len(token)+1)]\n                    break\n            # If the source already supplied the exact Yahoo suffix, do not\n            # append it a second time. Dots elsewhere remain Yahoo-class\n            # separators and are normalised to hyphens only for the base code.\n            if symbol.endswith(suffix.upper()):\n                yahoo=symbol\n            else:\n                yahoo=f"{symbol.replace('.', '-')}{suffix}"\n            out.append(yahoo)\n        time.sleep(0.4)\n    return sorted(set(out))\n'''
          if old not in s:
              raise SystemExit('Expected europe_constituents anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate normalization
        run: |
          python -m py_compile scripts/universe.py
          python - <<'PY'
          # Static regression checks for the exact malformed pattern found in
          # coverage_audit.json. The repaired source must no longer construct
          # exchange-token-plus-suffix duplicates.
          from pathlib import Path
          s=Path('scripts/universe.py').read_text()
          assert "exchange_tokens" in s
          assert "symbol.endswith('-'+token)" in s
          assert 'out.extend(f"{x.split()[0].replace' not in s
          PY
      - name: Commit repair
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/universe.py
          git commit -m "fix: normalize European Wikipedia tickers for Yahoo"
          git push
