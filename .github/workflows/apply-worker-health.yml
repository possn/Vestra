name: Apply Worker Health Patch

on:
  push:
    branches:
      - audit/cloudflare-worker-20260830
    paths:
      - 'scripts/add_worker_health.py'
      - '.github/workflows/apply-worker-health.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/cloudflare-worker-20260830

      - name: Apply guarded patch
        run: python scripts/add_worker_health.py

      - name: Syntax check
        run: node --check worker.js

      - name: Commit patched Worker
        run: |
          if git diff --quiet -- worker.js; then
            echo "No Worker changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git commit -m "infra: add Worker health and build metadata"
          git push origin HEAD:audit/cloudflare-worker-20260830
