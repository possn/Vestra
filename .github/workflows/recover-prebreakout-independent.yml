name: Recover prebreakout from independent dashboard workflow

# Two independent event sources can recover a missed prebreakout cron.
# Neither depends on a scanner run existing; the immutable-slot gate prevents
# duplicate scans when both sources complete in the same slot.
on:
  workflow_run:
    workflows: ["Update dashboard news", "Update macro events"]
    types: [completed]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-prebreakout-independent.yml'
      - 'scripts/check_prebreakout_scan_due.py'
      - 'scripts/refresh_prebreakout_scanner.py'

permissions:
  contents: read
  actions: write

concurrency:
  group: recover-prebreakout-independent
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify scanner is due against immutable published archives
        id: scan_due
        run: python scripts/check_prebreakout_scan_due.py
      - name: Dispatch canonical scanner when due
        if: steps.scan_due.outputs.scan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-prebreakout-scanner.yml --ref main
