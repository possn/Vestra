name: Apply Vestra v5.2 assisted rebalancer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v5.2-assisted-rebalancer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v5.2-assisted-rebalancer
          fetch-depth: 0
      - name: Apply and validate v5.2
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v52_rebalancer.py
          rm -f scripts/apply_v52_rebalancer.py tmp/v52-marker.txt tmp/v52-marker2.txt
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- market.js market.css README.md sw.js
          git add -u scripts/apply_v52_rebalancer.py tmp/v52-marker.txt tmp/v52-marker2.txt
          if git diff --cached --quiet; then
            echo "v5.2 already applied"
          else
            git commit -m "feat: Vestra v5.2 assisted rebalancer"
            git push origin HEAD:chatgpt/v5.2-assisted-rebalancer
          fi
