name: Recover stale smallcap publication
on:
  schedule:
    # Independent fallback when the primary health-check cron itself is skipped.
    - cron: '10 3,9,15,21 * * *'
  workflow_run:
    workflows: ["Smallcap published-data health"]
    types: [completed]
    branches: [main]
permissions:
  actions: write
  contents: read
concurrency:
  group: recover-stale-smallcap-publication
  cancel-in-progress: false
jobs:
  dispatch-recovery:
    if: ${{ github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule'
        with:
          python-version: '3.11'
      - name: Independently check main publication age on fallback schedule
        if: github.event_name == 'schedule'
        id: freshness
        shell: bash
        run: |
          if python scripts/check_smallcap_publication.py --max-age-hours 8; then
            echo 'stale=false' >> "$GITHUB_OUTPUT"
            echo 'Main publication is current; no recovery needed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo 'Main publication failed age/integrity check; evaluate recovery.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Dispatch bounded collector only if it is not running already
        if: github.event_name == 'workflow_run' || steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow smallcap-prebreakout-research.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          if [ "$active" -gt 0 ]; then
            echo "Collector already queued/running: recovery not dispatched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run smallcap-prebreakout-research.yml --repo "$GITHUB_REPOSITORY" --ref main -f budget=30
          echo "Independent check detected stale/invalid published data; dispatched bounded 30-ticker collector." >> "$GITHUB_STEP_SUMMARY"
          echo "This is a recovery attempt, not verified financial data or a successful publication." >> "$GITHUB_STEP_SUMMARY"
