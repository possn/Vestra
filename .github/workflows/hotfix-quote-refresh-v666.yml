name: Vestra v6.6.6 quote refresh hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-quote-refresh-v666.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch quote validation and iOS modal scrolling
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')

          old_currency = '''  const assetCcy = String(asset.priceCurrency || asset.currency || "").trim().toUpperCase();
  const quoteCcy = String(q.currency || "").trim().toUpperCase();
  const explicit = hasStrongQuoteIdentitySafe(asset);
  // Currency mismatch is a strong collision signal for explicit broker instruments.
  if (assetCcy && quoteCcy && assetCcy !== quoteCcy && !(assetCcy === "GBX" && quoteCcy === "GBP")) {
    if (!String(rawTicker || "").includes("=") && !String(rawTicker || "").endsWith("-USD")) {
      return { ok:false, reason:`Cotação suspeita: moeda ${quoteCcy} não coincide com ${assetCcy}` };
    }
  }
'''
          new_currency = '''  const quoteCcy = String(q.currency || "").trim().toUpperCase();
  const explicit = hasStrongQuoteIdentitySafe(asset);
  // v6.6.6: do NOT reject a quote just because its trading currency differs from
  // asset.currency/priceCurrency. Broker imports often store the portfolio/settlement
  // currency (EUR), while the same security is legitimately quoted by Yahoo in USD
  // (e.g. US equities and USD LSE ETF listings such as ISAG.L/BTEC.L).
  // Identity safety is enforced by candidate/ISIN/ticker validation; FX conversion is
  // handled below before any portfolio value is written.
'''
          if old_currency not in text:
              raise SystemExit('quote currency validation block not found')
          text = text.replace(old_currency, new_currency, 1)

          old_ratio = '''  if (ref > 0) {
    const ratio = priceEur / ref;
    if (ratio > 5 || ratio < 0.2) {
      return { ok:false, reason:`Cotação suspeita rejeitada (${ratio.toFixed(1)}× face ao último preço fiável)` };
    }
  }
'''
          new_ratio = '''  if (ref > 0) {
    const ratio = priceEur / ref;
    if (ratio > 5 || ratio < 0.2) {
      // v6.6.6: a strong structural identity (explicit ticker/ISIN/Yahoo mapping)
      // is more trustworthy than a stale local baseline. This allows recovery from a
      // previously corrupted cached price (e.g. QDVE.DE) instead of permanently
      // rejecting the now-correct Yahoo quote. Weak/guessed identities keep the guard.
      if (!explicit) {
        return { ok:false, reason:`Cotação suspeita rejeitada (${ratio.toFixed(1)}× face ao último preço fiável)` };
      }
      console.warn('[Quote recovery] replacing stale baseline for', asset.name || rawTicker, 'ratio=', ratio);
    }
  }
'''
          if old_ratio not in text:
              raise SystemExit('quote ratio validation block not found')
          text = text.replace(old_ratio, new_ratio, 1)
          app.write_text(text, encoding='utf-8')

          css = Path('styles.css')
          s = css.read_text(encoding='utf-8')
          old_main = '''.main {
  padding: 14px 12px calc(var(--bottomnav-h) + var(--passivebar-h) + env(safe-area-inset-bottom, 0px) + 40px);
  max-width: 680px;
  margin: 0 auto;
  contain: layout style;
}'''
          new_main = '''.main {
  padding: 14px 12px calc(var(--bottomnav-h) + var(--passivebar-h) + env(safe-area-inset-bottom, 0px) + 40px);
  max-width: 680px;
  margin: 0 auto;
  /* v6.6.6: layout containment traps position:fixed descendants on iOS Safari.
     Quote-error and other long modals live inside .main, so they could open but
     become effectively frozen/unscrollable. Keep style containment out here. */
  contain: none;
}'''
          if old_main not in s:
              raise SystemExit('.main containment block not found')
          s = s.replace(old_main, new_main, 1)
          modal_marker = '''.modal__box, .modal__panel {
  position: fixed; left: 50%; transform: translateX(-50%);'''
          modal_repl = '''.modal__box, .modal__panel {
  position: fixed; left: 50%; transform: translateX(-50%);
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-y;'''
          if modal_marker not in s:
              raise SystemExit('modal box marker not found')
          s = s.replace(modal_marker, modal_repl, 1)
          css.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          h = h.replace('styles.css?v=20260821v7', 'styles.css?v=20260823v8')
          h = h.replace('app.js?v=20260821v8', 'app.js?v=20260823v9')
          idx.write_text(h, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          if 'vestra-cache-v68' not in w:
              raise SystemExit('expected service-worker cache v68 not found')
          w = w.replace('vestra-cache-v68', 'vestra-cache-v69', 1)
          sw.write_text(w, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          note = '''## Vestra v6.6.6 — Quote Recovery & iOS Error Modal\n\n- Corrigidos falsos erros de moeda: a moeda de negociação Yahoo pode diferir da moeda de carteira/importação sem significar ticker errado.\n- Cotações com identidade forte conseguem recuperar de um último preço local corrompido em vez de ficarem rejeitadas para sempre.\n- Corrigido o modal de erros de cotação que podia ficar bloqueado/sem scroll no iPhone devido a CSS containment.\n- Cache PWA atualizado para v69.\n\n'''
          if not r.startswith('## Vestra v6.6.6'):
              readme.write_text(note + r, encoding='utf-8')

      - name: Validate hotfix
        shell: bash
        run: |
          node --check app.js
          grep -q "do NOT reject a quote just because" app.js
          grep -q "if (!explicit)" app.js
          grep -q "contain: none" styles.css
          grep -q "-webkit-overflow-scrolling: touch" styles.css
          grep -q "vestra-cache-v69" sw.js
          grep -q "app.js?v=20260823v9" index.html

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/hotfix-quote-refresh-v666.yml
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add app.js styles.css index.html sw.js README.md .github/workflows/hotfix-quote-refresh-v666.yml
          git commit -m "fix: Vestra v6.6.6 quote recovery and iOS error modal"
          git push origin main
