name: Apply score explanation detail

on:
  push:
    branches: [score-explanation-detail-20260830]
    paths:
      - 'scripts/patch_score_explanation_detail.py'
      - '.github/workflows/apply-score-explanation-detail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: score-explanation-detail-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/patch_score_explanation_detail.py
      - name: Validate focused contract
        run: |
          node --check market.js
          python -m unittest tests.test_market_score_explanation -v
      - name: Commit patch
        run: |
          git config user.name "vestra-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market.js tests/test_market_score_explanation.py
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "ui: explain score pillars with raw metrics"
            git push
          fi
