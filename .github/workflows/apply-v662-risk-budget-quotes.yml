name: Apply Vestra v6.6.2 risk budget and quotes
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'chatgpt/v6.6.2-risk-budget-quote-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6.6.2-risk-budget-quote-refresh
          fetch-depth: 0
      - name: Apply and validate v6.6.2
        run: |
          set -euo pipefail
          python scripts/apply_v662_risk_budget_quote_refresh.py
          rm -f scripts/apply_v662_risk_budget_quote_refresh.py
          python -m py_compile scripts/*.py
          node --check app.js
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add README.md app.js market.js market.css sw.js
          git add -u scripts/apply_v662_risk_budget_quote_refresh.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: Vestra v6.6.2 risk budget clarity and quote refresh"
            git push origin HEAD:chatgpt/v6.6.2-risk-budget-quote-refresh
          fi
