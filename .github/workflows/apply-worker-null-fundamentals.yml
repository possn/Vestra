name: Apply Worker null fundamentals patch

on:
  push:
    branches:
      - fix/worker-null-fundamentals-20260830
    paths:
      - '.github/workflows/apply-worker-null-fundamentals.yml'
      - 'scripts/patch_worker_null_fundamentals.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/worker-null-fundamentals-20260830
      - name: Apply guarded patch
        run: python scripts/patch_worker_null_fundamentals.py
      - name: Validate focused contract
        run: |
          node --check worker.js
          python -m unittest tests.test_worker_missing_numeric_semantics -v
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker.js tests/test_worker_missing_numeric_semantics.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve missing Worker fundamentals as null"
          git push origin HEAD:fix/worker-null-fundamentals-20260830
