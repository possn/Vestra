name: Apply market congress refactor

on:
  push:
    branches:
      - refactor/market-congress-live-20260831

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/market-congress-live-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded patch
        run: python scripts/apply_market_congress_refactor.py
      - name: Validate extracted runtime
        run: |
          node --check market-congress-live.js
          node --check market.js
          node tests/runtime_market_congress_live_contract.js
      - name: Commit patched runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: wire market congress live module"
          git push origin HEAD:refactor/market-congress-live-20260831
