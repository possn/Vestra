name: Small Caps pre-breakout research
on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Maximum independent OHLCV requests'
        required: false
        default: '40'
  schedule:
    # Weekend collection covers still-unobserved Friday-close histories.
    # The scanner excludes unfinished bars and still enforces <=7-day freshness;
    # this does not invent trading sessions; 40 requested series per 4h slot
    # are capacity limits, not counted as successfully observed histories.
    - cron: '23 0,4,8,12,16,20 * * *'
  # GitHub's scheduled events may be delayed or skipped. Reuse independent
  # successful main-branch market workflows as redundant collection clocks.
  workflow_run:
    workflows: ["Update market data", "Recover missing canonical market publication"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'research/prebreakout/smallcap_ohlcv_collector.py'
      - 'scripts/check_smallcap_publication.py'
      - '.github/workflows/smallcap-prebreakout-research.yml'
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: smallcap-ohlcv-research
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Check actual collection freshness to avoid duplicate provider requests
        id: collection_due
        env:
          COLLECTION_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime,json,os
          from pathlib import Path
          due=True
          if os.environ.get("COLLECTION_EVENT") not in {"push","workflow_dispatch"}:
              try:
                  report=json.loads(Path("data/breakout-lab-smallcap-ohlcv-research.json").read_text())
                  stamp=datetime.datetime.fromisoformat(report["generated_at"].replace("Z","+00:00"))
                  now=datetime.datetime.now(datetime.timezone.utc)
                  if stamp.tzinfo is not None and stamp<=now:
                      due=now-stamp>=datetime.timedelta(hours=3,minutes=30)
              except (OSError,ValueError,KeyError,TypeError):
                  due=True
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"collect={str(due).lower()}\n")
          print("Independent OHLCV collection due:",due)
          PY
      - uses: actions/setup-python@v5
        if: steps.collection_due.outputs.collect == 'true'
        with:
          python-version: '3.11'
      - if: steps.collection_due.outputs.collect == 'true'
        run: python -m pip install --disable-pip-version-check 'yfinance>=0.2.54,<1'
      - name: Snapshot previously published research before recomputing
        if: steps.collection_due.outputs.collect == 'true'
        run: |
          git show HEAD:data/breakout-lab-smallcap-ohlcv-research.json > /tmp/vestra-smallcap-previous.json || printf '{}' > /tmp/vestra-smallcap-previous.json
      - name: Collect independent 100m-2b USD pre-breakout evidence
        if: steps.collection_due.outputs.collect == 'true'
        env:
          BUDGET: ${{ github.event.inputs.budget || '40' }}
        run: |
          set -euo pipefail
          SLOT=$(python -c 'import datetime; n=datetime.datetime.now(datetime.timezone.utc);print(n.toordinal()*6+n.hour//4)')
          python research/prebreakout/smallcap_ohlcv_collector.py --slot "$SLOT" --budget "$BUDGET"
          python -m unittest discover -s tests -p 'test_smallcap_ohlcv_collector.py'
          python -m unittest discover -s tests -p 'test_smallcap_publish_window.py'
      - name: Record observed research evidence
        if: steps.collection_due.outputs.collect == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path
          report = json.loads(Path("data/breakout-lab-smallcap-ohlcv-research.json").read_text())
          prior = json.loads(Path("/tmp/vestra-smallcap-previous.json").read_text())
          counts = Counter(row.get("status", "unknown") for row in report.get("observations", []))
          lines = [
              "### Smallcap OHLCV — collected, not yet published",
              f"- Collected at (UTC): `{report.get('generated_at')}`",
              f"- Previous published at (UTC): `{prior.get('generated_at', 'unknown')}`",
              f"- Current universe 100m-2b USD: {report.get('universe_100m_2b_count')}",
              f"- Subset 100m-500m USD: {report.get('universe_100m_500m_count')}",
              f"- Fresh provider attempts: {report.get('provider_tickers_attempted')}",
              f"- Fresh provider attempt outcomes: {json.dumps(report.get('provider_attempt_status_counts', {}), sort_keys=True)}",
              f"- Fresh provider error classes: {json.dumps(report.get('provider_error_type_counts', {}), sort_keys=True)}",
              f"- Rolling evaluable observations: {report.get('evaluable_ohlcv')}",
              f"- Not observed: {report.get('not_observed')}",
              f"- Observed status counts: {json.dumps(dict(sorted(counts.items())), sort_keys=True)}",
              "- These are observed OHLCV counts, not pre-breakout success rates.",
          ]
          before = prior.get("independent_geometry_audit") or {}
          after = report.get("independent_geometry_audit") or {}
          lines.append("#### Quantitative VCP backfill — observed before / after")
          for key, label in (
              ("liquid_evaluable_rows", "Liquid evaluable"),
              ("geometry_diagnosed_rows", "Geometry diagnosed"),
              ("continuous_geometry_measurement_rows", "Complete quantitative measurements"),
              ("legacy_boolean_only_geometry_rows", "Legacy boolean-only"),
              ("both_pass", "Both VCP gates pass"),
          ):
              old, new = before.get(key), after.get(key)
              if type(old) is int and type(new) is int:
                  lines.append(f"- {label}: {old} → {new} ({new-old:+d})")
              else:
                  lines.append(f"- {label}: unavailable (not inferred)")
          lines += [
              "- This compares two actual snapshots, not planned coverage or a success probability.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      # Four-hour collection slots: protect aligned code PRs briefly, but never
      # defer publication for more than two four-hour slots.
      - name: Check automated main publish window
        if: steps.collection_due.outputs.collect == 'true'
        id: publish_window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VESTRA_SMALLCAP_PREVIOUS: /tmp/vestra-smallcap-previous.json
        run: python scripts/defer_main_publish_if_code_pr.py --smallcap-max-staleness-hours 8
      - name: Publish observed research, never synthetic signals
        if: steps.collection_due.outputs.collect == 'true' && steps.publish_window.outputs.defer != 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/breakout-lab-smallcap-ohlcv-research.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh independent small-cap pre-breakout observations'
            bash scripts/publish_with_retry.sh origin main
            # A successful script exit must mean that the generated commit
            # actually reached main, not merely that collection succeeded.
            git fetch origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo 'Smallcap publish not verified on origin/main' >&2
              exit 1
            fi
            echo "### Smallcap publication: verified on main" >> "$GITHUB_STEP_SUMMARY"
            echo "- Commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Smallcap publication: no file changes" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Explain deliberately deferred publication
        if: steps.collection_due.outputs.collect == 'true' && steps.publish_window.outputs.defer == 'true'
        run: |
          echo "### Smallcap publication: deferred due to aligned code PR" >> "$GITHUB_STEP_SUMMARY"
          echo "Collection completed but this snapshot was NOT published to main." >> "$GITHUB_STEP_SUMMARY"
