name: Small Caps pre-breakout research
on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Maximum independent OHLCV requests'
        required: false
        default: '25'
  schedule:
    - cron: '23 0,6,12,18 * * 1-5'
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: smallcap-ohlcv-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'yfinance>=0.2.54,<1'
      - name: Snapshot previously published research before recomputing
        run: |
          git show HEAD:data/breakout-lab-smallcap-ohlcv-research.json > /tmp/vestra-smallcap-previous.json || printf '{}' > /tmp/vestra-smallcap-previous.json
      - name: Collect independent 100m-500m USD pre-breakout evidence
        env:
          BUDGET: ${{ github.event.inputs.budget || '25' }}
        run: |
          set -euo pipefail
          SLOT=$(python -c 'import datetime; n=datetime.datetime.now(datetime.timezone.utc);print(n.toordinal()*4+n.hour//6)')
          python research/prebreakout/smallcap_ohlcv_collector.py --slot "$SLOT" --budget "$BUDGET"
          python -m unittest discover -s tests -p 'test_smallcap_ohlcv_collector.py'
          python -m unittest discover -s tests -p 'test_smallcap_publish_window.py'
      - name: Record observed research evidence
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path
          report = json.loads(Path("data/breakout-lab-smallcap-ohlcv-research.json").read_text())
          prior = json.loads(Path("/tmp/vestra-smallcap-previous.json").read_text())
          counts = Counter(row.get("status", "unknown") for row in report.get("observations", []))
          lines = [
              "### Smallcap OHLCV — collected, not yet published",
              f"- Collected at (UTC): `{report.get('generated_at')}`",
              f"- Previous published at (UTC): `{prior.get('generated_at', 'unknown')}`",
              f"- Current universe: {report.get('universe_100m_500m_count')}",
              f"- Fresh provider attempts: {report.get('provider_tickers_attempted')}",
              f"- Rolling evaluable observations: {report.get('evaluable_ohlcv')}",
              f"- Not observed: {report.get('not_observed')}",
              f"- Observed status counts: {json.dumps(dict(sorted(counts.items())), sort_keys=True)}",
              "- These are observed OHLCV counts, not pre-breakout success rates.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      # Six-hour collection slots: protect aligned code PRs briefly, but never
      # defer publication for more than roughly two six-hour slots.
      - name: Check automated main publish window
        id: publish_window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VESTRA_SMALLCAP_PREVIOUS: /tmp/vestra-smallcap-previous.json
        run: python scripts/defer_main_publish_if_code_pr.py --smallcap-max-staleness-hours 8
      - name: Publish observed research, never synthetic signals
        if: steps.publish_window.outputs.defer != 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/breakout-lab-smallcap-ohlcv-research.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh independent small-cap pre-breakout observations'
            bash scripts/publish_with_retry.sh origin main
            # A successful script exit must mean that the generated commit
            # actually reached main, not merely that collection succeeded.
            git fetch origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo 'Smallcap publish not verified on origin/main' >&2
              exit 1
            fi
            echo "### Smallcap publication: verified on main" >> "$GITHUB_STEP_SUMMARY"
            echo "- Commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Smallcap publication: no file changes" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Explain deliberately deferred publication
        if: steps.publish_window.outputs.defer == 'true'
        run: |
          echo "### Smallcap publication: deferred due to aligned code PR" >> "$GITHUB_STEP_SUMMARY"
          echo "Collection completed but this snapshot was NOT published to main." >> "$GITHUB_STEP_SUMMARY"
