name: Apply suspended Yahoo dividend repair

on:
  push:
    branches:
      - fix/clear-suspended-yahoo-dividend-20260830
    paths:
      - '.github/workflows/apply-suspended-yahoo-dividend-repair.yml'
      - 'scripts/patch_clear_suspended_yahoo_dividend.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clear-suspended-yahoo-dividend-20260830
      - name: Apply guarded patch
        run: python scripts/patch_clear_suspended_yahoo_dividend.py
      - name: Validate focused contract
        run: |
          node --check app.js
          python -m unittest tests.test_yahoo_dividend_quote_semantics -v
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js tests/test_yahoo_dividend_quote_semantics.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: clear suspended Yahoo dividend metadata"
          git push origin HEAD:fix/clear-suspended-yahoo-dividend-20260830
