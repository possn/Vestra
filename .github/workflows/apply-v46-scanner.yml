name: Apply Vestra v4.6 intelligent scanner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v4.6-intelligent-scanner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v4.6-intelligent-scanner
          fetch-depth: 0
      - name: Apply and validate v4.6
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v46_scanner.py
          rm -f scripts/apply_v46_scanner.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- scripts/scanner.py scripts/run.py index.html market.js README.md sw.js
          git add -u scripts/apply_v46_scanner.py
          if git diff --cached --quiet; then
            echo "v4.6 already applied"
          else
            git commit -m "feat: Vestra v4.6 intelligent scanner"
            git push origin HEAD:chatgpt/v4.6-intelligent-scanner
          fi
