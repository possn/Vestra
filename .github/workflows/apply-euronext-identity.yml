name: Apply Euronext identity integration

on:
  push:
    branches:
      - feat/euronext-official-identity-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/euronext-official-identity-20260907
      - name: Apply patch
        run: python scripts/patch_euronext_identity.py
      - name: Validate targeted files
        run: |
          python -m py_compile scripts/euronext_identity.py scripts/esef_enrich_v416.py
          python -m unittest tests.test_euronext_identity
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/esef_enrich_v416.py
          git diff --cached --quiet && exit 0
          git commit -m "Use official Euronext identity fallback for ESEF"
          git push
