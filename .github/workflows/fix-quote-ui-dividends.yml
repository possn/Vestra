name: Fix quote UI and broker dividends
on:
  push:
    paths:
      - 'scripts/fix_quote_ui_and_dividends.py'
      - '.github/workflows/fix-quote-ui-dividends.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded repair
        run: python scripts/fix_quote_ui_and_dividends.py
      - name: Validate JavaScript syntax
        run: |
          node --check app-asset-identity.js
          node --check app-broker-parsing-core.js
          node --check app.js
      - name: Run regression suite
        run: python -m unittest discover -v -s tests -p 'test_*.py'
      - name: Validate diff
        run: git diff --check
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'vestra-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app-asset-identity.js app-broker-parsing-core.js app.js styles.css index.html sw.js tests/
          git commit -m 'fix: reconcile broker dividends and quote identities'
          git pull --rebase origin main
          git push
