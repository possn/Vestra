name: Biotech exact-input audit (nonpublishing)
on:
  push:
    branches:
      - audit/biotech-score-input-parity-20261017
    paths:
      - scripts/run.py
      - scripts/audit_biotech_live_input_parity.py
      - tests/test_biotech_live_input_parity.py
      - .github/workflows/biotech-input-parity-audit.yml
permissions:
  contents: read
concurrency:
  group: isolated-biotech-parity
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Deterministic exact-input and shadow checks
        run: python -m unittest discover -s tests -p 'test_biotech_live_input_parity.py'
      - name: Pre-score isolated cohort check
        working-directory: scripts
        env:
          VESTRA_AUDIT_BIOTECH_INPUT_PARITY: "1"
          VESTRA_AUDIT_BIOTECH_STOP_AFTER_SCORE: "1"
          FINSCANNER_FETCH_WORKERS: "2"
          FINSCANNER_FUNDAMENTALS_PORTFOLIO_REFRESH: "140"
          FINSCANNER_FUNDAMENTALS_NONPRIORITY_REFRESH: "180"
          FINSCANNER_ESEF_NONPRIORITY_REFRESH: "60"
          FINSCANNER_GAP_REFRESH: "80"
          FINSCANNER_QUARTERLY_GAP_REFRESH: "80"
          FINSCANNER_ANALYST_PRIORITY_REFRESH: "100"
          FINSCANNER_ANALYST_NONPRIORITY_REFRESH: "80"
          FINSCANNER_ANALYST_ENDPOINT_CONCURRENCY: "2"
          FINSCANNER_CAPITAL_RISK_PRIORITY_REFRESH: "80"
          FINSCANNER_CAPITAL_RISK_NONPRIORITY_REFRESH: "30"
        run: |
          set -o pipefail
          python run_market_pipeline.py 2>&1 | tee ../biotech-audit.log
      - name: Publish same-run diagnostics to workflow summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          lines = Path("biotech-audit.log").read_text(encoding="utf-8", errors="replace").splitlines() if Path("biotech-audit.log").exists() else []
          result = {}
          for line in lines:
              for name in ("BIOTECH_INPUT_PARITY", "BIOTECH_SAME_RUN_SHADOW"):
                  match = re.search(re.escape(name) + r"\s+(\{.*\})", line)
                  if match:
                      try:
                          result[name] = json.loads(match.group(1))
                      except json.JSONDecodeError:
                          pass
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Biotech exact-input, nonpublishing audit\n\n")
              if not result:
                  out.write("No completed same-run diagnostics found; see job logs.\n")
              for name, payload in result.items():
                  out.write(f"### {name}\n\n")
                  out.write("```json\n" + json.dumps(payload, ensure_ascii=False, indent=2) + "\n```\n")
          PY
      - name: Require measured live Biotech evidence
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          text = Path("biotech-audit.log").read_text(encoding="utf-8", errors="replace")
          def find(name):
              matches = re.findall(re.escape(name) + r"\s+(\{[^\n]*\})", text)
              if not matches:
                  raise SystemExit(f"Missing required {name} result in the isolated run")
              return json.loads(matches[-1])
          parity = find("BIOTECH_INPUT_PARITY")
          shadow = find("BIOTECH_SAME_RUN_SHADOW")
          count = parity.get("comparable_rows") or 0
          if count < 20 or parity.get("outside_rounding_tolerance") != 0:
              raise SystemExit(f"Biotech parity failed or undersampled: {parity}")
          if shadow.get("same_run_biotech_rows") != parity.get("biotech_input_rows"):
              raise SystemExit("Shadow and parity measured different Biotech cohorts")
          if not shadow.get("native_quality_parity_passed"):
              raise SystemExit("Native operating-quality reconstruction did not pass")
          if any(not row.get("parity_gate_passed") for row in shadow.get("candidates", [])):
              raise SystemExit("Biotech ablation contains an unmatched candidate")
          if len(shadow.get("candidates", [])) != 6:
              raise SystemExit("Missing candidate weights in same-run ablation")
          print(f"Measured Biotech evidence verified: {count} peers")
          PY
      - name: Assert canonical market outputs unchanged and no commits
        run: |
          # The pipeline writes pipeline_log.txt during normal operation; a local
          # log update is not publication and must not falsely fail this guard.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only -- data/ | grep -E '^data/(stocks|stocks-index|stocks-shards|coverage_guard)' || true)"
          if [ -n "$changed" ]; then
            echo "Unexpected canonical market output modifications:"
            echo "$changed"
            exit 1
          fi
          echo "Canonical market outputs unchanged; no repository commit or publication step executed"
