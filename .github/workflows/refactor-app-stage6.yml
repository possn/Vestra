name: Refactor app stage 6

on:
  push:
    paths:
      - 'scripts/refactor_app_stage6.py'
      - '.github/workflows/refactor-app-stage6.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded normalization extraction
        run: python scripts/refactor_app_stage6.py
      - name: Validate JavaScript syntax
        run: |
          node --check app-utils.js
          node --check app.js
      - name: Validate utility migration and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('app.js').read_text()
          u=Path('app-utils.js').read_text()
          assert 'function normalizeClassName(s)' not in a
          assert 'function normalizeYieldType(s)' not in a
          assert 'function normalizeClassName(s)' in u
          assert 'function normalizeYieldType(s)' in u
          assert 'normalizeClassName,normalizeYieldType' in u
          assert 'normalizeClassName,' in a and 'normalizeYieldType,' in a
          PY
          git diff --check
      - name: Commit normalization utilities
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js app-utils.js
          git commit -m 'refactor: move asset normalization helpers into shared utils'
          git pull --rebase origin main
          git push
