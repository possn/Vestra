name: Patch AI brief native index

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_ai_brief_native_index.py'
      - '.github/workflows/patch-ai-brief-native-index.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: patch-ai-brief-native-index
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/patch_ai_brief_native_index.py
      - name: Validate AI brief invariants
        run: |
          node --check vestra-ai-brief-v459.js
          python - <<'PY'
          from pathlib import Path
          s=Path('vestra-ai-brief-v459.js').read_text()
          assert 'stocks-index.json' in s
          assert s.index('stocks-index.json') < s.index('stocks.json')
          for token in ('function evidence(s)', 'function payload(s)', 'function install()', 'data-ai459-run'):
              assert token in s
          PY
          git diff --check
      - name: Commit native index loading
        run: |
          git config user.name 'vestra-refactor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add vestra-ai-brief-v459.js
          if git diff --cached --quiet; then
            echo 'AI brief already index-native.'
          else
            git commit -m 'perf: make AI brief market data index-native'
            git pull --rebase origin main
            git push
          fi
