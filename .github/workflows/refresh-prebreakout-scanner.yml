name: Refresh prebreakout scanner

on:
  schedule:
    # Best-effort independent triggers at off-peak minutes: GitHub can delay/drop cron.
    # Multiple triggers within each UTC slot give missed morning slots extra chances.
    # check_prebreakout_scan_due.py still permits only one immutable archive per slot.
    - cron: '17,47 2-4,8-10,14-16,20-22 * * 1-5'
    - cron: '17 5,11,17,23 * * 1-5'
    # Friday US daily candle is guaranteed complete only on Saturday UTC.
    - cron: '17,47 2-4,8-10 * * 6'
    - cron: '17 5,11 * * 6'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_prebreakout_scanner.py'
      - '.github/workflows/refresh-prebreakout-scanner.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: refresh-prebreakout-scanner
  # Catch-up schedules must not cancel an in-flight scan/publish.
  # Serialized runs re-check the immutable slot archive before downloading.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install technical history dependencies
        run: pip install 'yfinance>=0.2.65' pandas
      - name: Validate scanner
        run: |
          python -m py_compile scripts/refresh_prebreakout_scanner.py
          python tests/test_refresh_prebreakout_scanner.py
          python tests/test_prebreakout_scanner_concurrency.py
          python tests/test_check_prebreakout_scan_due.py
          python tests/test_audit_prebreakout_slots.py
          python tests/test_prebreakout_publish_grace.py
          python tests/test_archive_prebreakout_scan.py
          python tests/test_build_prebreakout_observations.py
          python tests/test_build_prebreakout_transitions.py
          python tests/test_check_prebreakout_transitions.py
          python tests/test_check_prebreakout_publication.py
      - name: Report missing closed scanner slots (diagnostic only)
        run: python scripts/audit_prebreakout_slots.py
      - name: Determine whether current UTC slot still needs a real scan
        id: scan_due
        run: python scripts/check_prebreakout_scan_due.py
      - name: Scan bounded liquid universe
        if: steps.scan_due.outputs.scan == 'true'
        run: python scripts/refresh_prebreakout_scanner.py
      - name: Check automated main publish window
        if: steps.scan_due.outputs.scan == 'true'
        id: publish_window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/defer_main_publish_if_code_pr.py --scanner-grace-minutes 85
      - name: Publish technical signals
        if: steps.scan_due.outputs.scan == 'true' && steps.publish_window.outputs.defer != 'true'
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          python scripts/archive_prebreakout_scan.py
          python scripts/build_prebreakout_observations.py
          python scripts/build_prebreakout_transitions.py
          python scripts/check_prebreakout_transitions.py
          python scripts/check_prebreakout_publication.py
          git add data/prebreakout-signals.json data/prebreakout-history/ data/prebreakout-observations.json data/prebreakout-transitions.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualização de setups pré-breakout verificados"
            bash scripts/publish_with_retry.sh origin main
          fi
      - name: Audit archive publication after scanner run
        if: always()
        run: python scripts/audit_prebreakout_slots.py --lookback-days 1
