name: Patch market dossier signals

on:
  push:
    branches:
      - refactor/market-dossier-signals-20260901

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/market-dossier-signals-20260901
          fetch-depth: 0
      - name: Apply guarded extraction
        run: |
          python scripts/_patch_market_dossier_signals.py
          node --check market-dossier-signals.js
          node --check market.js
          node tests/runtime_market_dossier_signals_contract.js
          python scripts/runtime_js_audit.py
      - name: Commit extraction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market.js index.html sw.js
          git commit -m "refactor: extract dossier signals panels"
          git push origin HEAD:refactor/market-dossier-signals-20260901
