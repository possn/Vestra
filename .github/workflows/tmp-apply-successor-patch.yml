name: Temporary successor patch
on:
  push:
    branches: [fix/corporate-action-successor-symbols-20260902]
    paths:
      - .github/workflows/tmp-apply-successor-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/corporate-action-successor-symbols-20260902
          fetch-depth: 0
      - name: Apply deterministic successor patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/fundamentals.py')
          s = p.read_text(encoding='utf-8')
          old = 'import yfinance as yf\n\nlog = logging.getLogger("fundamentals")'
          new = 'import yfinance as yf\n\nfrom ticker_successors import successor_for, retrieval_symbol\n\nlog = logging.getLogger("fundamentals")'
          assert old in s
          s = s.replace(old, new, 1)

          old = '    quote_type: str | None = None\n\n    # profitability / quality'
          new = '    quote_type: str | None = None\n    retrieval_ticker: str | None = None\n    ticker_successor_effective_date: str | None = None\n    ticker_successor_source: str | None = None\n\n    # profitability / quality'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''def _yahoo_symbol(ticker: str) -> str:\n    \"\"\"Translate broker/DivTracker symbols to Yahoo symbols without changing\n    the canonical ticker stored by Finscanner. Crypto positions are exported\n    by DivTracker as e.g. BTC.CC while Yahoo uses BTC-USD.\"\"\"\n    t = str(ticker or \"\").strip().upper()\n    if t.endswith(\".CC\") and len(t) > 3:\n        return t[:-3] + \"-USD\"\n    return t\n'''
          new = '''def _yahoo_symbol(ticker: str) -> str:\n    \"\"\"Translate exact current retrieval identity without changing portfolio ticker.\n\n    Official corporate-action successors are resolved first; crypto broker symbols\n    then retain the existing .CC -> -USD translation. No fuzzy inference is used.\n    \"\"\"\n    t = retrieval_symbol(ticker)\n    if t.endswith(\".CC\") and len(t) > 3:\n        return t[:-3] + \"-USD\"\n    return t\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    m = RawMetrics(ticker=ticker)\n    yahoo_symbol = _yahoo_symbol(ticker)\n    try:\n'''
          new = '''    m = RawMetrics(ticker=ticker)\n    successor = successor_for(ticker)\n    yahoo_symbol = _yahoo_symbol(ticker)\n    if successor is not None:\n        m.retrieval_ticker = yahoo_symbol\n        m.ticker_successor_effective_date = successor.get(\"effective_date\")\n        m.ticker_successor_source = successor.get(\"source\")\n        log.info(\"%s: current retrieval via official successor %s\", ticker, yahoo_symbol)\n    try:\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('worker.js')
          s = p.read_text(encoding='utf-8')
          old = '  "CRSP": "CRSP",\n  "CRSP.SW": "CRSP"\n};'
          new = '  "CRSP": "CRSP",\n  "CRSP.SW": "CRSP",\n  "BITF": "KEEL",\n  "IINN": "QTEX"\n};'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/tmp-apply-successor-patch.yml
          git config user.name "vestra-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/fundamentals.py worker.js .github/workflows/tmp-apply-successor-patch.yml
          git commit -m "Route retired tickers through official successors"
          git push origin HEAD:fix/corporate-action-successor-symbols-20260902
