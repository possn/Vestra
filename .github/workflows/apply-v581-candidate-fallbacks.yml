name: Apply Vestra v5.8.1 candidate fallbacks

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v5.8-portfolio-risk-budget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v5.8-portfolio-risk-budget
          fetch-depth: 0
      - name: Apply and validate v5.8.1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v581_candidate_fallbacks.py
          rm -f scripts/apply_v581_candidate_fallbacks.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- market.js README.md sw.js
          git add -u scripts/apply_v581_candidate_fallbacks.py
          if git diff --cached --quiet; then
            echo "v5.8.1 already applied"
          else
            git commit -m "fix: Vestra v5.8.1 candidate fallbacks"
            git push origin HEAD:chatgpt/v5.8-portfolio-risk-budget
          fi
