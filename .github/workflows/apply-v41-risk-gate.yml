name: Apply Vestra v4.1 Risk Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v4.1-risk-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v4.1-risk-gate
          fetch-depth: 0
      - name: Apply and validate risk gate
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/apply_v41_risk_gate.py ]; then
            echo "Risk gate already applied."
            exit 0
          fi
          python scripts/apply_v41_risk_gate.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- scripts/score.py README.md sw.js
          git commit -m "fix: add structural risk gate to Vestra score"
          git push origin HEAD:chatgpt/v4.1-risk-gate
