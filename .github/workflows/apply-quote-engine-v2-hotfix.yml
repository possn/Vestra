name: Validate Quote Engine v2

on:
  workflow_dispatch:
  push:
    branches:
      - fix/quote-engine-v2-identity
    paths:
      - app.js
      - app-market-client.js
      - worker.js
      - tests/test_app_market_client.py
      - .github/workflows/apply-quote-engine-v2-hotfix.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quote-engine-v2-identity

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run quote and identity regression tests
        run: |
          python -m pip install -q pytest
          pytest -q \
            tests/test_app_market_client.py \
            tests/test_eu_quote_identity.py \
            tests/test_quote_currency_guard.py \
            tests/test_quote_error_classifier.py \
            tests/test_remaining_quote_identity.py \
            tests/test_runtime_regressions.py
