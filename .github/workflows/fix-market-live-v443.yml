name: Fix market live v4.43

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/triggers/v443-market-live.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current market UI exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('market.js')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'{label}: anchor missing')
              s=s.replace(old,new,1)

          # v4.43 marker + evidence-aware positive valuation multiples.
          once("  const compact = v => n(v) == null ? '—' : new Intl.NumberFormat('pt-PT',{notation:'compact',maximumFractionDigits:1}).format(n(v));",
               "  const compact = v => n(v) == null ? '—' : new Intl.NumberFormat('pt-PT',{notation:'compact',maximumFractionDigits:1}).format(n(v));\n  // Vestra Market v4.43 — verified live opportunity fallback.\n  const multiple = v => { const x=n(v); return x!=null && x>0 ? num(x) : '—'; };",
               'numeric helper')

          # Opportunity fallback is deliberately derived from fields already present in the published dataset.
          anchor="  function renderDiscover(){"
          helper=r'''  function opportunityTimingLive(s){
    const official=n(s?.opportunity_timing_score);
    if(official!=null) return official;
    const hist=Array.isArray(s?.price_history_1y)?s.price_history_1y:[];
    const closes=hist.map(x=>n(x?.close)).filter(x=>x!=null&&x>0);
    if(closes.length<22) return 50;
    const ret=d=>closes.length>d&&closes[closes.length-d-1]>0?(closes[closes.length-1]/closes[closes.length-d-1]-1)*100:null;
    const r20=ret(20), r60=ret(60), hi=Math.max(...closes), cur=closes[closes.length-1];
    const room=hi>0?(1-cur/hi)*100:null;
    let t=50;
    if(r20!=null) t += r20>=0&&r20<=12 ? 18 : r20>-6&&r20<0 ? 5 : r20>20 ? -15 : r20<=-12 ? -12 : 0;
    if(r60!=null) t += r60>=0&&r60<=25 ? 12 : r60>40 ? -12 : r60<=-20 ? -10 : 0;
    if(room!=null) t += room>=5&&room<=30 ? 8 : room<2 ? -8 : 0;
    if(txt(s?.estimate_signal)==='improving') t+=6;
    if(txt(s?.estimate_signal)==='deteriorating') t-=8;
    if(txt(s?.recovery_status)==='confirmed'||txt(s?.recovery_status)==='recovering') t+=5;
    return Math.max(0,Math.min(100,t));
  }

  function opportunityOverextendedLive(s){
    if(typeof s?.opportunity_overextended==='boolean') return s.opportunity_overextended;
    const hist=Array.isArray(s?.price_history_1y)?s.price_history_1y:[];
    const closes=hist.map(x=>n(x?.close)).filter(x=>x!=null&&x>0);
    if(closes.length<22) return false;
    const ret=d=>closes.length>d&&closes[closes.length-d-1]>0?(closes[closes.length-1]/closes[closes.length-d-1]-1)*100:null;
    const r20=ret(20),r60=ret(60);
    return (r20!=null&&r20>25)||(r60!=null&&r60>50);
  }

  function opportunityCandidateLive(s){
    const score=n(s?.score), coverage=n(s?.data_coverage_pct), confidence=n(s?.confidence_score), critical=n(s?.critical_metric_coverage_pct);
    const reliability=txt(s?.score_reliability).toLowerCase(), risk=txt(s?.risk_gate).toLowerCase();
    if(score==null||score<60||coverage==null||coverage<55||confidence==null||confidence<50) return false;
    if(critical!=null&&critical<35) return false;
    if(['insufficient','suppressed'].includes(reliability)||['high','severe'].includes(risk)||txt(s?.zombie)==='yes') return false;
    return !opportunityOverextendedLive(s);
  }

  function opportunityScoreLive(s){
    const official=n(s?.opportunity_score);
    if(official!=null&&s?.opportunity_eligible===true) return official;
    const score=n(s?.score), confidence=n(s?.confidence_score), timing=opportunityTimingLive(s), value=n(s?.value_pct), growth=n(s?.growth_pct);
    const parts=[[score,.55],[timing,.25],[confidence,.10],[value,.05],[growth,.05]].filter(([v])=>v!=null);
    if(!parts.length) return null;
    return Math.max(0,Math.min(100,parts.reduce((a,[v,w])=>a+v*w,0)/parts.reduce((a,[,w])=>a+w,0)));
  }

  function companyBrief(s){
    return txt(s?.business_summary)||[txt(s?.industry),txt(s?.sector)].filter(Boolean).join(' · ');
  }

'''
          if anchor not in s:
              raise SystemExit('renderDiscover anchor missing')
          s=s.replace(anchor,helper+anchor,1)

          once("  function renderRow(s, meta='', displayScore=null){",
               "  function renderRow(s, meta='', displayScore=null, description=''){"," + "
               'renderRow signature')
          once("<div><div class=\"market-row__title\"><span class=\"market-row__ticker\">${esc(s.ticker)}</span>${held?'<span class=\"market-held-badge\">Carteira</span>':''}<span class=\"market-row__name\">${esc(s.name||'')}</span></div><div class=\"market-row__meta\">${esc(sub)}</div>${(held||watched)?changeBadge(s):''}</div>",
               "<div><div class=\"market-row__title\"><span class=\"market-row__ticker\">${esc(s.ticker)}</span>${held?'<span class=\"market-held-badge\">Carteira</span>':''}<span class=\"market-row__name\">${esc(s.name||'')}</span></div>${description?`<div class=\"market-row__description\">${esc(description)}</div>`:''}<div class=\"market-row__meta\">${esc(sub)}</div>${(held||watched)?changeBadge(s):''}</div>",
               'renderRow body')

          once("    else rows=rows.filter(s=>n(s.opportunity_score)!=null && s.opportunity_eligible===true && n(s.opportunity_timing_score)>=55 && s.opportunity_overextended!==true && n(s.data_coverage_pct)>=55 && n(s.confidence_score)>=50 && txt(s.zombie)!=='yes');",
               "    else rows=rows.filter(s=>opportunityCandidateLive(s));",
               'discover filter')

          once("        const ob=n(b.opportunity_score)||0, oa=n(a.opportunity_score)||0;\n        if(ob!==oa) return ob-oa;\n        return (n(b.opportunity_timing_score)||0)-(n(a.opportunity_timing_score)||0);",
               "        const ob=opportunityScoreLive(b)||0, oa=opportunityScoreLive(a)||0;\n        if(ob!==oa) return ob-oa;\n        return (opportunityTimingLive(b)||0)-(opportunityTimingLive(a)||0);",
               'discover sort')

          old_list="      <div class=\"market-list\">${rows.length?rows.map(s=>renderRow(s,qs?'':[`Opportunity ${Math.round(n(s.opportunity_score))}/100`,txt(s.opportunity_label),txt(s.opportunity_timing_label),n(s.opportunity_timing_score)!=null?`Momento ${Math.round(n(s.opportunity_timing_score))}/100`:'',n(s.opportunity_return_20d_pct)!=null?`20d ${n(s.opportunity_return_20d_pct)>=0?'+':''}${num(s.opportunity_return_20d_pct)}%`:''].filter(Boolean).join(' · '),qs?null:s.opportunity_score)).join(''):'<div class=\"market-empty market-empty--filters\"><strong>Sem resultados neste filtro.</strong><span>Experimenta outro setor ou remove a pesquisa.</span></div>'}</div></section>`;"
          new_list="      <div class=\"market-list\">${rows.length?rows.map(s=>{if(qs)return renderRow(s);const os=opportunityScoreLive(s),timing=opportunityTimingLive(s);const meta=[os!=null?`Opportunity ${Math.round(os)}/100`:'',timing!=null?`Momento ${Math.round(timing)}/100`:'',txt(s.opportunity_label)].filter(Boolean).join(' · ');return renderRow(s,meta,os,companyBrief(s));}).join(''):'<div class=\"market-empty market-empty--filters\"><strong>Sem oportunidades neste momento.</strong><span>Não há empresas com evidência mínima e perfil suficientemente favorável neste filtro.</span></div>'}</div></section>`;"
          once(old_list,new_list,'discover list')

          # Never fabricate a 50/100 opportunity rank for insufficient low-52 evidence.
          once("  function low52OpportunityRank(s,stats){\n    const low=n(s.low52_score), recovery=n(s.recovery_score), quality=n(s.quality_pct), confidence=n(s.confidence_score);",
               "  function low52OpportunityRank(s,stats){\n    if(txt(s.low52_status)==='insufficient' || n(s.low52_score)==null) return null;\n    const low=n(s.low52_score), recovery=n(s.recovery_score), quality=n(s.quality_pct), confidence=n(s.confidence_score);",
               'low52 gate')
          once("    let score=weight?parts.reduce((a,b)=>a+b,0)/weight:50;",
               "    let score=weight?parts.reduce((a,b)=>a+b,0)/weight:null;\n    if(score==null) return null;",
               'low52 fallback')
          once("      .sort((a,b)=>b.opportunityRank-a.opportunityRank||a.stats.above-b.stats.above);",
               "      .sort((a,b)=>(b.opportunityRank??-1)-(a.opportunityRank??-1)||a.stats.above-b.stats.above);",
               'low52 sort')
          once("      const meta=[`Opportunity ${opportunityRank}/100`,`${dist.toFixed(1)}% acima do mínimo`,label,lowScore!=null?`Low52 ${Math.round(lowScore)}/100`:'',cause,trendText,recoveryLabel,recoveryScore!=null?`Recovery ${Math.round(recoveryScore)}/100`:'' ].filter(Boolean).join(' · ');",
               "      const meta=[opportunityRank!=null?`Opportunity ${opportunityRank}/100`:'Dados insuficientes para Opportunity Rank',`${dist.toFixed(1)}% acima do mínimo`,label,lowScore!=null?`Low52 ${Math.round(lowScore)}/100`:'',cause,trendText,recoveryLabel,recoveryScore!=null?`Recovery ${Math.round(recoveryScore)}/100`:'' ].filter(Boolean).join(' · ');",
               'low52 meta')

          # Negative/zero valuation multiples are not meaningful valuation multiples.
          s=s.replace('${num(s.forward_pe)}</strong></div><div class="market-metric"><small>ROE</small>', '${multiple(s.forward_pe)}</strong></div><div class="market-metric"><small>ROE</small>')
          s=s.replace('<small>P/E</small><strong>${num(s.trailing_pe)}</strong>', '<small>P/E</small><strong>${multiple(s.trailing_pe)}</strong>')
          s=s.replace('<small>Forward P/E</small><strong>${num(s.forward_pe)}</strong>', '<small>Forward P/E</small><strong>${multiple(s.forward_pe)}</strong>')
          s=s.replace('<small>EV/EBITDA</small><strong>${num(s.enterprise_to_ebitda)}</strong>', '<small>EV/EBITDA</small><strong>${multiple(s.enterprise_to_ebitda)}</strong>')

          p.write_text(s,encoding='utf-8')

          css=Path('market.css')
          c=css.read_text(encoding='utf-8')
          if 'Vestra Market v4.43' not in c:
              c += "\n/* Vestra Market v4.43 — company identity in opportunity cards */\n.market-row__description{font-size:11px;line-height:1.38;color:var(--text2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:560px}\n"
              css.write_text(c,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          if 'vestra-cache-v80' not in w:
              raise SystemExit('service-worker cache anchor missing')
          w=w.replace('vestra-cache-v80','vestra-cache-v81',1)
          sw.write_text(w,encoding='utf-8')
          PY
          node --check market.js

      - name: Commit live UI repair
        run: |
          git config user.name "vestra-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market.js market.css sw.js
          git diff --cached --check
          git commit -m "fix: deploy market opportunity repair v4.43"
          git pull --rebase origin main
          git push
