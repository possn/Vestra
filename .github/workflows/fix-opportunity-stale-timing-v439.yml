name: Fix opportunity stale timing fallback v4.39

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/triggers/v439-opportunity-stale-timing.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add safe client timing fallback until dataset rebuild lands
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('market.js')
          s=p.read_text(encoding='utf-8')

          anchor='''  function renderDiscover(){'''
          helper='''  function effectiveOpportunityTiming(s){
    const backend=n(s?.opportunity_timing_score);
    if(backend!=null) return backend;
    const hist=Array.isArray(s?.price_history_1y)?s.price_history_1y:[];
    const closes=hist.map(x=>n(x?.close)).filter(x=>x!=null&&x>0);
    if(closes.length<22) return null;
    const ret=(days)=>closes.length>days&&closes[closes.length-days-1]>0?(closes[closes.length-1]/closes[closes.length-days-1]-1)*100:null;
    const r20=ret(20), r60=ret(60);
    const high=Math.max(...closes), current=closes[closes.length-1];
    const room=high>0?Math.max(0,(1-current/high)*100):null;
    const band=(v,bands)=>{ if(v==null) return null; for(const [u,sc] of bands){ if(v<=u) return sc; } return bands[bands.length-1][1]; };
    const s20=band(r20,[[-12,20],[-5,38],[0,58],[4,86],[10,92],[16,72],[24,48],[1e9,28]]);
    const s60=band(r60,[[-25,18],[-10,35],[0,55],[8,82],[20,90],[30,75],[45,50],[1e9,30]]);
    const sRoom=room==null?null:room<2?48:room<5?62:room<=20?88:room<=35?72:room<=50?48:28;
    const parts=[[s20,.42],[s60,.36],[sRoom,.22]].filter(([v])=>v!=null);
    if(!parts.length) return null;
    let timing=parts.reduce((a,[v,w])=>a+v*w,0)/parts.reduce((a,[,w])=>a+w,0);
    const est=txt(s?.estimate_signal).toLowerCase(), rec=txt(s?.recovery_status).toLowerCase(), thesis=txt(s?.thesis_direction).toLowerCase();
    if(est==='improving') timing+=7; else if(est==='deteriorating') timing-=9;
    if(rec==='confirmed') timing+=8; else if(rec==='recovering') timing+=5; else if(rec==='failed'||rec==='bounce_only') timing-=9;
    if(thesis==='up') timing+=3; else if(thesis==='down') timing-=4;
    const over=(r20!=null&&r20>18)||(r60!=null&&r60>35)||(room!=null&&room<2&&r60!=null&&r60>20);
    const severe=(r20!=null&&r20>28)||(r60!=null&&r60>50);
    if(severe) timing-=18; else if(over) timing-=10;
    return Math.max(0,Math.min(100,timing));
  }

  function effectiveOpportunityOverextended(s){
    if(typeof s?.opportunity_overextended==='boolean') return s.opportunity_overextended;
    const hist=Array.isArray(s?.price_history_1y)?s.price_history_1y:[];
    const closes=hist.map(x=>n(x?.close)).filter(x=>x!=null&&x>0);
    if(closes.length<22) return false;
    const ret=(days)=>closes.length>days&&closes[closes.length-days-1]>0?(closes[closes.length-1]/closes[closes.length-days-1]-1)*100:null;
    const r20=ret(20), r60=ret(60), high=Math.max(...closes), current=closes[closes.length-1];
    const room=high>0?Math.max(0,(1-current/high)*100):null;
    return (r20!=null&&r20>18)||(r60!=null&&r60>35)||(room!=null&&room<2&&r60!=null&&r60>20);
  }

'''
          if 'function effectiveOpportunityTiming(s)' not in s:
              if anchor not in s: raise SystemExit('renderDiscover anchor not found')
              s=s.replace(anchor,helper+anchor,1)

          old="""    else rows=rows.filter(s=>n(s.opportunity_score)!=null && s.opportunity_eligible===true && n(s.opportunity_timing_score)>=55 && s.opportunity_overextended!==true && n(s.data_coverage_pct)>=55 && n(s.confidence_score)>=50 && txt(s.zombie)!=='yes');"""
          new="""    else rows=rows.filter(s=>n(s.opportunity_score)!=null && s.opportunity_eligible===true && effectiveOpportunityTiming(s)>=55 && effectiveOpportunityOverextended(s)!==true && n(s.data_coverage_pct)>=55 && n(s.confidence_score)>=50 && txt(s.zombie)!=='yes');"""
          if old not in s: raise SystemExit('strict opportunity filter anchor not found')
          s=s.replace(old,new,1)

          oldsort="""        return (n(b.opportunity_timing_score)||0)-(n(a.opportunity_timing_score)||0);"""
          newsort="""        return (effectiveOpportunityTiming(b)||0)-(effectiveOpportunityTiming(a)||0);"""
          if oldsort in s: s=s.replace(oldsort,newsort,1)

          oldmeta="""n(s.opportunity_timing_score)!=null?`Momento ${Math.round(n(s.opportunity_timing_score))}/100`:''"""
          newmeta="""effectiveOpportunityTiming(s)!=null?`Momento ${Math.round(effectiveOpportunityTiming(s))}/100`:''"""
          if oldmeta in s: s=s.replace(oldmeta,newmeta,1)

          oldempty='''<strong>Sem resultados neste filtro.</strong><span>Experimenta outro setor ou remove a pesquisa.</span>'''
          newempty='''<strong>Sem oportunidades emergentes neste filtro.</strong><span>Nenhuma empresa passou agora os critérios de evidência, momentum e preço não esticado.</span>'''
          if oldempty in s: s=s.replace(oldempty,newempty,1)

          p.write_text(s,encoding='utf-8')
          PY
          node --check market.js
      - name: Commit and push
        run: |
          git config user.name "vestra-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: keep opportunities usable while timing dataset refreshes"
            git pull --rebase origin main
            git push
          fi
