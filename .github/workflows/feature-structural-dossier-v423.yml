name: Vestra v4.23 Structural Dossier UI

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/v423-structural-dossier.txt'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add structural intelligence cards and strict data-quality copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('market.js')
          s=p.read_text()

          anchor="""  function investmentCase(s){"""
          helper=r'''  function structuralIntelligencePanel(s){
    if(isFund(s)) return '';
    const opp=n(s.opportunity_score), moat=n(s.moat_score), cap=n(s.capital_allocation_intelligence_score), qarp=n(s.qarp_score), trap=n(s.value_trap_risk_score), sector=n(s.sector_native_score);
    const coverage=n(s.data_coverage_pct), critical=n(s.critical_metric_coverage_pct), confidence=n(s.confidence_score);
    const label=txt(s.opportunity_label)||'Dados insuficientes';
    const eligible=s.opportunity_eligible===true && opp!=null;
    const values=[opp,moat,cap,qarp,trap,sector].filter(v=>v!=null);
    if(!values.length && coverage==null && confidence==null) return '';
    const reasons=Array.isArray(s.opportunity_reasons)?s.opportunity_reasons:[];
    const cautions=Array.isArray(s.opportunity_cautions)?s.opportunity_cautions:[];
    const suppressed=txt(s.opportunity_suppressed_reason);
    const score=v=>v==null?'—':Math.round(v)+'/100';
    const trapText=trap==null?'—':Math.round(trap)+'/100';
    return `<div class="market-detail-card market-structural-intelligence"><div class="market-perspective-head"><div><small>STRUCTURAL INTELLIGENCE</small><h4>${esc(label)}</h4></div><span class="market-data-age ${eligible?'is-positive':''}">${score(opp)}</span></div><div class="market-mini-grid"><div><small>Moat persistence</small><strong>${score(moat)}</strong></div><div><small>Capital allocation</small><strong>${score(cap)}</strong></div><div><small>QARP</small><strong>${score(qarp)}</strong></div><div><small>Value-trap risk</small><strong>${trapText}</strong></div><div><small>Modelo setorial</small><strong>${score(sector)}</strong></div><div><small>Cobertura crítica</small><strong>${critical==null?'—':Math.round(critical)+'%'}</strong></div></div>${reasons.length?`<div class="market-watchpoints">${reasons.slice(0,4).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}${cautions.length?`<p class="market-case-note">Atenção: ${cautions.slice(0,3).map(esc).join(' · ')}</p>`:''}${suppressed?`<p class="market-case-note"><strong>Ranking suprimido:</strong> ${esc(suppressed)}</p>`:''}<p class="market-case-note">O Opportunity Score só é apresentado quando há evidência fundamental suficiente; ausência de dados não é convertida em zero.</p></div>`;
  }

'''
          if 'function structuralIntelligencePanel(s)' not in s:
              if anchor not in s: raise SystemExit('investmentCase anchor missing')
              s=s.replace(anchor,helper+anchor,1)

          old="""${changePanel(s)}${drawdownPanel(s)}${recoveryPanel(s)}${catalystPanel(s)}"""
          new="""${changePanel(s)}${structuralIntelligencePanel(s)}${drawdownPanel(s)}${recoveryPanel(s)}${catalystPanel(s)}"""
          if old in s:
              s=s.replace(old,new,1)
          elif '${structuralIntelligencePanel(s)}' not in s:
              raise SystemExit('overview panel anchor missing')

          oldq="""<div class=\"market-metric\"><small>Cobertura</small><strong>${n(s.data_coverage_pct)==null?'—':Math.round(n(s.data_coverage_pct))+'%'}</strong></div><div class=\"market-metric\"><small>Confiança</small>"""
          newq="""<div class=\"market-metric\"><small>Cobertura</small><strong>${n(s.data_coverage_pct)==null?'—':Math.round(n(s.data_coverage_pct))+'%'}</strong></div><div class=\"market-metric\"><small>Cobertura crítica</small><strong>${n(s.critical_metric_coverage_pct)==null?'—':Math.round(n(s.critical_metric_coverage_pct))+'%'}</strong></div><div class=\"market-metric\"><small>Confiança</small>"""
          if oldq in s: s=s.replace(oldq,newq,1)

          oldcopy='O score só usa métricas disponíveis; valores ausentes não são tratados como zero. A confiança mede cobertura, não certeza do investimento.'
          newcopy='Valores ausentes aparecem como — e não contam como evidência. O Evidence Gate pode suprimir ou limitar o Score Vestra quando a cobertura global, a cobertura crítica ou a confiança são insuficientes.'
          s=s.replace(oldcopy,newcopy)

          p.write_text(s)
          PY
          node --check market.js

      - name: Bump frontend cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'market\.js\?v=[^"\']+', 'market.js?v=4.23', s)
          p.write_text(s)
          p=Path('service-worker.js')
          if p.exists():
              s=p.read_text()
              s=re.sub(r'vestra-cache-v\d+', 'vestra-cache-v88', s)
              p.write_text(s)
          PY

      - name: Verify expected UI integration
        run: |
          grep -q "function structuralIntelligencePanel" market.js
          grep -q "Cobertura crítica" market.js
          grep -q "Evidence Gate" market.js
          node --check market.js

      - name: Commit
        run: |
          git config user.name "vestra-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market.js index.html service-worker.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: add structural intelligence to company dossiers"
            git push
          fi
