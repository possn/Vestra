name: Fix low52 evidence-aware UI v4.31

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/triggers/v431-low52-evidence-ui.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply evidence-aware low52 UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('market.js')
          s=p.read_text()

          old="""  function low52OpportunityRank(s,stats){
    const low=n(s.low52_score), recovery=n(s.recovery_score), quality=n(s.quality_pct), confidence=n(s.confidence_score);
    const rel=n(s.sector_relative_return_1y_pct), upside=n(s.fair_value_upside_pct);
    const risk=txt(s.risk_gate).toLowerCase(), lowStatus=txt(s.low52_status), rec=txt(s.recovery_status);
    let parts=[], weight=0;
    const add=(v,w)=>{ if(v!=null){ parts.push(Math.max(0,Math.min(100,v))*w); weight+=w; } };
    add(low,0.35); add(recovery,0.25); add(quality,0.15); add(confidence,0.05);
    if(upside!=null) add(Math.max(0,Math.min(100,50+upside)),0.10);
    if(rel!=null) add(Math.max(0,Math.min(100,50+rel)),0.10);
    let score=weight?parts.reduce((a,b)=>a+b,0)/weight:50;
    if(lowStatus==='opportunity') score+=7;
    if(lowStatus==='watch') score+=2;
    if(lowStatus==='value_trap_risk') score-=18;
    if(lowStatus==='structural_risk') score-=30;
    if(rec==='confirmed') score+=8;
    else if(rec==='recovering') score+=5;
    else if(rec==='stabilizing') score+=2;
    else if(rec==='bounce_only') score-=7;
    else if(rec==='failed') score-=16;
    if(risk==='high') score-=25; else if(risk==='severe') score-=40;
    const dist=stats?.above; if(dist!=null && dist<=2) score+=2;
    return Math.round(Math.max(0,Math.min(100,score)));
  }
"""
          new="""  function low52OpportunityRank(s,stats){
    // Backend low52 intelligence owns eligibility. Never synthesize an
    // opportunity score when the dossier was suppressed for weak evidence.
    const lowStatus=txt(s.low52_status).toLowerCase();
    const low=n(s.low52_score);
    if(lowStatus==='insufficient' || low==null) return null;
    const recovery=n(s.recovery_score), quality=n(s.quality_pct), confidence=n(s.confidence_score);
    const rel=n(s.sector_relative_return_1y_pct), upside=n(s.fair_value_upside_pct);
    const risk=txt(s.risk_gate).toLowerCase(), rec=txt(s.recovery_status);
    let parts=[], weight=0;
    const add=(v,w)=>{ if(v!=null){ parts.push(Math.max(0,Math.min(100,v))*w); weight+=w; } };
    add(low,0.35); add(recovery,0.25); add(quality,0.15); add(confidence,0.05);
    if(upside!=null) add(Math.max(0,Math.min(100,50+upside)),0.10);
    if(rel!=null) add(Math.max(0,Math.min(100,50+rel)),0.10);
    if(!weight) return null;
    let score=parts.reduce((a,b)=>a+b,0)/weight;
    if(lowStatus==='opportunity') score+=7;
    if(lowStatus==='watch') score+=2;
    if(lowStatus==='value_trap_risk') score-=18;
    if(lowStatus==='structural_risk') score-=30;
    if(rec==='confirmed') score+=8;
    else if(rec==='recovering') score+=5;
    else if(rec==='stabilizing') score+=2;
    else if(rec==='bounce_only') score-=7;
    else if(rec==='failed') score-=16;
    if(risk==='high') score-=25; else if(risk==='severe') score-=40;
    const dist=stats?.above; if(dist!=null && dist<=2) score+=2;
    return Math.round(Math.max(0,Math.min(100,score)));
  }
"""
          if old not in s: raise SystemExit('low52OpportunityRank anchor not found')
          s=s.replace(old,new,1)

          old2="""      .map(x=>({...x,opportunityRank:low52OpportunityRank(x.s,x.stats)}))
      .sort((a,b)=>b.opportunityRank-a.opportunityRank||a.stats.above-b.stats.above);
"""
          new2="""      .map(x=>({...x,opportunityRank:low52OpportunityRank(x.s,x.stats)}))
      .sort((a,b)=>{
        const ar=a.opportunityRank, br=b.opportunityRank;
        if(ar==null && br!=null) return 1;
        if(ar!=null && br==null) return -1;
        if(ar!=null && br!=null && br!==ar) return br-ar;
        return a.stats.above-b.stats.above;
      });
"""
          if old2 not in s: raise SystemExit('low52 sort anchor not found')
          s=s.replace(old2,new2,1)

          old3="""      const meta=[`Opportunity ${opportunityRank}/100`,`${dist.toFixed(1)}% acima do mínimo`,label,lowScore!=null?`Low52 ${Math.round(lowScore)}/100`:'',cause,trendText,recoveryLabel,recoveryScore!=null?`Recovery ${Math.round(recoveryScore)}/100`:'' ].filter(Boolean).join(' · ');
"""
          new3="""      const opportunityText=opportunityRank==null?'Dados insuficientes':`Opportunity ${opportunityRank}/100`;
      const meta=[opportunityText,`${dist.toFixed(1)}% acima do mínimo`,label,lowScore!=null?`Low52 ${Math.round(lowScore)}/100`:'',cause,trendText,recoveryLabel,recoveryScore!=null?`Recovery ${Math.round(recoveryScore)}/100`:'' ].filter(Boolean).join(' · ');
"""
          if old3 not in s: raise SystemExit('low52 meta anchor not found')
          s=s.replace(old3,new3,1)

          old4="""<h3>Mínimos de 52 semanas</h3><p>Até 5% do mínimo, ordenados pelo Opportunity Rank: qualidade + valuation + causa da queda + setor + confirmação de recuperação.</p>"""
          new4="""<h3>Mínimos de 52 semanas</h3><p>Até 5% do mínimo. O Opportunity Rank só é mostrado quando o backend confirma evidência fundamental suficiente; dossiers insuficientes ficam identificados e ordenados no fim.</p>"""
          if old4 not in s: raise SystemExit('low52 copy anchor not found')
          s=s.replace(old4,new4,1)

          p.write_text(s)
          PY
          node --check market.js
      - name: Commit and push
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: make 52-week-low ranking evidence aware"
            git pull --rebase origin main
            git push
          fi
