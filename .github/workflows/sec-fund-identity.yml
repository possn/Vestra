name: SEC fund identity diagnostics

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/sec_fund_identity.py'
      - '.github/workflows/sec-fund-identity.yml'

permissions:
  contents: write

concurrency:
  group: sec-fund-identity-diagnostics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP dependency
        run: pip install requests

      - name: Validate module
        run: python -m py_compile scripts/sec_fund_identity.py

      - name: Refresh SEC fund identity diagnostics
        working-directory: scripts
        run: python sec_fund_identity.py

      - name: Surface SEC source diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/sec_fund_identity_audit.json')
          payload=json.loads(path.read_text())
          print(json.dumps({
              'source_state': payload.get('source_state'),
              'source': payload.get('source'),
              'transport': payload.get('transport'),
              'identity_scope': payload.get('identity_scope'),
              'sec_fund_identity_count': payload.get('sec_fund_identity_count'),
              'series_search_attempted': payload.get('series_search_attempted'),
              'series_search_matched': payload.get('series_search_matched'),
              'series_search_errors': payload.get('series_search_errors'),
              'source_diagnostics': payload.get('source_diagnostics'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Probe official SEC EFTS fallback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          url='https://efts.sec.gov/LATEST/search-index'
          headers={
              'User-Agent':'Vestra/4.0 (+https://github.com/possn/Vestra)',
              'Accept':'application/json',
          }
          params={
              'q':'BUG',
              'forms':'NPORT-P,N-PX',
              'from':'0',
          }
          probe={'url':url,'query':params,'status':None,'content_type':None,'hit_count':0,'hits':[],'error':None}
          try:
              response=requests.get(url,params=params,headers=headers,timeout=30)
              probe['status']=response.status_code
              probe['content_type']=response.headers.get('Content-Type')
              response.raise_for_status()
              payload=response.json()
              hits=((payload.get('hits') or {}).get('hits') or [])
              probe['hit_count']=len(hits)
              for hit in hits[:10]:
                  src=hit.get('_source') or {}
                  probe['hits'].append({
                      '_id':hit.get('_id'),
                      'ciks':src.get('ciks'),
                      'display_names':src.get('display_names'),
                      'form':src.get('form'),
                      'file_date':src.get('file_date'),
                      'adsh':src.get('adsh'),
                  })
          except Exception as exc:
              probe['error']=str(exc)
          Path('data/sec_efts_probe.json').write_text(json.dumps(probe,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(probe,ensure_ascii=False,indent=2))
          PY

      - name: Upload SEC identity diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: sec-fund-identity-diagnostic
          path: |
            data/sec_fund_identity_audit.json
            data/sec_efts_probe.json
          if-no-files-found: error
          retention-days: 7

      - name: Require usable SEC identity evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/sec_fund_identity_audit.json').read_text())
          state=p.get('source_state')
          assert state in {'remote','remote_series_search'}, state
          if state == 'remote':
              assert p.get('source') == 'https://www.sec.gov/files/company_tickers_mf.json', p.get('source')
              assert p.get('identity_scope') == 'complete', p.get('identity_scope')
              assert int(p.get('sec_fund_identity_count') or 0) >= 1000, p.get('sec_fund_identity_count')
          else:
              assert p.get('source') == 'https://www.sec.gov/cgi-bin/series', p.get('source')
              assert p.get('identity_scope') == 'unresolved_exact_search', p.get('identity_scope')
              source_diag=p.get('source_diagnostics') or {}
              sentinel=source_diag.get('series_sentinel') or {}
              assert sentinel.get('ticker') == 'BUG' and sentinel.get('matched') is True, sentinel
              assert int(p.get('series_search_attempted') or 0) > 0, p.get('series_search_attempted')
              assert int(p.get('series_search_errors') or 0) < int(p.get('series_search_attempted') or 0), (p.get('series_search_errors'),p.get('series_search_attempted'))
          print('SEC fund identity evidence:', state, 'confirmed=', p.get('sec_fund_identity_count'), 'attempted=', p.get('series_search_attempted'))
          PY

      - name: Publish diagnostics
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sec_fund_ticker_map.json data/sec_fund_identity_audit.json
          if git diff --cached --quiet; then
            echo "Sem alterações nos diagnósticos."
          else
            git commit -m "diagnostics: refresh SEC fund identity ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash scripts/publish_with_retry.sh origin main
          fi
