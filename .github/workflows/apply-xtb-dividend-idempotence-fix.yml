name: Apply isolated XTB dividend rebuild patch

on:
  push:
    branches:
      - fix/xtb-dividend-rebuild-idempotence-20260907
    paths:
      - .github/workflows/apply-xtb-dividend-idempotence-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/xtb-dividend-rebuild-idempotence-20260907
      - name: Apply exact minimal patch and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')

          old_events = 'let events = (bd.events || []).slice().sort((a, b) => String(a.dateTime || a.date).localeCompare(String(b.dateTime || b.date)));'
          new_events = 'let events = (bd.events || []).map(e => (e && typeof e === "object" ? { ...e } : e)).sort((a, b) => String(a.dateTime || a.date).localeCompare(String(b.dateTime || b.date)));'
          old_tax = 'e.taxEUR = (parseNum(e.taxEUR) || 0) + wht;'
          new_tax = 'e.taxEUR = wht;'

          if app.count(old_events) != 1:
              raise SystemExit(f'expected one raw-event shallow-copy line, found {app.count(old_events)}')
          if app.count(old_tax) != 1:
              raise SystemExit(f'expected one accumulating WHT line, found {app.count(old_tax)}')

          app = app.replace(old_events, new_events, 1).replace(old_tax, new_tax, 1)
          app_path.write_text(app, encoding='utf-8')

          test = '''from pathlib import Path\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\nAPP = (ROOT / "app.js").read_text(encoding="utf-8")\n\n\nclass XtbDividendRebuildIdempotenceTests(unittest.TestCase):\n    def test_rebuild_clones_raw_broker_events_before_annotation(self):\n        self.assertIn(\n            'let events = (bd.events || []).map(e => (e && typeof e === "object" ? { ...e } : e)).sort(',\n            APP,\n        )\n        self.assertNotIn(\n            'let events = (bd.events || []).slice().sort(',\n            APP,\n        )\n\n    def test_paired_xtb_withholding_replaces_working_tax_instead_of_accumulating(self):\n        self.assertIn('e.taxEUR = wht;', APP)\n        self.assertNotIn('e.taxEUR = (parseNum(e.taxEUR) || 0) + wht;', APP)\n        self.assertIn('XTB "Amount" on the Dividend row is already GROSS; only attach the tax.', APP)\n\n    def test_t212_direct_tax_semantics_are_not_changed(self):\n        self.assertIn('T212 "Total" is the GROSS amount in EUR, NOT net of withholding tax.', APP)\n        self.assertIn('XTB: "Amount" for Dividend is also gross', APP)\n\n\nif __name__ == "__main__":\n    unittest.main(verbosity=2)\n'''
          Path('tests/test_xtb_dividend_rebuild_idempotence.py').write_text(test, encoding='utf-8')
          PY
          rm .github/workflows/apply-xtb-dividend-idempotence-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/test_xtb_dividend_rebuild_idempotence.py .github/workflows/apply-xtb-dividend-idempotence-fix.yml
          git commit -m "Fix XTB dividend rebuild idempotence"
          git push origin HEAD:fix/xtb-dividend-rebuild-idempotence-20260907
