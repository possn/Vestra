name: Fix ETF patch validation runner
on:
  push:
    branches: [feature/etf-catalog-coverage-v2-20260908]
    paths: [.github/workflows/fix-etf-patch-runner.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/etf-catalog-coverage-v2-20260908
      - name: Fix validation command and self-remove
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/apply-etf-catalog-v2.yml')
          s=p.read_text(encoding='utf-8')
          old='          python -m pytest -q tests/test_market_etf_intelligence.py\n'
          new="          python -c \"import tests.test_market_etf_intelligence as t; [getattr(t,n)() for n in dir(t) if n.startswith('test_')]\"\n"
          if old not in s: raise SystemExit('validation command not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/fix-etf-patch-runner.yml').unlink()
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix ETF patch validation runner"
          git push origin HEAD:feature/etf-catalog-coverage-v2-20260908
