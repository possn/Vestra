name: Cleanup consumed one-shot workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-consumed-workflows.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove consumed migration workflows
        run: |
          set -euo pipefail
          files=(
            .github/workflows/activate-canonical-opportunities.yml
            .github/workflows/activate-portfolio-hierarchy.yml
            .github/workflows/add-dividend-reconciliation-ui.yml
            .github/workflows/bootstrap-market-shards.yml
            .github/workflows/cleanup-market-index-consumers.yml
            .github/workflows/cleanup-v452-opportunities.yml
            .github/workflows/cleanup-v452-politicians.yml
            .github/workflows/cleanup-v453-v454-politicians.yml
            .github/workflows/fix-broker-quote-currency.yml
            .github/workflows/fix-quote-ui-dividends.yml
            .github/workflows/fix-remaining-quote-identity.yml
            .github/workflows/harden-politicians-ui.yml
            .github/workflows/harden-worker-cors.yml
            .github/workflows/integrate-quote-error-classifier.yml
            .github/workflows/patch-ai-brief-native-index.yml
            .github/workflows/patch-congress-provenance.yml
            .github/workflows/patch-market-live-fields.yml
            .github/workflows/patch-market-low52-lazy.yml
            .github/workflows/patch-market-native-index.yml
            .github/workflows/promote-static-market-runtime.yml
            .github/workflows/refactor-app-financial-engine.yml
            .github/workflows/refactor-app-market-client.yml
            .github/workflows/refactor-app-return-assumptions.yml
            .github/workflows/refactor-app-stage1.yml
            .github/workflows/refactor-app-stage2.yml
            .github/workflows/refactor-app-stage3.yml
            .github/workflows/refactor-app-stage4.yml
            .github/workflows/refactor-app-stage5.yml
            .github/workflows/refactor-app-stage6.yml
            .github/workflows/refactor-app-stage7.yml
            .github/workflows/refactor-app-stage8.yml
            .github/workflows/refactor-app-stage9.yml
            .github/workflows/refactor-app-stage10.yml
            .github/workflows/refactor-app-stage11.yml
            .github/workflows/refactor-app-stage12.yml
            .github/workflows/refactor-app-stage13.yml
            .github/workflows/cleanup-consumed-workflows.yml
          )
          removed=0
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then rm "$f"; removed=$((removed+1)); fi
          done
          echo "Removed $removed consumed workflows"
          test "$removed" -ge 30
          test -f .github/workflows/architecture-invariants.yml
          test -f .github/workflows/update-market-data.yml
          test -f .github/workflows/update-politicians.yml
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'vestra-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A .github/workflows
          git diff --cached --check
          git commit -m 'chore: remove consumed migration workflows'
          git push
