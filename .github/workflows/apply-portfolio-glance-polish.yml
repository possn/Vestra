name: Apply portfolio glance polish link

on:
  push:
    branches:
      - fix/portfolio-glance-polish-20260907
    paths:
      - .github/workflows/apply-portfolio-glance-polish.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/portfolio-glance-polish-20260907
      - name: Patch index and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          anchor='<link href="styles.css?v=20260827v8" rel="stylesheet"/>'
          link='<link href="portfolio-glance-polish.css?v=1.0" rel="stylesheet"/>'
          if link not in text:
              if anchor not in text:
                  raise SystemExit('styles.css anchor missing')
              text=text.replace(anchor, anchor+'\n'+link, 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m unittest tests.test_portfolio_glance_polish
      - name: Commit clean patch
        run: |
          rm .github/workflows/apply-portfolio-glance-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html portfolio-glance-polish.css tests/test_portfolio_glance_polish.py .github/workflows/apply-portfolio-glance-polish.yml
          git commit -m "Polish portfolio summary card"
          git push
