name: Fix remaining quote identity
on:
  push:
    paths:
      - 'scripts/fix_remaining_quote_identity.py'
      - '.github/workflows/fix-remaining-quote-identity.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded repairs
        run: python scripts/fix_remaining_quote_identity.py
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Run regression suite
        run: python -m unittest discover -v -s tests -p 'test_*.py'
      - name: Validate diff
        run: git diff --check
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'vestra-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html sw.js tests/
          git commit -m 'fix: repair remaining quote identity edge cases'
          git push
