name: Apply market ideas and expanded themes patch

on:
  push:
    branches:
      - fix/market-ideas-expand-theme-universe-20260907
    paths:
      - .github/workflows/apply-market-ideas-expand.yml
      - tools/apply_market_ideas_expand_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/market-ideas-expand-theme-universe-20260907
      - name: Apply isolated market discovery patch
        run: python3 tools/apply_market_ideas_expand_patch.py
      - name: Commit clean patch
        run: |
          rm .github/workflows/apply-market-ideas-expand.yml tools/apply_market_ideas_expand_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Ideas and widen thematic discovery"
          git push origin HEAD:fix/market-ideas-expand-theme-universe-20260907
