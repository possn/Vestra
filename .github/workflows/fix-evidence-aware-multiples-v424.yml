name: Vestra v4.24 Evidence-aware Valuation Display

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/v424-evidence-display.txt'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden missing valuation display
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('market.js')
          s=p.read_text()
          anchor="  const num = v => n(v) == null ? '—' : new Intl.NumberFormat('pt-PT',{maximumFractionDigits:1}).format(n(v));\n"
          helper="  const positiveMultiple = v => { const x=n(v); return x==null || x<=0 ? '—' : new Intl.NumberFormat('pt-PT',{maximumFractionDigits:1}).format(x); };\n"
          if 'const positiveMultiple' not in s:
              if anchor not in s: raise SystemExit('num formatter anchor missing')
              s=s.replace(anchor,anchor+helper,1)
          for field in ('trailing_pe','forward_pe','enterprise_to_ebitda','peg_ratio'):
              s=s.replace('${num(s.'+field+')}', '${positiveMultiple(s.'+field+')}' )
          # Top summary and valuation tab must never render provider placeholder zero as a real multiple.
          if '${positiveMultiple(s.forward_pe)}' not in s:
              raise SystemExit('forward PE replacement missing')
          p.write_text(s)
          PY
          node --check market.js

      - name: Bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(); s=re.sub(r'market\.js\?v=[^"\']+', 'market.js?v=4.24', s); p.write_text(s)
          p=Path('service-worker.js')
          if p.exists():
              s=p.read_text(); s=re.sub(r'vestra-cache-v\d+', 'vestra-cache-v89', s); p.write_text(s)
          PY

      - name: Verify
        run: |
          grep -q "const positiveMultiple" market.js
          grep -q "positiveMultiple(s.forward_pe)" market.js
          grep -q "positiveMultiple(s.trailing_pe)" market.js
          grep -q "positiveMultiple(s.enterprise_to_ebitda)" market.js
          node --check market.js

      - name: Commit
        run: |
          git config user.name "vestra-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market.js index.html service-worker.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: display missing valuation multiples as em dash"
            git push
          fi
