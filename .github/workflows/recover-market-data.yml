name: Recover missing canonical market publication

# Only dispatch a fresh full rebuild when the 06:15 UTC publication is still absent.
# Never copy or synthesize historical data. The canonical workflow retains all guards.
on:
  schedule:
    # Redundant late-morning/afternoon checks tolerate missed GitHub schedules.
    # check_market_rebuild_due.py only dispatches if today's build is absent.
    - cron: '15 10,12,14 * * *'
  workflow_dispatch: {}
  # Independent scheduled event source in case this workflow's own cron is skipped.
  workflow_run:
    workflows: ["Update macro events"]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  check-and-recover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Require late-morning recovery window for upstream workflow events
        id: independent_window
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_SCHEDULED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          python - <<'PY'
          import datetime,os
          stamp=datetime.datetime.fromisoformat(os.environ["UPSTREAM_SCHEDULED_AT"].replace("Z","+00:00"))
          ready=10<=stamp.astimezone(datetime.timezone.utc).hour<=14
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as handle:
              handle.write(f"ready={str(ready).lower()}\n")
          print("Independent late-morning recovery window:",ready)
          PY
      - name: Validate canonical rebuild recovery
        run: python tests/test_check_market_rebuild_due.py
      - name: Check canonical publication freshness
        id: freshness
        if: github.event_name != 'workflow_run' || steps.independent_window.outputs.ready == 'true'
        run: |
          python scripts/check_market_rebuild_due.py
      - name: Dispatch validated canonical rebuild only when due
        if: steps.freshness.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-market-data.yml --ref main
