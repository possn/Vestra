name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - audit/cloudflare-worker-20260830
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cloudflare-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Vestra Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var BUILD_ID:${{ github.sha }}

      - name: Verify deployed Worker
        run: |
          python -m pip install --disable-pip-version-check requests
          python scripts/verify_worker_deployment.py \
            --url "https://delicate-bar-cc80.pedrossnunes.workers.dev" \
            --ticker MSFT \
            --ticker AAPL
