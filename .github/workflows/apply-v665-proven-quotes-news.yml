name: Apply Vestra v6.6.5 proven quotes and asset news
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'chatgpt/v6.6.5-proven-quotes-asset-news'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6.6.5-proven-quotes-asset-news
          fetch-depth: 0
      - name: Apply and validate v6.6.5
        run: |
          set -euo pipefail
          python scripts/apply_v665_proven_quotes_asset_news.py
          rm -f scripts/apply_v665_proven_quotes_asset_news.py
          python -m py_compile scripts/*.py
          node --check app.js
          node --check market.js
          node --check sw.js
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          if(!app.includes('async function fetchQuoteWithFallback(ref)')) throw new Error('missing proven fallback');
          if(!app.includes('mapWithConcurrency(tickerList, 8')) throw new Error('missing bounded concurrency');
          if(app.includes('quoteWorkerMode')) throw new Error('experimental quoteWorkerMode still present');
          const market=fs.readFileSync('market.js','utf8');
          if(!market.includes('Notícias de ${esc(s.name||s.ticker)}')) throw new Error('asset news UI missing');
          console.log('v6.6.5 runtime structure: ok');
          NODE
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add README.md app.js market.js sw.js scripts/news.py scripts/run.py
          git add -u scripts/apply_v665_proven_quotes_asset_news.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: Vestra v6.6.5 proven quotes and asset-specific news"
            git push origin HEAD:chatgpt/v6.6.5-proven-quotes-asset-news
          fi
