name: Apply Vestra v3.9 patch

on:
  push:
    branches:
      - chatgpt/v3.9-earnings-quality
    paths:
      - 'v39.part.*.b64'
      - '.github/workflows/apply-v39.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v3.9-earnings-quality' || github.ref == 'refs/heads/chatgpt/v3.9-earnings-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v3.9-earnings-quality
          fetch-depth: 0
      - name: Apply consolidated patch
        shell: bash
        run: |
          set -euo pipefail
          parts=(v39.part.*.b64)
          if [ ! -e "${parts[0]}" ]; then
            echo "Patch already applied; nothing to do."
            exit 0
          fi
          cat v39.part.*.b64 | base64 -d > /tmp/v39.patch
          git apply --check /tmp/v39.patch
          git apply /tmp/v39.patch
          rm -f v39.part.*.b64 .github/workflows/apply-v39.yml
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- README.md index.html market.css market.js sw.js DATA_SOURCES.md scripts/fundamentals.py scripts/run.py scripts/score.py scripts/sec_enrich.py
          git add -u
          git commit -m "feat: Vestra v3.9 earnings quality and capital allocation"
          git push origin HEAD:chatgpt/v3.9-earnings-quality
