name: Refactor app stage 10

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refactor_app_stage10.py'
      - '.github/workflows/refactor-app-stage10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded broker parsing core extraction
        run: python scripts/refactor_app_stage10.py
      - name: Validate JavaScript syntax
        run: |
          node --check app-broker-parsing-core.js
          node --check app.js
      - name: Validate broker parsing migration and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          a=Path('app.js').read_text()
          m=Path('app-broker-parsing-core.js').read_text()
          assert h.index('app-utils.js') < h.index('app-broker-parsing-core.js') < h.index('app.js')
          assert h.index('app-asset-identity.js') < h.index('app-broker-parsing-core.js')
          probes=['function normalizeISIN(','function detectBrokerRowsFormat(','function normalizeBrokerAction(','function brokerEventKey(','function brokerPositionKey(']
          for p in probes:
              assert p not in a
              assert p in m
          assert 'function repairBrokerIdentitiesFromHistory()' in a
          assert 'US7561091049' in m or 'REALTY' in a
          assert 'VestraBrokerParsingCore não foi carregado antes de app.js' in a
          PY
          git diff --check
      - name: Commit extracted broker parsing core
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html app-broker-parsing-core.js
          git commit -m 'refactor: move broker parsing core out of app monolith'
          git pull --rebase origin main
          git push
