name: Patch market low52 lazy compatibility

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_market_low52_lazy.py'
      - '.github/workflows/patch-market-low52-lazy.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/patch_market_low52_lazy.py
      - name: Validate JavaScript
        run: |
          node --check market.js
          grep -q 'low52_price_low' market.js
          grep -q 'fifty_two_week_low' market.js
      - name: Commit compatibility fix
        run: |
          git config user.name "vestra-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: keep 52-week lows working with lazy market index"
          git pull --rebase origin main
          git push
