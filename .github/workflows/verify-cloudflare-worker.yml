name: Verify Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'worker-router.js'
      - 'worker-ai-brief.js'
      - 'wrangler.toml'
      - 'scripts/verify_worker_deployment.py'
      - 'scripts/verify_learned_universe_deployment.py'
      - 'scripts/verify_ai_brief_deployment.py'
      - '.github/workflows/verify-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Verify production Worker
        env:
          VESTRA_WORKER_URL: https://delicate-bar-cc80.pedrossnunes.workers.dev
        run: |
          python -m py_compile scripts/verify_learned_universe_deployment.py scripts/verify_ai_brief_deployment.py
          for attempt in 1 2 3 4 5; do
            if python scripts/verify_worker_deployment.py --url "$VESTRA_WORKER_URL" --ticker MSFT --ticker AAPL \
              && python scripts/verify_learned_universe_deployment.py --url "$VESTRA_WORKER_URL" \
              && python scripts/verify_ai_brief_deployment.py --url "$VESTRA_WORKER_URL"; then
              exit 0
            fi
            echo "Production not aligned yet (attempt ${attempt}/5); waiting 15s for Cloudflare deployment..."
            sleep 15
          done
          exit 1
