name: Verify Cloudflare Worker

on:
  push:
    branches:
      - audit/cloudflare-worker-20260830
    paths:
      - 'scripts/verify_worker_deployment.py'
      - '.github/workflows/verify-cloudflare-worker.yml'
      - 'docs/CLOUDFLARE_DEPLOYMENT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Verify production Worker
        env:
          VESTRA_WORKER_URL: https://delicate-bar-cc80.pedrossnunes.workers.dev
        run: |
          python scripts/verify_worker_deployment.py "$VESTRA_WORKER_URL" --ticker MSFT --second-ticker AAPL
