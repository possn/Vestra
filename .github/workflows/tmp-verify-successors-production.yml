name: Temporary verify successor production
on:
  push:
    branches: [verify/successor-production-20260902]
    paths:
      - .github/workflows/tmp-verify-successors-production.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/successor-production-20260902
      - name: Verify successor quote and market production contracts
        run: |
          python - <<'PY'
          import requests
          base='https://delicate-bar-cc80.pedrossnunes.workers.dev'
          for old,new in [('BITF','KEEL'),('IINN','QTEX')]:
              for endpoint in ('quote','market'):
                  r=requests.get(f'{base}/{endpoint}',params={'ticker':old},timeout=25)
                  print(endpoint,old,r.status_code,r.text[:1200])
                  r.raise_for_status()
                  data=r.json()
                  assert data.get('ticker') == old, (endpoint, old, data.get('ticker'))
                  assert data.get('retrieval_ticker') == new, (endpoint, old, data.get('retrieval_ticker'))
                  if endpoint == 'quote':
                      assert float(data.get('price') or 0) > 0, data
                  else:
                      assert float(data.get('current_price') or 0) > 0, data
          r=requests.get(f'{base}/quotes',params={'tickers':'BITF,IINN'},timeout=25)
          print('batch',r.status_code,r.text[:1600])
          r.raise_for_status()
          data=r.json()
          assert set(data) >= {'BITF','IINN'}
          assert data['BITF'].get('ticker') == 'BITF' and data['BITF'].get('retrieval_ticker') == 'KEEL'
          assert data['IINN'].get('ticker') == 'IINN' and data['IINN'].get('retrieval_ticker') == 'QTEX'
          PY
      - name: Remove temporary workflow from verification branch
        if: always()
        run: |
          rm .github/workflows/tmp-verify-successors-production.yml
          git config user.name "vestra-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/tmp-verify-successors-production.yml
          git commit -m "Remove temporary successor production verifier"
          git push origin HEAD:verify/successor-production-20260902
