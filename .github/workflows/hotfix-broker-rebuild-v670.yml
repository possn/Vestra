name: Vestra v6.7.0 broker rebuild repair

# trigger touch 2026-08-23 10:53
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-broker-rebuild-v670.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch broker rebuild and force migration
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app.js')
          s = p.read_text()

          s, n = re.subn(r'const BROKER_REBUILD_SCHEMA_VERSION = 44;', 'const BROKER_REBUILD_SCHEMA_VERSION = 45;', s, count=1)
          if n != 1 and 'const BROKER_REBUILD_SCHEMA_VERSION = 45;' not in s:
              raise SystemExit('BROKER_REBUILD_SCHEMA_VERSION marker not found')

          old = '''    // Combine broker snapshot qty + ledger-reconstructed qty
    const snapshotQty     = p.hasSnapshot && p.snapshotQty > 0 ? p.snapshotQty : 0;
    const ledgerQty       = p.qty > 0 ? p.qty : 0;
    const finalQty        = snapshotQty + ledgerQty > 0 ? snapshotQty + ledgerQty : (snapshotQty || ledgerQty);
    // Value: snapshot market value (XTB) + ledger cost basis (T212 / XTB-cash-ops)
    const snapshotVal     = p.hasSnapshot && p.marketValueEUR > 0 ? p.marketValueEUR : 0;
    const ledgerCostBasis = p.ledgerCostBasis || 0;
    const ledgerVal       = ledgerQty > 0 && snapshotQty > 0 ? ledgerCostBasis
                          : ledgerQty > 0 ? (p.costBasis || ledgerCostBasis) : 0;
    let finalValue        = snapshotVal + ledgerVal > 0 ? snapshotVal + ledgerVal
                          : (snapshotVal || p.costBasis || ledgerVal);'''

          new = '''    // v6.7.0: a current broker snapshot is authoritative. Never add the
    // reconstructed ledger on top of it: that double-counted open positions and
    // let stale historical holdings survive. If no snapshot exists, use the ledger.
    const snapshotQty     = p.hasSnapshot && p.snapshotQty > 0 ? p.snapshotQty : 0;
    const ledgerQty       = p.qty > 0 ? p.qty : 0;
    const finalQty        = snapshotQty > 0 ? snapshotQty : ledgerQty;
    const snapshotVal     = p.hasSnapshot && p.marketValueEUR > 0 ? p.marketValueEUR : 0;
    const ledgerCostBasis = p.ledgerCostBasis || 0;
    const ledgerVal       = ledgerQty > 0 ? (p.costBasis || ledgerCostBasis) : 0;
    let finalValue        = snapshotVal > 0 ? snapshotVal : ledgerVal;'''

          if old not in s:
              if 'const finalQty        = snapshotQty > 0 ? snapshotQty : ledgerQty;' not in s:
                  raise SystemExit('authoritative snapshot block not found')
          else:
              s = s.replace(old, new, 1)

          p.write_text(s)

          idx = Path('index.html')
          h = idx.read_text()
          h = re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260823v11', h, count=1)
          idx.write_text(h)

          sw = Path('sw.js')
          w = sw.read_text()
          w = re.sub(r'const CACHE_NAME = "vestra-cache-v\d+";', 'const CACHE_NAME = "vestra-cache-v72";', w, count=1)
          sw.write_text(w)

      - name: Validate syntax
        run: node --check app.js

      - name: Commit hotfix
        run: |
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add app.js index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: v6.7.0 rebuild broker holdings from authoritative snapshots"
            git push
          fi
