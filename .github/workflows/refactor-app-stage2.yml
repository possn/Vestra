name: Refactor app stage 2

on:
  push:
    paths:
      - 'scripts/refactor_app_stage2.py'
      - '.github/workflows/refactor-app-stage2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refactor-app-stage2
  cancel-in-progress: true

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded extraction
        run: python scripts/refactor_app_stage2.py

      - name: Validate JavaScript syntax
        run: |
          node --check app-utils.js
          node --check app-feedback.js
          node --check app.js

      - name: Validate script ordering and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          tags=['src="app-utils.js?v=1.0"','src="app-feedback.js?v=1.0"','src="app.js?v=20260824v11"']
          assert all(t in s for t in tags)
          assert s.index(tags[0]) < s.index(tags[1]) < s.index(tags[2])
          print('script ordering: ok')
          PY
          git diff --check

      - name: Commit migrated feedback domain
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'vestra-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'refactor: extract contextual feedback from app monolith'
          git push
