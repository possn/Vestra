name: Coverage audit only

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/coverage_audit.py'
      - '.github/triggers/coverage-audit.txt'

permissions:
  contents: write

concurrency:
  group: coverage-audit-only
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate audit generator
        run: python -m py_compile scripts/coverage_audit.py

      - name: Build coverage audit from current stocks.json
        working-directory: scripts
        run: python coverage_audit.py

      - name: Commit audit
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/coverage_audit.json
          if git diff --cached --quiet; then
            echo "Audit unchanged."
          else
            git commit -m "diagnostics: update market coverage audit"
            git push
          fi
