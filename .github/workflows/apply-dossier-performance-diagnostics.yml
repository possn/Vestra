name: Apply dossier performance diagnostics

on:
  push:
    branches: [dossier-performance-diagnostics-20260830]
    paths:
      - 'scripts/patch_dossier_performance_diagnostics.py'
      - '.github/workflows/apply-dossier-performance-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dossier-performance-diagnostics-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/patch_dossier_performance_diagnostics.py
      - name: Validate focused contract
        run: |
          node --check market-data-loader.js
          python -m unittest tests.test_market_loader_invariants -v
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "vestra-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-data-loader.js index.html tests/test_market_loader_invariants.py
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "perf: measure dossier open and hydration latency"
            git push
          fi
