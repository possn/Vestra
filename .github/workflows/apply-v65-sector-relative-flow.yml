name: Apply Vestra v6.5 sector-relative drawdown and flow rankings
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'chatgpt/v6.5-sector-relative-drawdown-flow-rankings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6.5-sector-relative-drawdown-flow-rankings
          fetch-depth: 0
      - name: Apply and validate v6.5
        run: |
          set -euo pipefail
          python scripts/apply_v65_sector_relative_flow_rankings.py
          rm -f scripts/apply_v65_sector_relative_flow_rankings.py
          python -m py_compile scripts/*.py
          node --check app.js
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add scripts/run.py scripts/peer_drawdown.py app.js market.js README.md sw.js
          git add -u scripts/apply_v65_sector_relative_flow_rankings.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: Vestra v6.5 sector-relative drawdown and ranking repair"
            git push origin HEAD:chatgpt/v6.5-sector-relative-drawdown-flow-rankings
          fi
