name: Apply Vestra v6.0.1 action map filters

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v6.0.1-action-map-filters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6.0.1-action-map-filters
          fetch-depth: 0
      - name: Apply and validate v6.0.1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v601_action_map_filters.py
          rm -f scripts/apply_v601_action_map_filters.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- market.js market.css README.md sw.js
          git add -u scripts/apply_v601_action_map_filters.py
          if git diff --cached --quiet; then
            echo "v6.0.1 already applied"
          else
            git commit -m "fix: Vestra v6.0.1 action map filters"
            git push origin HEAD:chatgpt/v6.0.1-action-map-filters
          fi
