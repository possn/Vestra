name: Apply Vestra v6.3 research checkpoints and low52
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'chatgpt/v6.3-research-checkpoints-low52'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6.3-research-checkpoints-low52
          fetch-depth: 0
      - name: Apply and validate v6.3
        run: |
          set -euo pipefail
          python scripts/apply_v63_research_checkpoints_low52.py
          rm -f scripts/apply_v63_research_checkpoints_low52.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add scripts/run.py scripts/scanner.py market.js market.css README.md sw.js
          git add -u scripts/apply_v63_research_checkpoints_low52.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: Vestra v6.3 research checkpoints and low52 intelligence"
            git push origin HEAD:chatgpt/v6.3-research-checkpoints-low52
          fi
