name: Remove market fetch interceptor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/remove_market_fetch_interceptor.py'
      - '.github/workflows/remove-market-fetch-interceptor.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: remove-market-fetch-interceptor
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove global fetch interception
        run: python scripts/remove_market_fetch_interceptor.py
      - name: Validate lazy dossier architecture
        run: |
          node --check market-data-loader.js
          node --check market-hotfix.js
          python - <<'PY'
          from pathlib import Path
          loader=Path('market-data-loader.js').read_text()
          hotfix=Path('market-hotfix.js').read_text()
          market=Path('market.js').read_text()
          assert 'window.fetch =' not in loader
          assert 'sharedIndexPayload' not in loader
          assert 'dossiers-manifest.json' in loader
          assert 'data/dossiers/' in loader
          assert 'data/stocks.json?full=1' in loader
          assert "version:'2.0'" in loader
          assert 'market-data-loader.js?v=2.0' in hotfix
          start=market.index('async function ensureLoaded')
          end=market.index('\n  function ', start)
          block=market[start:end]
          assert 'stocks-index.json' in block
          assert block.index('stocks-index.json') < block.index('stocks.json')
          PY
          git diff --check
      - name: Commit interceptor removal
        run: |
          git config user.name 'vestra-refactor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-data-loader.js market-hotfix.js
          if git diff --cached --quiet; then
            echo 'Global fetch interceptor already removed.'
          else
            git commit -m 'refactor: remove global market fetch interceptor'
            git pull --rebase origin main
            git push
          fi
