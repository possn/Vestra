name: Activate canonical opportunities

on:
  push:
    branches: [main]
    paths:
      - 'scripts/activate_canonical_opportunities.py'
      - 'market-opportunities.js'
      - 'vestra-portfolio-focus.js'
      - '.github/workflows/activate-canonical-opportunities.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: activate-canonical-opportunities
  cancel-in-progress: true

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate canonical modules
        run: python scripts/activate_canonical_opportunities.py
      - name: Validate JavaScript and ranking invariants
        run: |
          node --check market-opportunities.js
          node --check vestra-portfolio-focus.js
          node --check market-hotfix.js
          python - <<'PY'
          from pathlib import Path
          h=Path('market-hotfix.js').read_text()
          o=Path('market-opportunities.js').read_text()
          f=Path('vestra-portfolio-focus.js').read_text()
          assert 'vestra-ux-v453.js' not in h
          assert 'market-opportunities.js?v=1.0' in h
          assert 'vestra-portfolio-focus.js?v=1.0' in h
          assert 'ux454-flow' not in h
          assert "fetch('./data/stocks-index.json'" in o
          assert "return timing(s)>=48 && confirmed(s)>=2" in o
          assert 'vestra-portfolio-focus-v1' in f
          PY
          git diff --check
      - name: Commit loader activation
        run: |
          git config user.name 'vestra-refactor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-hotfix.js
          if git diff --cached --quiet; then
            echo 'Canonical opportunity modules already active.'
          else
            git commit -m 'refactor: activate canonical market opportunities modules'
            git pull --rebase origin main
            git push
          fi
