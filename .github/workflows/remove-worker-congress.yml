name: Remove Worker Congress proxy

on:
  push:
    paths:
      - scripts/remove_worker_congress.py
      - .github/workflows/remove-worker-congress.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove dead Congress proxy
        run: python scripts/remove_worker_congress.py
      - name: Validate Worker
        run: |
          node --check worker.js
          ! grep -q "bargo.ai/free-apis/congress" worker.js
          ! grep -q 'url.pathname === "/congress"' worker.js
          ! grep -q "fetchCongressTrades" worker.js
          grep -q 'url.pathname === "/market"' worker.js
          git diff --check
      - name: Commit Worker cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git commit -m 'refactor: remove obsolete Congress proxy from Worker'
          git pull --rebase origin main
          git push