name: Apply market evaluation explainability

on:
  push:
    branches:
      - ux/explain-market-evaluations-20260830
    paths:
      - '.github/workflows/apply-market-evaluation-explainability.yml'
      - 'scripts/patch_market_evaluation_explainability.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/explain-market-evaluations-20260830
      - name: Apply guarded patch
        run: |
          python scripts/patch_market_evaluation_explainability.py
          python - <<'PY'
          from pathlib import Path
          p=Path('market.js')
          s=p.read_text(encoding='utf-8')
          old='O Score Vestra mede posição relativa, não retorno esperado.'
          new='O Score Vestra mede posição relativa; não é uma previsão de retorno nem retorno esperado.'
          if s.count(old)!=1:
              raise SystemExit(f'compat wording anchor mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate focused explainability contract
        run: |
          node --check market.js
          python -m unittest tests.test_market_score_explainability tests.test_market_evaluation_explainability_v2 -v
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market.js tests/test_market_evaluation_explainability_v2.py
          git diff --cached --quiet && exit 0
          git commit -m "ux: explain Vestra score valuation and risk"
          git push origin HEAD:ux/explain-market-evaluations-20260830
