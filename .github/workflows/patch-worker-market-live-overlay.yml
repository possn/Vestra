name: Patch Worker market live overlay

on:
  push:
    branches:
      - fix/worker-live-overlay-20260830
    paths:
      - '.github/workflows/patch-worker-market-live-overlay.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/worker-live-overlay-20260830
      - name: Apply guarded patch
        run: python scripts/patch_worker_market_live_overlay.py
      - name: Validate focused contract
        run: |
          node --check worker.js
          node --check market.js
          python -m unittest -v tests.test_worker_market_live_overlay
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker.js market.js index.html tests/test_worker_market_live_overlay.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: overlay fresh quotes on cached market detail"
          git push origin HEAD:fix/worker-live-overlay-20260830
