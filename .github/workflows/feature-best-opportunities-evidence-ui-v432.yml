name: Feature v4.32 Best Opportunities evidence-only UI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/triggers/best-opportunities-evidence-ui-v432.txt'

permissions:
  contents: write

jobs:
  patch-market-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch market.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('market.js')
          s=p.read_text(encoding='utf-8')

          old="""    else rows=rows.filter(s=>n(s.score)!=null && n(s.data_coverage_pct)>=65 && txt(s.zombie)!=='yes');"""
          new="""    else rows=rows.filter(s=>n(s.opportunity_score)!=null && s.opportunity_eligible===true && n(s.data_coverage_pct)>=55 && n(s.confidence_score)>=50 && txt(s.zombie)!=='yes');"""
          if old not in s:
              raise SystemExit('renderDiscover eligibility anchor not found')
          s=s.replace(old,new,1)

          old="""    if(!qs){
      const dir=x=>txt(x.thesis_direction)==='up'?5:txt(x.thesis_direction)==='down'?-5:0;
      const rank=x=>n(x.opportunity_score)??((n(x.score)||0)+dir(x)); rows.sort((a,b)=>rank(b)-rank(a));
    } else rows.sort((a,b)=>(n(b.score)||0)-(n(a.score)||0));"""
          new="""    if(!qs){
      rows.sort((a,b)=>(n(b.opportunity_score)||0)-(n(a.opportunity_score)||0));
    } else rows.sort((a,b)=>(n(b.score)||0)-(n(a.score)||0));"""
          if old not in s:
              raise SystemExit('renderDiscover ranking anchor not found')
          s=s.replace(old,new,1)

          old="""      <div class=\"market-list\">${rows.length?rows.map(s=>renderRow(s)).join(''):'<div class=\"market-empty market-empty--filters\"><strong>Sem resultados neste filtro.</strong><span>Experimenta outro setor ou remove a pesquisa.</span></div>'}</div></section>`;"""
          new="""      <div class=\"market-list\">${rows.length?rows.map(s=>renderRow(s,qs?'':[`Opportunity ${Math.round(n(s.opportunity_score))}/100`,txt(s.opportunity_label),`Confiança ${Math.round(n(s.confidence_score))}%`,`Cobertura ${Math.round(n(s.data_coverage_pct))}%`].filter(Boolean).join(' · '))).join(''):'<div class=\"market-empty market-empty--filters\"><strong>Sem oportunidades com evidência suficiente neste filtro.</strong><span>O ranking estrutural só inclui empresas que passaram os gates de cobertura, confiança e profundidade de sinais.</span></div>'}</div></section>`;"""
          if old not in s:
              raise SystemExit('renderDiscover list anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          node --check market.js
      - name: Commit and push
        run: |
          git config user.name "vestra-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: show only evidence-qualified Best Opportunities"
          git pull --rebase origin main
          git push
