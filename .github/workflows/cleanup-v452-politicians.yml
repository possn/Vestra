name: Cleanup v452 politicians

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cleanup_v452_politicians.py'
      - '.github/workflows/cleanup-v452-politicians.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded cleanup
        run: python scripts/cleanup_v452_politicians.py
      - name: Validate JavaScript and invariants
        run: |
          node --check vestra-ux-v452.js
          python - <<'PY'
          from pathlib import Path
          p=Path('vestra-ux-v452.js').read_text()
          for token in ('enhancePoliticians','applyPoliticianView','addPoliticianPulse','vestra-politician-favourites-v1','ux-politician-search','ux-politician-controls','ux-politician-pulse'):
              assert token not in p, token
          for token in ('refineOpportunities()','classifyPortfolioCards()','function jumpPortfolio(kind)'):
              assert token in p, token
          canonical=Path('politicians.js').read_text()
          assert "const VERSION='2.1';" in canonical
          assert 'vestra-politician-favourites-v2' in canonical
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'vestra-refactor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add vestra-ux-v452.js
          if git diff --cached --quiet; then
            echo 'No cleanup required.'
          else
            git commit -m 'refactor: remove duplicate politician UI from v452'
            git pull --rebase origin main
            git push
          fi
