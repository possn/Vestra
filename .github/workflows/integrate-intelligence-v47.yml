name: Vestra v4.7 integrate structural intelligence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate capital allocation and moat persistence
        shell: python
        run: |
          from pathlib import Path
          import re

          run=Path('scripts/run.py')
          s=run.read_text()
          anchor='from capital_risk import enrich as enrich_capital_risk\n'
          if anchor not in s:
              raise SystemExit('capital_risk import anchor missing')
          if 'from capital_allocation_intelligence import assess as assess_capital_allocation_intelligence' not in s:
              s=s.replace(anchor,anchor+'from capital_allocation_intelligence import assess as assess_capital_allocation_intelligence\n',1)
          if 'from moat import assess as assess_moat' not in s:
              insert='from capital_allocation_intelligence import assess as assess_capital_allocation_intelligence\n'
              s=s.replace(insert,insert+'from moat import assess as assess_moat\n',1)

          marker='        row["insider_reason"] = insider.get("reason")\n'
          if marker not in s:
              raise SystemExit('row integration marker missing')
          if 'row.update(assess_capital_allocation_intelligence(row))' not in s:
              s=s.replace(marker,'        try:\n            row.update(assess_capital_allocation_intelligence(row))\n        except Exception as _cap_exc:\n            log.debug("%s capital allocation intelligence unavailable: %s", s.ticker, _cap_exc)\n'+marker,1)
          if 'row.update(assess_moat(row))' not in s:
              capblock='        try:\n            row.update(assess_capital_allocation_intelligence(row))\n        except Exception as _cap_exc:\n            log.debug("%s capital allocation intelligence unavailable: %s", s.ticker, _cap_exc)\n'
              s=s.replace(capblock,capblock+'        try:\n            row.update(assess_moat(row))\n        except Exception as _moat_exc:\n            log.debug("%s moat persistence unavailable: %s", s.ticker, _moat_exc)\n',1)
          run.write_text(s)

          market=Path('market.js')
          m=market.read_text()
          marker='  function investmentCase(s){\n'
          if marker not in m:
              raise SystemExit('investmentCase marker missing')

          if 'function capitalAllocationPanel(s)' not in m:
              cap=r'''  function capitalAllocationPanel(s){
    const score=n(s.capital_allocation_intelligence_score), label=txt(s.capital_allocation_intelligence_label)||'Dados insuficientes';
    const comps=(s.capital_allocation_components&&typeof s.capital_allocation_components==='object')?s.capital_allocation_components:{};
    const reasons=Array.isArray(s.capital_allocation_reasons)?s.capital_allocation_reasons:[];
    const risks=Array.isArray(s.capital_allocation_risks)?s.capital_allocation_risks:[];
    const names={dilution_discipline:'Diluição',roce_efficiency:'ROCE',dividend_fcf_coverage:'Dividendos / FCF',buyback_quality:'Buybacks',sbc_discipline:'SBC',roce_persistence:'ROCE multi-ano'};
    const rows=Object.entries(comps).filter(([,v])=>n(v)!=null).map(([k,v])=>`<div class="market-dim"><div><div class="market-dim__label"><span>${esc(names[k]||k)}</span><strong>${Math.round(n(v))}</strong></div><div class="market-bar"><span style="width:${Math.max(0,Math.min(100,n(v)||0))}%"></span></div></div><span></span></div>`).join('');
    if(score==null&&!rows) return '';
    const tone=score>=75?'is-positive':score<45?'is-negative':'';
    return `<div class="market-detail-card"><div class="market-perspective-head"><div><small>CAPITAL ALLOCATION</small><h4>Disciplina por ação</h4></div><span class="market-consensus ${tone}">${score==null?esc(label):Math.round(score)+'/100 · '+esc(label)}</span></div>${rows?`<div style="margin-top:12px">${rows}</div>`:''}${reasons.length?`<div class="market-signal-row" style="margin-top:12px">${reasons.map(x=>`<span class="market-signal">↑ ${esc(x)}</span>`).join('')}</div>`:''}${risks.length?`<ul class="market-case-list" style="margin-top:12px">${risks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<p class="market-case-note">Avalia diluição, eficiência do capital, cobertura de dividendos, buybacks, SBC e persistência de ROCE sem preencher métricas em falta.</p></div>`;
  }

'''
              m=m.replace(marker,cap+marker,1)

          if 'function moatPanel(s)' not in m:
              moat=r'''  function moatPanel(s){
    const score=n(s.moat_score), label=txt(s.moat_label);
    const comps=(s.moat_components&&typeof s.moat_components==='object')?s.moat_components:{};
    const reasons=Array.isArray(s.moat_reasons)?s.moat_reasons:[];
    const labels={durable:'Persistência forte',promising:'Sinais promissores',mixed:'Misto',weak:'Fraco',insufficient:'Dados insuficientes'};
    const names={margin_persistence:'Margens',capital_efficiency:'ROE / ROCE',growth_quality:'Crescimento por ação',pricing_power_proxy:'Pricing power proxy',cash_quality:'Qualidade do caixa',structural_trend:'Tendência estrutural'};
    const rows=Object.entries(comps).filter(([,v])=>n(v)!=null).map(([k,v])=>`<div class="market-dim"><div><div class="market-dim__label"><span>${esc(names[k]||k)}</span><strong>${Math.round(n(v))}</strong></div><div class="market-bar"><span style="width:${Math.max(0,Math.min(100,n(v)||0))}%"></span></div></div><span></span></div>`).join('');
    if(score==null&&!rows) return '';
    const tone=score>=80?'is-positive':score<50?'is-negative':'';
    return `<div class="market-detail-card"><div class="market-perspective-head"><div><small>STRUCTURAL QUALITY</small><h4>Persistência económica / moat proxy</h4></div><span class="market-consensus ${tone}">${score==null?esc(labels[label]||label||'—'):Math.round(score)+'/100 · '+esc(labels[label]||label||'')}</span></div>${rows?`<div style="margin-top:12px">${rows}</div>`:''}${reasons.length?`<div class="market-signal-row" style="margin-top:12px">${reasons.map(x=>`<span class="market-signal">${esc(x)}</span>`).join('')}</div>`:''}<p class="market-case-note">Não afirma a existência de um moat. Mede persistência observável de margens, eficiência de capital, crescimento sem diluição e qualidade do caixa.</p></div>`;
  }

'''
              m=m.replace(marker,moat+marker,1)

          # Place both overlays in the financial dossier. Idempotent replacements.
          fin="if(tab==='financials') body.innerHTML=`"
          if fin in m and '${capitalAllocationPanel(s)}' not in m:
              m=m.replace(fin,"if(tab==='financials') body.innerHTML=`${capitalAllocationPanel(s)}",1)
          fin2="if(tab==='financials') body.innerHTML=`${capitalAllocationPanel(s)}"
          if fin2 in m and '${moatPanel(s)}' not in m:
              m=m.replace(fin2,"if(tab==='financials') body.innerHTML=`${capitalAllocationPanel(s)}${moatPanel(s)}",1)
          market.write_text(m)

          idx=Path('index.html')
          h=idx.read_text()
          h=re.sub(r'market\.js\?v=[^\"\']+', 'market.js?v=20260823v9', h, count=1)
          idx.write_text(h)

          sw=Path('sw.js')
          w=sw.read_text()
          w=re.sub(r'vestra-cache-v\d+', 'vestra-cache-v83', w, count=1)
          sw.write_text(w)

      - name: Validate
        run: |
          python -m py_compile scripts/moat.py scripts/capital_allocation_intelligence.py scripts/run.py
          node --check market.js
          grep -q 'assess_moat' scripts/run.py
          grep -q 'assess_capital_allocation_intelligence' scripts/run.py
          grep -q 'function moatPanel' market.js
          grep -q 'function capitalAllocationPanel' market.js

      - name: Commit
        run: |
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add scripts/run.py market.js index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: integrate capital allocation and structural moat intelligence"
            git push
          fi
