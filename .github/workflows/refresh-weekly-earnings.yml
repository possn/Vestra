name: Refresh weekly earnings

on:
  schedule:
    - cron: "25 11-23 * * 1-5"
    - cron: "25 1,7 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_weekly_earnings.py'
      - 'tests/test_refresh_weekly_earnings.py'
      - '.github/workflows/refresh-weekly-earnings.yml'
  workflow_run:
    workflows: ["Update market data"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: refresh-weekly-earnings
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install earnings dependencies
        run: pip install 'yfinance>=0.2.65' pandas

      - name: Validate refresher
        run: |
          python -m py_compile scripts/refresh_weekly_earnings.py
          python tests/test_refresh_weekly_earnings.py

      - name: Refresh near-term company earnings
        run: python scripts/refresh_weekly_earnings.py

      - name: Publish refreshed startup earnings
        run: |
          git config user.name "vestra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stocks-index.json data/stocks-startup.json
          if git diff --cached --quiet; then
            echo "Weekly earnings unchanged."
          else
            git commit -m "Actualização automática de resultados empresariais ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash scripts/publish_with_retry.sh origin main
          fi
