name: Browser E2E

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'scripts/**'
      - 'research/**'
      - 'tests/**/*.py'
      - 'data/stocks-index.json'
      - 'data/stocks-startup.json'
      - 'data/portfolio-sectors.json'
      - 'data/stocks-scanner.json'
      - 'data/dossiers-manifest.json'
      - 'data/dossiers/**'
      - 'tests/e2e/**'
      - 'package.json'
      - '.github/workflows/browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'scripts/**'
      - 'research/**'
      - 'tests/**/*.py'
      - 'data/stocks-index.json'
      - 'data/stocks-startup.json'
      - 'data/portfolio-sectors.json'
      - 'data/stocks-scanner.json'
      - 'data/dossiers-manifest.json'
      - 'data/dossiers/**'
      - 'tests/e2e/**'
      - 'package.json'
      - '.github/workflows/browser-e2e.yml'

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-iphone:
    runs-on: ubuntu-latest
    # Split the complete suite across two independent runners; all shards must pass.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install Playwright test runner
        run: npm install --no-audit --no-fund
      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit
      - name: Run critical iPhone/WebKit journeys
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - name: Upload WebKit visual evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit-evidence-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
