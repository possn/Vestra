name: Fix Discover emerging opportunities v4.36

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/triggers/v436-emerging-opportunities-ui.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Discover opportunity-first and timing-aware
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('market.js')
          s=p.read_text(encoding='utf-8')

          old="""    else rows=rows.filter(s=>n(s.score)!=null && n(s.data_coverage_pct)>=65 && txt(s.zombie)!=='yes');"""
          new="""    else rows=rows.filter(s=>n(s.opportunity_score)!=null && s.opportunity_eligible===true && n(s.opportunity_timing_score)>=55 && s.opportunity_overextended!==true && n(s.data_coverage_pct)>=55 && n(s.confidence_score)>=50 && txt(s.zombie)!=='yes');"""
          if old not in s:
              # v4.32 may have landed independently; accept its evidence-only filter as alternate anchor.
              old="""    else rows=rows.filter(s=>n(s.opportunity_score)!=null && s.opportunity_eligible===true && n(s.data_coverage_pct)>=55 && n(s.confidence_score)>=50 && txt(s.zombie)!=='yes');"""
          if old not in s:
              raise SystemExit('Discover eligibility anchor not found')
          s=s.replace(old,new,1)

          old="""    if(!qs){
      const dir=x=>txt(x.thesis_direction)==='up'?5:txt(x.thesis_direction)==='down'?-5:0;
      const rank=x=>n(x.opportunity_score)??((n(x.score)||0)+dir(x)); rows.sort((a,b)=>rank(b)-rank(a));
    } else rows.sort((a,b)=>(n(b.score)||0)-(n(a.score)||0));"""
          new="""    if(!qs){
      rows.sort((a,b)=>{
        const oa=n(a.opportunity_score)||0, ob=n(b.opportunity_score)||0;
        if(ob!==oa) return ob-oa;
        return (n(b.opportunity_timing_score)||0)-(n(a.opportunity_timing_score)||0);
      });
    } else rows.sort((a,b)=>(n(b.score)||0)-(n(a.score)||0));"""
          if old not in s:
              old="""    if(!qs){
      rows.sort((a,b)=>(n(b.opportunity_score)||0)-(n(a.opportunity_score)||0));
    } else rows.sort((a,b)=>(n(b.score)||0)-(n(a.score)||0));"""
          if old not in s:
              raise SystemExit('Discover ranking anchor not found')
          s=s.replace(old,new,1)

          old="""<p>${qs?'Pesquisa no universo global':'Oportunidade agora · qualidade estrutural + valuation + momentum emergente + confirmação de recuperação'}</p>"""
          new="""<p>${qs?'Pesquisa no universo global':'Oportunidades emergentes · empresas robustas com momentum a começar, sem preço excessivamente esticado'}</p>"""
          if old in s:
              s=s.replace(old,new,1)

          old="""'<div class=\"market-empty market-empty--filters\"><strong>Sem resultados neste filtro.</strong><span>Experimenta outro setor ou remove a pesquisa.</span></div>'"""
          new="""'<div class=\"market-empty market-empty--filters\"><strong>Sem oportunidades emergentes neste filtro.</strong><span>O Vestra exclui empresas sem evidência suficiente, com timing fraco ou com o preço já demasiado esticado.</span></div>'"""
          if old in s:
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          node --check market.js
      - name: Commit and push
        run: |
          git config user.name "vestra-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: rank Discover by emerging opportunities, not past winners"
            git pull --rebase origin main
            git push
          fi
