name: Patch instant portfolio open

on:
  push:
    branches:
      - fix/instant-portfolio-open-20260830
    paths:
      - '.github/workflows/patch-instant-portfolio-open.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instant-portfolio-open-20260830
      - name: Apply guarded patch
        run: python scripts/patch_instant_portfolio_open.py
      - name: Validate syntax and focused tests
        run: |
          node --check market-data-loader.js
          python -m unittest -v tests.test_market_loader_invariants
          grep -F 'market-data-loader.js?v=2.3' index.html
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market-data-loader.js index.html tests/test_market_loader_invariants.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: open portfolio before background hydration"
          git push origin HEAD:fix/instant-portfolio-open-20260830
