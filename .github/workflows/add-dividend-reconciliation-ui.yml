name: Add dividend reconciliation UI
on:
  push:
    paths:
      - 'scripts/add_dividend_reconciliation_ui.py'
      - '.github/workflows/add-dividend-reconciliation-ui.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add reconciliation UI
        run: python scripts/add_dividend_reconciliation_ui.py
      - name: Validate JavaScript syntax
        run: |
          node --check app-broker-normalization.js
          node --check app.js
      - name: Run regression suite
        run: python -m unittest discover -v -s tests -p 'test_*.py'
      - name: Validate diff
        run: git diff --check
      - name: Commit reconciliation UI
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'vestra-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html sw.js tests/
          git commit -m 'feat: surface broker dividend reconciliation'
          git pull --rebase origin main
          git push
