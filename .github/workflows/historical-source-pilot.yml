name: Historical source pilot (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Stooq and Yahoo without changing app data
        run: python research/probe_historical_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-source-probe
          path: research/source_probe_result.json
          retention-days: 7
