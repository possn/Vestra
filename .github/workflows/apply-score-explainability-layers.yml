name: Apply score explainability layers

on:
  push:
    branches:
      - improve/score-explainability-20260830
    paths:
      - '.github/workflows/apply-score-explainability-layers.yml'
      - 'scripts/patch_score_explainability_layers.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/score-explainability-20260830
      - name: Apply guarded patch
        run: |
          python scripts/patch_score_explainability_layers.py
          python - <<'PY'
          from pathlib import Path
          p=Path('market.js')
          s=p.read_text(encoding='utf-8')
          old='Quando falta um pilar, ele não vale zero: os pesos presentes são renormalizados.'
          new='Quando falta um pilar, ele não vale zero. Os pesos dos pilares disponíveis são renormalizados.'
          if s.count(old)!=1:
              raise SystemExit(f'renormalization wording anchor mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate focused explainability contract
        run: |
          node --check market.js
          python -m unittest tests.test_market_score_explainability -v
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market.js tests/test_market_score_explainability.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: explain Vestra score evaluation layers"
          git push origin HEAD:improve/score-explainability-20260830
