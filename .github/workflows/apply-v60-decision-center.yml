name: Apply Vestra v6.0 decision center

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v6.0-portfolio-decision-center'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v6.0-portfolio-decision-center
          fetch-depth: 0
      - name: Apply and validate v6.0
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v60_decision_center.py
          rm -f scripts/apply_v60_decision_center.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- market.js market.css README.md sw.js
          git add -u scripts/apply_v60_decision_center.py
          if git diff --cached --quiet; then
            echo "v6.0 already applied"
          else
            git commit -m "feat: Vestra v6.0 portfolio decision center"
            git push origin HEAD:chatgpt/v6.0-portfolio-decision-center
          fi
