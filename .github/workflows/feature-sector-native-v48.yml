name: Vestra v4.8 sector-native intelligence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/feature-sector-native-v48.yml'

permissions:
  contents: write

jobs:
  feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate moat, capital allocation and sector-native intelligence
        shell: python
        run: |
          from pathlib import Path
          import re

          # --- Sector-native overlay engine ---
          p=Path('scripts/sector_native.py')
          p.write_text(r'''"""Sector-native intelligence overlay for Vestra.

This layer does not replace the core score. It interprets the metrics that are
actually meaningful for each business model and leaves missing specialist data
missing rather than fabricating proxies.
"""
from __future__ import annotations


def _f(v):
    try:
        x=float(v)
        return x if x==x and abs(x)!=float('inf') else None
    except (TypeError, ValueError):
        return None


def _clip(x): return max(0.0,min(100.0,x))

def _avg(xs):
    xs=[x for x in xs if x is not None]
    return sum(xs)/len(xs) if xs else None

def _pct(v, good, bad, invert=False):
    v=_f(v)
    if v is None: return None
    if good==bad: return 50.0
    z=(v-bad)/(good-bad)*100.0
    z=_clip(z)
    return 100-z if invert else z


def assess(row:dict)->dict:
    model=str(row.get('score_model') or 'general')
    reasons=[]; risks=[]; c={}

    if model=='bank':
        c['profitability']=_avg([_pct(row.get('roe'),.18,0),_pct(row.get('roa'),.02,0)])
        c['efficiency']=_pct(row.get('efficiency_ratio_proxy'),.45,.80,invert=True)
        c['credit_cost']=_pct(row.get('provision_to_revenue'),.01,.15,invert=True)
        c['capital_proxy']=_pct(row.get('equity_to_assets'),.12,.04)
        c['nii_growth']=_pct(row.get('net_interest_income_yoy'),.12,-.08)
        if _f(row.get('efficiency_ratio_proxy')) is not None and _f(row.get('efficiency_ratio_proxy'))<.55: reasons.append('Boa eficiência operacional bancária')
        if _f(row.get('provision_to_revenue')) is not None and _f(row.get('provision_to_revenue'))>.10: risks.append('Provisões elevadas face à receita')
        note='Modelo bancário: rentabilidade, eficiência, provisões, capital contabilístico e crescimento de NII. CET1/NPL ficam em falta quando não existem.'
    elif model=='reit':
        c['ffo_quality']=_pct(row.get('reit_ffo_per_share_proxy'),3.0,0)
        c['p_ffo_value']=_pct(row.get('reit_p_ffo_proxy'),10,30,invert=True)
        c['leverage']=_pct(row.get('reit_net_debt_to_ebitda'),3,9,invert=True)
        c['distribution']=_pct(row.get('reit_ffo_payout_proxy'),.65,1.05,invert=True)
        if _f(row.get('reit_net_debt_to_ebitda')) is not None and _f(row.get('reit_net_debt_to_ebitda'))<5: reasons.append('Alavancagem REIT controlada')
        if _f(row.get('reit_ffo_payout_proxy')) is not None and _f(row.get('reit_ffo_payout_proxy'))>1: risks.append('Payout FFO acima de 100%')
        note='Modelo REIT: FFO/P-FFO, alavancagem e sustentabilidade da distribuição. AFFO/NAV/ocupação não são inventados.'
    elif model=='insurance':
        c['underwriting_proxy']=_pct(row.get('insurance_operating_ratio_proxy'),.75,1.10,invert=True)
        c['claims_load']=_pct(row.get('insurance_claims_to_revenue'),.45,.90,invert=True)
        c['capital_proxy']=_pct(row.get('insurance_equity_to_assets'),.20,.05)
        c['book_value']=_pct(row.get('price_to_book'),1.0,3.0,invert=True)
        if _f(row.get('insurance_operating_ratio_proxy')) is not None and _f(row.get('insurance_operating_ratio_proxy'))<.90: reasons.append('Boa disciplina operacional seguradora')
        note='Modelo segurador: carga de sinistros/custos, capitalização contabilística e valuation por book value. Solvência regulatória não é inferida.'
    elif model=='utility':
        c['balance']=_avg([_pct(row.get('debt_to_equity'),.5,3.0,invert=True),_pct(row.get('interest_coverage'),6,1)])
        c['income']=_avg([_pct(row.get('dividend_yield'),.05,0),_pct(row.get('payout_ratio'),.55,1.1,invert=True)])
        c['capital_efficiency']=_pct(row.get('roce_proxy'),.12,0)
        c['stability']=_pct(row.get('beta'),.4,1.4,invert=True)
        if _f(row.get('interest_coverage')) is not None and _f(row.get('interest_coverage'))<2: risks.append('Cobertura de juros fraca para utility')
        note='Modelo utility: resiliência financeira, rendimento, eficiência de capital e estabilidade; crescimento recebe menor importância.'
    elif model=='energy':
        c['cash_generation']=_pct(row.get('fcf_yield'),.12,-.02)
        c['capital_efficiency']=_pct(row.get('roce_proxy'),.18,0)
        c['balance']=_avg([_pct(row.get('debt_to_equity'),.4,2.5,invert=True),_pct(row.get('interest_coverage'),7,1)])
        c['valuation']=_avg([_pct(row.get('enterprise_to_ebitda'),4,12,invert=True),_pct(row.get('forward_pe'),8,22,invert=True)])
        note='Modelo energia: geração de caixa, eficiência de capital, balanço e valuation cíclico dominam a leitura.'
    elif model=='biotech':
        cash=_f(row.get('total_cash')); fcf=_f(row.get('free_cash_flow'))
        runway=(cash/abs(fcf)) if cash is not None and fcf is not None and fcf<0 and cash>0 else None
        c['cash_runway']=_pct(runway,3.0,.5)
        c['dilution']=_pct(row.get('diluted_shares_yoy'),-.02,.25,invert=True)
        c['growth']=_avg([_pct(row.get('revenue_growth'),.40,-.20),_pct(row.get('eps_yoy_latest'),.40,-.40)])
        c['gross_margin']=_pct(row.get('gross_margin'),.80,.20)
        if runway is not None and runway<1: risks.append('Runway de caixa inferior a ~1 ano')
        if _f(row.get('diluted_shares_yoy')) is not None and _f(row.get('diluted_shares_yoy'))>.15: risks.append('Diluição elevada')
        note='Modelo biotech: runway, liquidez, diluição e progresso operacional. Pipeline clínico não é inferido a partir de contas.'
    elif model=='growth_tech':
        c['growth']=_avg([_pct(row.get('revenue_growth'),.35,0),_pct(row.get('eps_yoy_latest'),.35,-.20)])
        c['execution']=_avg([_pct(row.get('revenue_yoy_acceleration_pp'),15,-15),_pct(row.get('net_margin_yoy_change_pp'),8,-8)])
        c['cash_quality']=_avg([_pct(row.get('cash_conversion_ratio'),1.3,.4),_pct(row.get('fcf_margin'),.25,-.05)])
        c['dilution_sbc']=_avg([_pct(row.get('diluted_shares_yoy'),-.02,.15,invert=True),_pct(row.get('sbc_to_revenue'),.02,.15,invert=True)])
        c['valuation']=_avg([_pct(row.get('forward_pe'),18,55,invert=True),_pct(row.get('fcf_yield'),.08,0)])
        if _f(row.get('sbc_to_revenue')) is not None and _f(row.get('sbc_to_revenue'))>.10: risks.append('SBC elevada face à receita')
        note='Modelo growth-tech: crescimento, execução, conversão em caixa e disciplina de diluição/SBC; valuation não domina sozinho.'
    else:
        return {'sector_native_score':None,'sector_native_label':'Modelo geral','sector_native_components':{},'sector_native_reasons':[],'sector_native_risks':[],'sector_native_note':'Sem overlay sector-native adicional.'}

    vals=[v for v in c.values() if v is not None]
    score=round(sum(vals)/len(vals),1) if vals else None
    label='Forte' if score is not None and score>=75 else 'Sólido' if score is not None and score>=60 else 'Misto' if score is not None and score>=42 else 'Fraco' if score is not None else 'Dados insuficientes'
    return {'sector_native_score':score,'sector_native_label':label,'sector_native_components':{k:(round(v,1) if v is not None else None) for k,v in c.items()},'sector_native_reasons':reasons[:4],'sector_native_risks':risks[:4],'sector_native_note':note}
''')

          # --- Pipeline integration, including v4.7 overlays if the earlier workflow failed ---
          run=Path('scripts/run.py'); s=run.read_text()
          import_anchor='from capital_risk import enrich as enrich_capital_risk\n'
          imports=[
            ('from capital_allocation_intelligence import assess as assess_capital_allocation_intelligence\n','assess_capital_allocation_intelligence'),
            ('from moat import assess as assess_moat\n','assess_moat'),
            ('from sector_native import assess as assess_sector_native\n','assess_sector_native'),
          ]
          if import_anchor not in s: raise SystemExit('run.py import anchor missing')
          pos=s.index(import_anchor)+len(import_anchor)
          for line,name in imports:
            if line.strip() not in s:
              s=s[:pos]+line+s[pos:]; pos+=len(line)

          marker='        row["insider_reason"] = insider.get("reason")\n'
          if marker not in s: raise SystemExit('row integration marker missing')
          block='''        try:\n            row.update(assess_capital_allocation_intelligence(row))\n        except Exception as _exc:\n            log.debug("%s capital allocation overlay unavailable: %s", s.ticker, _exc)\n        try:\n            row.update(assess_moat(row))\n        except Exception as _exc:\n            log.debug("%s moat overlay unavailable: %s", s.ticker, _exc)\n        try:\n            row.update(assess_sector_native(row))\n        except Exception as _exc:\n            log.debug("%s sector-native overlay unavailable: %s", s.ticker, _exc)\n'''
          # Remove duplicate older blocks conservatively by only adding missing calls.
          add=''
          for call, chunk in [('assess_capital_allocation_intelligence(row)',block.split('        try:\n')[1] if False else '')]: pass
          if 'row.update(assess_capital_allocation_intelligence(row))' not in s: add += '''        try:\n            row.update(assess_capital_allocation_intelligence(row))\n        except Exception as _exc:\n            log.debug("%s capital allocation overlay unavailable: %s", s.ticker, _exc)\n'''
          if 'row.update(assess_moat(row))' not in s: add += '''        try:\n            row.update(assess_moat(row))\n        except Exception as _exc:\n            log.debug("%s moat overlay unavailable: %s", s.ticker, _exc)\n'''
          if 'row.update(assess_sector_native(row))' not in s: add += '''        try:\n            row.update(assess_sector_native(row))\n        except Exception as _exc:\n            log.debug("%s sector-native overlay unavailable: %s", s.ticker, _exc)\n'''
          if add: s=s.replace(marker,add+marker,1)
          run.write_text(s)

          # --- Dossier UI ---
          market=Path('market.js'); m=market.read_text()
          if 'function sectorNativePanel(s)' not in m:
            marker='  function investmentCase(s){\n'
            if marker not in m: raise SystemExit('market.js helper marker missing')
            helper=r'''  function sectorNativePanel(s){
    const score=n(s.sector_native_score), label=txt(s.sector_native_label)||'Dados insuficientes';
    const comps=(s.sector_native_components&&typeof s.sector_native_components==='object')?s.sector_native_components:{};
    const reasons=Array.isArray(s.sector_native_reasons)?s.sector_native_reasons:[];
    const risks=Array.isArray(s.sector_native_risks)?s.sector_native_risks:[];
    if(score==null&&!Object.keys(comps).length) return '';
    const names={profitability:'Rentabilidade',efficiency:'Eficiência',credit_cost:'Custo de crédito',capital_proxy:'Capital',nii_growth:'NII',ffo_quality:'FFO',p_ffo_value:'P/FFO',leverage:'Alavancagem',distribution:'Distribuição',underwriting_proxy:'Underwriting',claims_load:'Sinistros',book_value:'Book value',balance:'Balanço',income:'Rendimento',capital_efficiency:'Eficiência capital',stability:'Estabilidade',cash_generation:'Cash generation',valuation:'Valuation',cash_runway:'Runway',dilution:'Diluição',growth:'Crescimento',gross_margin:'Margem bruta',execution:'Execução',cash_quality:'Qualidade caixa',dilution_sbc:'Diluição / SBC'};
    const rows=Object.entries(comps).filter(([,v])=>n(v)!=null).map(([k,v])=>`<div class="market-dim"><div><div class="market-dim__label"><span>${esc(names[k]||k)}</span><strong>${Math.round(n(v))}</strong></div><div class="market-bar"><span style="width:${Math.max(0,Math.min(100,n(v)||0))}%"></span></div></div><span></span></div>`).join('');
    const tone=score>=75?'is-positive':score<42?'is-negative':'';
    return `<div class="market-detail-card"><div class="market-perspective-head"><div><small>SECTOR-NATIVE</small><h4>${esc(txt(s.score_model)||'Modelo específico')}</h4></div><span class="market-consensus ${tone}">${score==null?esc(label):Math.round(score)+'/100 · '+esc(label)}</span></div>${rows?`<div style="margin-top:12px">${rows}</div>`:''}${reasons.length?`<div class="market-signal-row" style="margin-top:12px">${reasons.map(x=>`<span class="market-signal">↑ ${esc(x)}</span>`).join('')}</div>`:''}${risks.length?`<ul class="market-case-list" style="margin-top:12px">${risks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<p class="market-case-note">${esc(txt(s.sector_native_note)||'Leitura adaptada ao modelo económico do setor.')}</p></div>`;
  }

'''
            m=m.replace(marker,helper+marker,1)
          # Add to overview before investment case, avoiding duplicate insertion.
          ov="if(tab==='overview') body.innerHTML=`"
          if ov in m and '${sectorNativePanel(s)}' not in m:
            m=m.replace(ov,"if(tab==='overview') body.innerHTML=`${sectorNativePanel(s)}",1)
          market.write_text(m)

          idx=Path('index.html'); h=idx.read_text()
          h=re.sub(r'market\.js\?v=[^\"\']+', 'market.js?v=20260823v10', h, count=1)
          idx.write_text(h)
          sw=Path('sw.js'); w=sw.read_text()
          w=re.sub(r'vestra-cache-v\d+', 'vestra-cache-v84', w, count=1)
          sw.write_text(w)

      - name: Validate
        run: |
          python -m py_compile scripts/sector_native.py scripts/moat.py scripts/capital_allocation_intelligence.py scripts/run.py
          node --check market.js
          grep -q 'assess_sector_native' scripts/run.py
          grep -q 'row.update(assess_moat(row))' scripts/run.py
          grep -q 'row.update(assess_capital_allocation_intelligence(row))' scripts/run.py
          grep -q 'function sectorNativePanel' market.js
          grep -q 'vestra-cache-v84' sw.js

      - name: Commit
        run: |
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add scripts/sector_native.py scripts/run.py market.js index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: integrate sector-native, moat and capital-allocation intelligence"
            git push
          fi
