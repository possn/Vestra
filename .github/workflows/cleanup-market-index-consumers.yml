name: Cleanup market index consumers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cleanup_market_index_consumers.py'
      - '.github/workflows/cleanup-market-index-consumers.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cleanup-market-index-consumers
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded cleanup
        run: python scripts/cleanup_market_index_consumers.py
      - name: Validate JavaScript and ownership invariants
        run: |
          node --check market-enhancements.js
          node --check vestra-ux-v456.js
          python - <<'PY'
          from pathlib import Path
          enh=Path('market-enhancements.js').read_text()
          swap=Path('vestra-ux-v456.js').read_text()
          canonical=Path('market-opportunities.js').read_text()
          assert 'repairOpportunities' not in enh
          assert 'function eligible(' not in enh
          assert 'function opportunities()' in canonical
          for source in (enh, swap):
              assert 'stocks-index.json' in source
              assert source.index('stocks-index.json') < source.index('stocks.json')
          assert 'installCollapsibles()' in enh
          assert 'repairDescription()' in enh
          assert 'comparisonHTML' in swap
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'vestra-refactor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-enhancements.js vestra-ux-v456.js
          if git diff --cached --quiet; then
            echo 'Market consumers already index-native.'
          else
            git commit -m 'perf: make remaining market consumers index-native'
            git pull --rebase origin main
            git push
          fi
