name: Patch market live fields

on:
  push:
    paths:
      - scripts/patch_market_live_fields.py
      - .github/workflows/patch-market-live-fields.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply live-field patch
        run: python scripts/patch_market_live_fields.py
      - name: Validate Market JavaScript
        run: |
          node --check market.js
          grep -q 'data-live-field="current_price"' market.js
          grep -q 'refreshOpenDossierLiveFields(s)' market.js
          grep -q "never rebuild an open dossier" market.js
          git diff --check
      - name: Commit non-blocking live refresh
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market.js
          git commit -m 'perf: refresh open dossier live metrics in place'
          git pull --rebase origin main
          git push