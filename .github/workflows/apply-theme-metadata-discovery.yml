name: Apply theme metadata discovery patch

on:
  push:
    branches:
      - fix/theme-metadata-discovery-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/theme-metadata-discovery-20260907
      - name: Apply patch
        run: python scripts/patch_theme_metadata_discovery.py
      - name: Validate targeted files
        run: |
          node --check market.js
          node --check market-stock-themes-tools.js
          python -m unittest tests.test_market_theme_universe
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market.js market-stock-themes-tools.js tests/e2e/market-stock-themes-tools.spec.js tests/test_market_theme_universe.py
          git diff --cached --quiet && exit 0
          git commit -m "Use explicit theme metadata in market discovery"
          git push
