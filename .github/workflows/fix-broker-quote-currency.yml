name: Fix broker quote currency guard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_broker_quote_currency_guard.py'
      - '.github/workflows/fix-broker-quote-currency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply broker currency repair
        run: python scripts/fix_broker_quote_currency_guard.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check app-market-client.js
          node --check worker.js
      - name: Run architecture invariants
        run: python -m unittest discover -v -s tests -p 'test_*.py'
      - name: Validate diff
        run: git diff --check
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'vestra-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html sw.js tests scripts/fix_broker_quote_currency_guard.py
          git commit -m 'fix: accept native quote currency for broker assets'
          git push
