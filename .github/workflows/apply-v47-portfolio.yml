name: Apply Vestra v4.7 portfolio intelligence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/v4.7-portfolio-intelligence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v4.7-portfolio-intelligence
          fetch-depth: 0
      - name: Apply and validate v4.7
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v47_portfolio_intelligence.py
          rm -f scripts/apply_v47_portfolio_intelligence.py
          python -m py_compile scripts/*.py
          node --check market.js
          node --check sw.js
          git config user.name "Vestra Build"
          git config user.email "actions@github.com"
          git add -- market.js README.md sw.js
          git add -u scripts/apply_v47_portfolio_intelligence.py
          if git diff --cached --quiet; then
            echo "v4.7 already applied"
          else
            git commit -m "feat: Vestra v4.7 portfolio intelligence"
            git push origin HEAD:chatgpt/v4.7-portfolio-intelligence
          fi
